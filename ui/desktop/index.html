<!doctype html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <!--
      BR-71 §4.3 — connect-src carries TWO WebSocket sources, and both are load-bearing.
      CSP will not stretch one scheme over another except on CSP3 §6.6.2.6's short list
      (http→https, ws→wss/http/https, wss→https). So `http://127.0.0.1:*` does NOT cover
      the loopback workspace socket and `https:` does NOT cover an external TLS backend's
      socket; each needs naming. Missing either blocks `hooks/useWorkspaceChannel.ts`
      before the request leaves the renderer, and every `workspace_list` then reports
      `gui_attached: false` with the app on screen — the whole GUI half silently inert.
      This policy and `buildConnectSrc()` in src/main.ts BOTH apply to the window and the
      stricter wins, so they must stay in step; `src/workspaceChannelCsp.test.ts` pins it.
      `wss:` is blanket where `ws:` is loopback-only, mirroring this policy's own
      cleartext-vs-TLS asymmetry for http (`http://127.0.0.1:*` vs blanket `https:`).

      `frame-src` is `'self'` alone: every frame this document creates is `srcdoc`,
      and the `blob: https: http:` it carried until September 2026 was dead — see the
      comment on the same directive in src/main.ts. The two must move together, which
      `src/frameSrcCsp.test.ts` pins.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; img-src 'self' data: blob: https:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https: wss:; object-src 'none'; font-src 'self' data: https:; media-src 'self' mediastream:; form-action 'none'; base-uri 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'self';"/>
    <title>Biorouter</title>
    <script>
      // Initialize theme before any content loads
      (function () {
        function initializeThemeFamily() {
          // The theme *family* (Parchment / Alma Mater / Roche Limit) is a
          // `data-theme` attribute, orthogonal to the dark class. Set it before
          // first paint so a non-default family does not flash Parchment on load.
          //
          // This list duplicates THEME_FAMILIES in src/contexts/ThemeContext.tsx
          // on purpose — this script runs ahead of the bundle and cannot import
          // TypeScript. Keep the two in lockstep when adding a family.
          /* THEMES:GENERATED:FAMILYLIST:START */
          const FAMILIES = ['parchment', 'alma-mater', 'roche-limit'];
/* THEMES:GENERATED:FAMILYLIST:END */
          try {
            const stored = window.localStorage && localStorage.getItem('theme_family');
            const fam = FAMILIES.indexOf(stored) !== -1 ? stored : 'parchment';
            document.documentElement.setAttribute('data-theme', fam);
          } catch (error) {
            document.documentElement.setAttribute('data-theme', 'parchment');
          }
        }

        function initializeTheme() {
          initializeThemeFamily();
          try {
            if (window.localStorage) {
              const useSystemTheme = localStorage.getItem('use_system_theme') === 'true';
              const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              const savedTheme = localStorage.getItem('theme');
              const isDark = useSystemTheme ? systemPrefersDark : (savedTheme ? savedTheme === 'dark' : systemPrefersDark);

              if (isDark) {
                document.documentElement.classList.add('dark');
              } else {
                document.documentElement.classList.remove('dark');
              }
            } else {
              const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              if (systemPrefersDark) {
                document.documentElement.classList.add('dark');
              }
            }
          } catch (error) {
            console.warn('Failed to initialize theme from localStorage, using system preference:', error);
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (systemPrefersDark) {
              document.documentElement.classList.add('dark');
            }
          }
        }

        // Run immediately
        initializeTheme();

        // Retry after DOM is ready if initial attempt failed
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initializeTheme, 50);
          });
        }
      })();
    </script>
    <link href="./src/styles/main.css" rel="stylesheet"/>
    <style id="br-boot-splash-style">
      /* ═══════════════════════════════════════════════════════════════════
         BOOT SPLASH — the screen shown while the app is still starting.

         Lives here, ahead of React, on purpose. `renderer.tsx` awaits
         `getBiorouterdHostPort()` *before* it calls `createRoot().render()`,
         so during backend startup — the slow case this screen exists for —
         React has not run and a <Suspense> fallback cannot paint. Only
         pre-React markup can cover that window.

         It reads the `data-theme` / `dark` state the script above already
         stamped on <html>, so it is theme-correct from the first frame.
         Spec: docs/superpowers/specs/2026-07-18-boot-splash-design.md
         ═══════════════════════════════════════════════════════════════════ */
      #br-boot {
        /* Parchment (the default family), light.

           These are LITERAL values, not var(--background-muted) and friends —
           but NOT for the reason this comment used to give. It claimed Tailwind
           v4's `@theme inline` "compiles those tokens away" so they "do not
           exist as runtime custom properties". That is false: a probe styled
           `background: var(--background-muted, magenta)` computes #f2f3f4, and
           injecting a whole new `[data-theme]` block at runtime recolours every
           utility correctly. The tokens are ordinary custom properties.

           The real reason is TIMING. This splash paints before the stylesheet
           has been applied — in dev, Vite injects main.css via JS after first
           paint — so a var() here resolves to its fallback during exactly the
           window the splash exists to fill. Hence literals.

           Most are no longer hand-copied: `npm run themes` generates every rule
           inside the THEMES:GENERATED:SPLASH region below, from each family's
           --background-muted. Edit the theme definition, not that region.

           THIS BLOCK IS THE EXCEPTION. These four values are Parchment LIGHT,
           and they are hand-written because this `#br-boot` rule is also the
           base every other rule cascades from — emitting a generated
           `html #br-boot` duplicate would give one ground two rules. They are
           pinned to parchment.theme.mjs by a test instead, so they cannot drift.

           --br-bg and --br-track are SHARED across families: the neutral set is
           one set, so every family's light splash is #f4f4f2 on the same
           hairline. Only --br-navy and --br-coral — the mark's ink and accent —
           vary, which is the same axis that distinguishes the families in the
           booted app. The ground mirrors --background-muted, which is what the
           post-boot Hub uses, so the hand-off has no colour jump.

           EVERY theme family needs a light and a dark rule below.
           boot-splash.test.ts cross-checks this list against THEME_FAMILIES in
           src/contexts/ThemeContext.tsx and fails if one is missing, so adding
           a family cannot silently regress this screen. */
        --br-bg: #f4f4f2;
        --br-navy: #052049;
        --br-coral: #b85a32;
        --br-track: #e4e4e0;

        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* NO `gap`, and the sweep is NOT in this flow — see .br-sweep below.
           The mark must be the ONLY in-flow child so that centring this column
           centres the MARK, not the mark-plus-sweep stack. */
        background: var(--br-bg);
        opacity: 1;
        transition: opacity 260ms cubic-bezier(0.2, 0, 0, 1);
      }
      /* `hidden` must beat the flex display above, hence the id+attr selector. */
      #br-boot[hidden] { display: none; }
      #br-boot.br-out { opacity: 0; }

      /* THEMES:GENERATED:SPLASH:START */
      html.dark #br-boot {
        --br-bg: #232320;
        --br-navy: #18a3ac;
        --br-coral: #b85a32;
        --br-track: #302f2c;
      }
      html[data-theme='alma-mater'] #br-boot {
        --br-bg: #f4f4f2;
        --br-navy: #052049;
        --br-coral: #16a0ac;
        --br-track: #e4e4e0;
      }
      html.dark[data-theme='alma-mater'] #br-boot {
        --br-bg: #232320;
        --br-navy: #18a3ac;
        --br-coral: #16a0ac;
        --br-track: #302f2c;
      }
      html[data-theme='roche-limit'] #br-boot {
        --br-bg: #f4f4f2;
        --br-navy: #1f1e1c;
        --br-coral: #ee6c1a;
        --br-track: #e4e4e0;
      }
      html.dark[data-theme='roche-limit'] #br-boot {
        --br-bg: #232320;
        --br-navy: #ededea;
        --br-coral: #ee6c1a;
        --br-track: #302f2c;
      }
/* THEMES:GENERATED:SPLASH:END */

      #br-boot .br-mark { width: 84px; height: 84px; display: block; }
      /* The mark is set in Inter (bundled @font-face in main.css), like the
         rest of the brand — never the native UI stack. */
      #br-boot .br-mark text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
      }
      #br-boot .br-navy { fill: var(--br-navy); }
      #br-boot .br-coral { fill: var(--br-coral); }
      #br-boot .br-part { opacity: 0; }

      /* The sweep is taken OUT OF THE FLEX FLOW on purpose, and anchored to the
         viewport centre rather than to the mark.

         It used to be a second in-flow child with `gap: 26px` on the container.
         That made the centred column 84 + 26 + 2 = 112px tall, so the MARK's
         centre sat 14px ABOVE the true viewport centre — while the very next
         screen (ProviderGuard's `isChecking` loader, which shows the same mark
         with no sweep) centres it exactly. Handing off jumped the logo down
         ~14px. Measured, not guessed: mark ink centre y was 447.59 on the
         splash vs 461.49 on the loader, in a 923px-tall viewport.

         Anchoring here keeps the sweep exactly where it was RELATIVE TO THE
         MARK — 26px below an 84px mark, i.e. 42 + 26 = 68px below centre — but
         it can no longer push the mark around. `#br-boot` is `position: fixed`,
         so it is the containing block. Keep these numbers in sync with
         `.br-mark`'s 84px and this rule's own 120px width. */
      #br-boot .br-sweep {
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: 68px; /* half the 84px mark + the 26px gap */
        margin-left: -60px; /* half of the 120px width */
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: var(--br-track);
        overflow: hidden;
        opacity: 0;
      }
      #br-boot .br-sweep i {
        position: absolute;
        inset: 0;
        display: block;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--br-navy), transparent);
        transform: translateX(-100%);
      }
      @keyframes br-boot-sweep { to { transform: translateX(100%); } }

      /* No visible text on this screen, so the only thing announcing the wait
         is this line. Without it a slow boot is silent to a screen reader. */
      #br-boot .br-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        #br-boot .br-part { opacity: 1; }
        #br-boot .br-sweep { opacity: 1; }
        #br-boot .br-sweep i { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- br-boot:start -->
    <div id="br-boot" hidden>
      <span class="br-sr" role="status">Loading BioRouter…</span>
      <!--
        The BR monogram, emitted as static geometry rather than measured at
        runtime like BioRouterMark.tsx does. On the boot path there is no time
        to wait for fonts before a getBBox() pass, and the numbers are
        deterministic for Inter 800 anyway. To regenerate after a brand change,
        render <BioRouterMark/> in a browser and copy the resulting viewBox and
        child coordinates. Reveal order is left to right: B, R, then the two
        halves of the underline.
      -->
      <svg class="br-mark" viewBox="-24.5235 -110.806 165.672 165.672" role="img" aria-label="BioRouter">
        <text class="br-part br-navy" x="0" y="0" font-size="100">B</text>
        <text class="br-part br-coral" x="68.140625" y="0" font-size="74">R</text>
        <rect class="br-part br-navy" x="0" y="23.36" width="66.640625" height="17.7"/>
        <rect class="br-part br-coral" x="66.640625" y="23.36" width="49.984375" height="17.7"/>
      </svg>
      <div class="br-sweep"><i></i></div>
    </div>
    <!-- br-boot:end -->
    <script id="br-boot-splash-script">
      /* Boot splash controller. Kept inline and dependency-free so it paints
         without waiting on the module graph. `boot-splash.test.ts` extracts
         and runs this exact source, so it is the tested artefact. */
      (function () {
        var THRESHOLD_MS = 400; // below this, a boot is fast enough to show nothing
        var DURATION_MS = 420;
        var STAGGER_MS = 70;
        var SLIDE_EM = 0.18;
        var BLUR_PX = 2;
        var EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
        var FADE_OUT_MS = 260;

        // Inside an SVG a CSS length is a user-space unit, not a device pixel,
        // so px and em have to be converted against the viewBox or the blur
        // would scale with the mark and read wrong at every size.
        var WORK = 100; // the B's font-size, i.e. 1em, in user units
        var VIEWBOX_SIDE = 165.672;
        var RENDERED_PX = 84;

        var el = document.getElementById('br-boot');
        if (!el) return;

        var showTimer = null;
        var removeTimer = null;
        var anims = [];
        var shown = false;
        var finished = false;

        function prefersReducedMotion() {
          return !!(
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          );
        }

        function show() {
          if (finished || shown) return;
          shown = true;
          showTimer = null;
          el.hidden = false;

          var parts = el.querySelectorAll('.br-part');
          var sweep = el.querySelector('.br-sweep');
          var bar = sweep ? sweep.querySelector('i') : null;

          // No Web Animations (jsdom, or reduced motion): render settled.
          if (prefersReducedMotion() || typeof el.animate !== 'function') {
            for (var s = 0; s < parts.length; s++) parts[s].style.opacity = '1';
            if (sweep) sweep.style.opacity = '1';
            return;
          }

          var unitsPerPx = VIEWBOX_SIDE / RENDERED_PX;
          var slideU = SLIDE_EM * WORK;
          var blurU = BLUR_PX * unitsPerPx;

          for (var i = 0; i < parts.length; i++) {
            anims.push(
              parts[i].animate(
                [
                  {
                    opacity: 0,
                    transform: 'translateX(-' + slideU.toFixed(2) + 'px)',
                    filter: 'blur(' + blurU.toFixed(2) + 'px)',
                  },
                  {
                    opacity: 0.7,
                    transform: 'translateX(-' + (slideU * 0.2222).toFixed(2) + 'px)',
                    filter: 'blur(' + (blurU * 0.3).toFixed(2) + 'px)',
                  },
                  { opacity: 1, transform: 'translateX(0px)', filter: 'blur(0px)' },
                ],
                {
                  duration: DURATION_MS,
                  easing: EASE,
                  delay: i * STAGGER_MS,
                  fill: 'forwards',
                }
              )
            );
          }

          var settle = (parts.length - 1) * STAGGER_MS + DURATION_MS;
          if (sweep) {
            anims.push(
              sweep.animate([{ opacity: 0 }, { opacity: 1 }], {
                duration: 260,
                easing: EASE,
                delay: Math.max(0, settle - 160),
                fill: 'forwards',
              })
            );
            if (bar) bar.style.animation = 'br-boot-sweep 1150ms cubic-bezier(.4,0,.2,1) infinite';
          }
        }

        function teardown() {
          if (removeTimer) {
            clearTimeout(removeTimer);
            removeTimer = null;
          }
          for (var i = 0; i < anims.length; i++) {
            try {
              anims[i].cancel();
            } catch (e) {
              /* already finished */
            }
          }
          anims = [];
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }

        // Called by renderer.tsx once React has actually mounted the app.
        function dismiss() {
          if (finished) return;
          finished = true;
          if (showTimer) {
            clearTimeout(showTimer);
            showTimer = null;
          }
          // Never crossed the threshold: drop it without a flash.
          if (!shown) {
            teardown();
            return;
          }
          el.classList.add('br-out');
          removeTimer = setTimeout(teardown, FADE_OUT_MS + 40);
          el.addEventListener('transitionend', teardown, { once: true });
        }

        showTimer = setTimeout(show, THRESHOLD_MS);

        window.__brBootSplash = {
          dismiss: dismiss,
          isShown: function () {
            return shown;
          },
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./src/renderer.tsx"></script>
  </body>
</html>
