<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <!--
      BR-71 §4.3 — connect-src carries TWO WebSocket sources, and both are load-bearing.
      CSP will not stretch one scheme over another except on CSP3 §6.6.2.6's short list
      (http→https, ws→wss/http/https, wss→https). So `http://127.0.0.1:*` does NOT cover
      the loopback workspace socket and `https:` does NOT cover an external TLS backend's
      socket; each needs naming. Missing either blocks `hooks/useWorkspaceChannel.ts`
      before the request leaves the renderer, and every `workspace_list` then reports
      `gui_attached: false` with the app on screen — the whole GUI half silently inert.
      This policy and `buildConnectSrc()` in src/main.ts BOTH apply to the window and the
      stricter wins, so they must stay in step; `src/workspaceChannelCsp.test.ts` pins it.
      ⚠ "BOTH apply" became true only in September 2026. Until then this window rendered in
      a `persist:` partition while every hook — the header included — sat on
      `session.defaultSession`, a different Session object, so this meta tag was the ONLY
      policy enforcing. `src/rendererSessionHooks.test.ts` pins the mechanism that makes the
      sentence true; a pin on the policy strings cannot see which of them is live.
      `wss:` is blanket where `ws:` is loopback-only, mirroring this policy's own
      cleartext-vs-TLS asymmetry for http (`http://127.0.0.1:*` vs blanket `https:`).

      `frame-src` is `'self'` alone: every frame this document creates is `srcdoc`,
      and the `blob: https: http:` it carried until September 2026 was dead — see the
      comment on the same directive in src/main.ts. The two must move together, which
      `src/frameSrcCsp.test.ts` pins.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; img-src 'self' data: blob: https:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https: wss:; object-src 'none'; font-src 'self' data: https:; media-src 'self' mediastream:; form-action 'none'; base-uri 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'self';"/>
    <title>Biorouter</title>
    <!--
      Relative on purpose. Vite emits it beside the bundle and rewrites this to
      `./assets/icon-<hash>.png`, which resolves against the `<base href>` the
      daemon writes, so a browser behind a proxy's path prefix asks for it
      under the prefix. Without a link at all a browser asks for `/favicon.ico`
      at the host's root, outside the prefix. Electron ignores it.
    -->
    <link rel="icon" type="image/png" href="./src/images/icon.png" />
    <script>
      // Initialize theme before any content loads
      (function () {
        function initializeThemeFamily() {
          // The theme *family* (Parchment / Alma Mater / Roche Limit) is a
          // `data-theme` attribute, orthogonal to the dark class. Set it before
          // first paint so a non-default family does not flash Parchment on load.
          //
          // This list duplicates THEME_FAMILIES in src/contexts/ThemeContext.tsx
          // on purpose — this script runs ahead of the bundle and cannot import
          // TypeScript. Keep the two in lockstep when adding a family.
          /* THEMES:GENERATED:FAMILYLIST:START */
          const FAMILIES = ['parchment', 'alma-mater', 'roche-limit'];
/* THEMES:GENERATED:FAMILYLIST:END */
          try {
            const stored = window.localStorage && localStorage.getItem('theme_family');
            const fam = FAMILIES.indexOf(stored) !== -1 ? stored : 'parchment';
            document.documentElement.setAttribute('data-theme', fam);
          } catch (error) {
            document.documentElement.setAttribute('data-theme', 'parchment');
          }
        }

        // Stamp the page's mode on <html> as a class, `dark` OR `light`, never
        // neither. ThemeContext tells a theme CHANGE from a mount by asking
        // whether the class it is about to apply is already there; a light page
        // used to carry no class at all, so every light mount looked like a
        // change and stilled every transition on <html> for two frames, which
        // included the boot splash's own 260 ms fade-out (vision FR-R4-1). The
        // two branches below and ThemeContext's answer to "which mode?" must
        // stay the same question, as loadThemePreference there already says.
        function applyMode(isDark) {
          const root = document.documentElement;
          root.classList.add(isDark ? 'dark' : 'light');
          root.classList.remove(isDark ? 'light' : 'dark');
        }

        function initializeTheme() {
          initializeThemeFamily();
          try {
            if (window.localStorage) {
              const useSystemTheme = localStorage.getItem('use_system_theme') === 'true';
              const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              const savedTheme = localStorage.getItem('theme');
              applyMode(useSystemTheme ? systemPrefersDark : (savedTheme ? savedTheme === 'dark' : systemPrefersDark));
            } else {
              applyMode(window.matchMedia('(prefers-color-scheme: dark)').matches);
            }
          } catch (error) {
            console.warn('Failed to initialize theme from localStorage, using system preference:', error);
            applyMode(window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
        }

        // Apply the text preference before the first paint.
        try {
          const sizes = { standard: 1, large: 1.07, larger: 1.15 };
          const stored = localStorage.getItem('app_font_size');
          const size = Object.prototype.hasOwnProperty.call(sizes, stored) ? stored : 'standard';
          document.documentElement.dataset.fontSize = size;
          document.documentElement.style.setProperty('--app-font-scale', String(sizes[size]));
        } catch (error) {
          document.documentElement.dataset.fontSize = 'standard';
          document.documentElement.style.setProperty('--app-font-scale', '1');
        }

        // Run immediately
        initializeTheme();

        // Retry after DOM is ready if initial attempt failed
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initializeTheme, 50);
          });
        }
      })();
    </script>
    <link href="./src/styles/main.css" rel="stylesheet"/>
    <style id="br-boot-splash-style">
      /* ═══════════════════════════════════════════════════════════════════
         BOOT SPLASH — the screen shown while the app is still starting.

         Lives here, ahead of React, on purpose. `renderer.tsx` awaits
         `getBiorouterdHostPort()` *before* it calls `createRoot().render()`,
         so during backend startup — the slow case this screen exists for —
         React has not run and a <Suspense> fallback cannot paint. Only
         pre-React markup can cover that window.

         It reads the `data-theme` / `dark` state the script above already
         stamped on <html>, so it is theme-correct from the first frame.
         Spec: docs/superpowers/specs/2026-07-18-boot-splash-design.md
         ═══════════════════════════════════════════════════════════════════ */
      #br-boot {
        /* The page ground, light.

           These are LITERAL values, not var(--background-canvas) and friends,
           for a reason of TIMING: this splash paints before the stylesheet has
           been applied (in dev, Vite injects main.css via JS after first
           paint), so a var() here would resolve to its fallback during exactly
           the window the splash exists to fill. The tokens themselves are
           ordinary custom properties; only their availability at this moment is
           the problem. (An earlier version of this comment blamed Tailwind's
           `@theme inline` for compiling them away. That is false.)

           THE GROUND IS THE PAGE'S. `--br-bg` is `--background-canvas`, the
           ground the first-run page, Home and the loader between them all paint.
           It used to be `--background-muted`, a grey one step off that ground,
           so a launch that crossed the threshold flashed grey before it faded
           onto white (vision FR-R1-7, R-34). `--background-app`, the window
           behind everything, is the same value today; the canvas is the one a
           person is looking at when this fades out.

           THE INKS ARE THE WORDMARK'S, AND THEY DO NOT FOLLOW THE FAMILY. What
           is drawn below is the Biorouter wordmark (R-29: the text logo is the
           logo), and `icons/BioRouterWordmark.tsx` is deliberately fixed to the
           brand colours in every family, so a splash that took Alma Mater's
           teal or Roche Limit's orange would hand off to a differently coloured
           logo one frame later. `npm run themes` writes every rule inside the
           THEMES:GENERATED:SPLASH region below: each family's own canvas, and
           the BASE family's mark inks for all of them. Edit the theme
           definitions, not that region.

           THIS BLOCK IS THE EXCEPTION. These four values are the base family,
           light, and they are hand-written because this `#br-boot` rule is also
           the base every other rule cascades from: emitting a generated
           `html #br-boot` duplicate would give one ground two rules. They are
           pinned to parchment.theme.mjs, and the inks to the wordmark's own
           constants, by boot-splash.test.ts, so they cannot drift.

           EVERY theme family needs a light and a dark rule below.
           boot-splash.test.ts cross-checks this list against THEME_FAMILIES in
           src/contexts/ThemeContext.tsx and fails if one is missing, so adding
           a family cannot silently regress this screen. */
        --br-bg: #ffffff;
        --br-navy: #052049;
        --br-coral: #b85a32;
        --br-track: #e4e4e0;

        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* NO `gap`, and the sweep is NOT in this flow, see .br-sweep below. The
           wordmark must be the ONLY in-flow child so that centring this column
           centres the WORDMARK, not the wordmark-plus-sweep stack. */
        background: var(--br-bg);
        opacity: 1;
        transition: opacity 260ms cubic-bezier(0.2, 0, 0, 1);
      }
      /* `hidden` must beat the flex display above, hence the id+attr selector. */
      #br-boot[hidden] { display: none; }
      #br-boot.br-out { opacity: 0; }

      /* THEMES:GENERATED:SPLASH:START */
      html.dark #br-boot {
        --br-bg: #131312;
        --br-navy: #18a3ac;
        --br-coral: #b85a32;
        --br-track: #302f2c;
      }
      html[data-theme='alma-mater'] #br-boot {
        --br-bg: #ffffff;
        --br-navy: #052049;
        --br-coral: #b85a32;
        --br-track: #e4e4e0;
      }
      html.dark[data-theme='alma-mater'] #br-boot {
        --br-bg: #131312;
        --br-navy: #18a3ac;
        --br-coral: #b85a32;
        --br-track: #302f2c;
      }
      html[data-theme='roche-limit'] #br-boot {
        --br-bg: #ffffff;
        --br-navy: #052049;
        --br-coral: #b85a32;
        --br-track: #e4e4e0;
      }
      html.dark[data-theme='roche-limit'] #br-boot {
        --br-bg: #131312;
        --br-navy: #18a3ac;
        --br-coral: #b85a32;
        --br-track: #302f2c;
      }
/* THEMES:GENERATED:SPLASH:END */

      /* The wordmark is drawn AT REST: no entrance, no stagger, no blur. A launch
         surface appears whole (spec principle 9), and the only thing that moves
         on this screen is the sweep below, a progress cue that stays inside
         `transform`. The box is the viewBox's own ratio (486.55 x 149.05).

         The `margin-top` centres the INK, not the box. The viewBox is padded
         around the text's line box, which carries ascender room above the
         capitals, so the lockup's ink (capital tops to the underline's bottom)
         sits 4px BELOW the box centre. Measured in Chromium at 2x; -8px on the
         only in-flow child lifts the box 4px, which puts the ink centre on the
         window's centre. bootSplash.browser.test.ts holds it to 1px. */
      #br-boot .br-wordmark { width: 160px; height: 49px; display: block; margin-top: -8px; }
      /* Set in Inter (bundled @font-face in main.css), like the in-app wordmark
         (`icons/brandFont.ts`), never the native UI stack. */
      #br-boot .br-wordmark text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 0;
      }
      #br-boot .br-navy { fill: var(--br-navy); }
      #br-boot .br-coral { fill: var(--br-coral); }

      /* The sweep is taken OUT OF THE FLEX FLOW on purpose, and anchored to the
         viewport centre rather than to the wordmark.

         It used to be a second in-flow child with a `gap` on the container. That
         made the centred column taller than its logo, so the logo sat ABOVE the
         true viewport centre while the very next screen (ProviderGuard's
         loader) centred exactly, and handing off jumped the logo down 14px.
         Measured, not guessed: ink centre y was 447.59 on the splash against
         461.49 on the loader, in a 923px-tall viewport.

         Anchoring here keeps the sweep a fixed distance BELOW the wordmark, but
         it can no longer push the wordmark around. `#br-boot` is `position:
         fixed`, so it is the containing block. Keep these numbers in sync with
         `.br-wordmark`'s 49px height and -8px margin, and this rule's own
         120px width. */
      #br-boot .br-sweep {
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: 42px; /* the ink's lower half (about 18px) + a 24px gap */
        margin-left: -60px; /* half of the 120px width */
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: var(--br-track);
        overflow: hidden;
      }
      #br-boot .br-sweep i {
        position: absolute;
        inset: 0;
        display: block;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--br-navy), transparent);
        transform: translateX(-100%);
        animation: br-boot-sweep 1150ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes br-boot-sweep { to { transform: translateX(100%); } }

      /* The wordmark is `aria-hidden`, so this line is the only thing announcing
         the wait. Without it a slow boot is silent to a screen reader. */
      #br-boot .br-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        #br-boot .br-sweep i { animation: none; }
      }

      /* Chromium does not force an SVG `fill` it was given as a colour, so under
         forced colours the navy half of the wordmark keeps its authored ink on
         whatever canvas the person chose (measured on the in-app wordmark at
         about 1.3:1). `CanvasText` is the one ink their palette guarantees. This
         mirrors main.css's "wordmark forced colours" rule, restated here because
         this block cannot wait for the stylesheet. */
      @media (forced-colors: active) {
        #br-boot .br-navy,
        #br-boot .br-coral { fill: CanvasText; }
      }
    </style>
  </head>
  <body>
    <!-- br-boot:start -->
    <div id="br-boot" hidden>
      <span class="br-sr" role="status">Loading Biorouter…</span>
      <!--
        The Biorouter wordmark (R-29: the text logo is the logo), emitted as
        static geometry rather than measured at runtime like
        icons/BioRouterWordmark.tsx does. On the boot path there is no time to
        wait for fonts before a getBBox() pass, and the numbers are deterministic
        for Inter 600 anyway. To regenerate after a brand change, render
        <BioRouterWordmark/> in a browser at 160 by 49 (the component's own
        measurement moves by a few hundredths with its rendered size, so measure
        it at the size drawn here) and copy the resulting viewBox, the two rects
        and the text's size and weight. The navy rect is the WHOLE bar and
        the coral one is drawn over its right half, as in the component, so no
        anti-aliased seam can show between two rects that meet at a fraction.
        `aria-hidden`: the status line above names the wait once; the lockup
        would only read it a second time.
      -->
      <svg class="br-wordmark" viewBox="-7.21 -103.38 486.55 149.05" aria-hidden="true" focusable="false">
        <text x="0" y="0" font-size="100"><tspan class="br-navy">Bio</tspan><tspan class="br-coral">Router</tspan></text>
        <rect class="br-navy" x="92.03" y="26.44" width="124.85" height="12.02"/>
        <rect class="br-coral" x="152.93" y="26.44" width="63.95" height="12.02"/>
      </svg>
      <div class="br-sweep"><i></i></div>
    </div>
    <!-- br-boot:end -->
    <script id="br-boot-splash-script">
      /* Boot splash controller. Kept inline and dependency-free so it paints
         without waiting on the module graph. `boot-splash.test.ts` extracts
         and runs this exact source, so it is the tested artefact. */
      (function () {
        var THRESHOLD_MS = 400; // below this, a boot is fast enough to show nothing
        var FONT_WAIT_MS = 250; // the longest the first frame waits for the brand face
        var FADE_OUT_MS = 260;
        // Dispatched on `window` once, when the splash is no longer on screen. The app reads it
        // (`components/privacy/firstRunNoticeHandoff.ts` keeps the same spelling and
        // boot-splash.test.ts pins the two together) so a dialog never opens under, or through,
        // the fading wordmark (vision FR-R5-1).
        var GONE_EVENT = 'br-boot-splash-gone';

        var el = document.getElementById('br-boot');
        if (!el) return;

        var showTimer = null;
        var removeTimer = null;
        var shown = false;
        var finished = false;
        var gone = false;

        // The splash appears at REST (spec principle 9, vision FR-R1-7): the
        // wordmark is drawn whole in the first frame, so there is nothing to
        // animate from script. The one moving part, the sweep, is a CSS
        // animation that starts when `hidden` comes off and stops with
        // `prefers-reduced-motion`; it dies with the element, so teardown has
        // nothing to cancel.
        function show() {
          if (finished || shown) return;
          shown = true;
          showTimer = null;
          el.hidden = false;
        }

        // Inter is `font-display: block` and is not requested until something
        // paints with it, so a splash that came off `hidden` at once drew the
        // bars of the lockup first and its letters a frame or more later
        // (measured in Chromium: the face reads `unloaded` at the moment the
        // splash is shown and `loaded` 10 to 20 ms after). Load it first, so
        // the first frame is the whole logo. A face that is slow or missing
        // never holds the splash past FONT_WAIT_MS, and no `document.fonts`
        // (jsdom) shows it at once.
        function showWhenFontReady() {
          showTimer = null;
          var fonts = document.fonts;
          if (finished || !fonts || typeof fonts.load !== 'function') {
            show();
            return;
          }
          var released = false;
          function release() {
            if (released) return;
            released = true;
            show();
          }
          try {
            fonts.load('600 100px Inter', 'BioRouter').then(release, release);
          } catch (e) {
            release();
            return;
          }
          setTimeout(release, FONT_WAIT_MS);
        }

        function teardown() {
          if (removeTimer) {
            clearTimeout(removeTimer);
            removeTimer = null;
          }
          if (el && el.parentNode) el.parentNode.removeChild(el);
          if (gone) return;
          gone = true;
          try {
            window.dispatchEvent(new Event(GONE_EVENT));
          } catch (e) {
            // No Event constructor: nothing was listening for it either. `isGone()` still answers.
          }
        }

        // Called by renderer.tsx once React has actually mounted the app.
        function dismiss() {
          if (finished) return;
          finished = true;
          if (showTimer) {
            clearTimeout(showTimer);
            showTimer = null;
          }
          // Never crossed the threshold: drop it without a flash.
          if (!shown) {
            teardown();
            return;
          }
          el.classList.add('br-out');
          removeTimer = setTimeout(teardown, FADE_OUT_MS + 40);
          el.addEventListener('transitionend', teardown, { once: true });
        }

        showTimer = setTimeout(showWhenFontReady, THRESHOLD_MS);

        window.__brBootSplash = {
          dismiss: dismiss,
          isShown: function () {
            return shown;
          },
          // True once the splash has left the screen: removed after its fade, or taken down
          // before it was ever drawn. False from the first script run until then, so "not gone"
          // covers the fade as well as the wait.
          isGone: function () {
            return gone;
          },
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./src/renderer.tsx"></script>
  </body>
</html>
