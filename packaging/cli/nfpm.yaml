# nfpm spec for the CLI-only Linux packages (deb + rpm).
#
# Ships ONLY the headless Rust binaries — the interactive `biorouter` CLI and
# the `biorouterd` server daemon — with no Electron/GUI payload. Built by
# scripts/build-cli-linux-packages.sh from the prebuilt linux-gnu binaries at
# target/x86_64-unknown-linux-gnu/release/. Version is injected via ${VERSION}.
name: "biorouter-cli"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
release: "1"
section: "science"
priority: "optional"
maintainer: "UCSF Baranzini Lab <baranzinilab@ucsf.edu>"
vendor: "UCSF Baranzini Lab"
homepage: "https://github.com/BaranziniLab/biorouter"
license: "Apache-2.0"
description: |
  Biorouter CLI — AI-powered biomedical research environment (headless).
  Bundles the interactive `biorouter` command-line interface and the
  `biorouterd` REST/WebSocket server daemon. No desktop GUI is installed.
  Run `biorouter doctor` after install to check optional prerequisites
  (git, uv, node) and `biorouter setup-path` is not needed — the package
  installs both binaries onto PATH at /usr/bin. Also ships the browser
  interface at /usr/share/biorouter/web, which `biorouter serve` hands to
  `biorouterd` so a headless host can be driven from a browser.

contents:
  - src: ./target/computer-use/linux-x64
    dst: /usr/libexec/biorouter/computer-use
    type: tree
  - src: ./target/x86_64-unknown-linux-gnu/release/biorouter
    dst: /usr/bin/biorouter
    file_info:
      mode: 0755
  - src: ./target/x86_64-unknown-linux-gnu/release/biorouterd
    dst: /usr/bin/biorouterd
    file_info:
      mode: 0755
  # The browser interface bundle biorouterd serves (BIOROUTER_SERVE_UI), built
  # by scripts/build-cli-linux-packages.sh via `npm run build:web`.
  #
  # Every other package places it beside the binaries so the daemon resolves it
  # as `<exe dir>/../web`. That rule cannot work here: these binaries go on PATH
  # at /usr/bin, and `<exe dir>/../web` would be /usr/web — not a location the
  # FHS has any room for. /usr/share/<pkg>/ is where architecture-independent
  # package data belongs, so the CLI packages are the one case that needs the
  # path stated rather than derived.
  #
  # `type: tree` copies the directory recursively; without it nfpm takes `src`
  # as a single file and the hashed assets/ under it are silently dropped.
  - src: ./ui/desktop/src/web
    dst: /usr/share/biorouter/web
    type: tree

# libxcb is linked for clipboard/terminal support, and zlib is linked through
# libgit2; declare both so a clean, headless system pulls them in on install.
# git is recommended at runtime for repository/knowledge-base features (uv/node
# are checked by `biorouter doctor`).
overrides:
  deb:
    depends:
      - libxcb1
      - zlib1g
      - python3
      - python3-gi
      - gir1.2-atspi-2.0
      - gir1.2-gtk-3.0
      - at-spi2-core
    recommends:
      - git
  rpm:
    depends:
      - libxcb
      - zlib
      - python3
      - python3-gobject
      - at-spi2-core
      - gtk3
    recommends:
      - git
