version: 1.0.0
title: BioRouter Self-Testing Integration Suite
description: A comprehensive meta-testing workflow where BioRouter tests its own capabilities using its own tools - true first-person integration testing
author:
  contact: biorouter-self-test
  
activities:
  - Initialize test workspace and logging infrastructure
  - Test file operations (create, read, update, delete, undo)
  - Validate shell command execution and error handling
  - Analyze code structure and parsing capabilities
  - Test extension discovery and management
  - Validate Auto Visualiser and JavaScript-executed artifact handoff
  - Verify session-anchored file links and live updates without losing preview edits
  - Exercise paper previews, syntax highlighting, and responsive panel motion
  - Build, lint, and execute an Apps SDK v2 reference app
  - Create and orchestrate subagents for meta-testing
  - Validate live steering, detached supervision, close-tab survival, and provider restoration
  - Exercise isolated OKF, BioOKF, and built-in Soul migration round trips
  - Generate and execute test workflows
  - Test error boundaries and security controls
  - Validate the Settings reset contract and its active-work safety gate
  - Measure performance and resource usage
  - Generate comprehensive test report

parameters:
  - key: test_phases
    input_type: string
    requirement: optional
    default: "all"
    description: "Which test phases to run: all, basic, extensions, apps, previews, subagents, knowledge, workflows, reset, advanced"
  
  - key: test_depth
    input_type: string
    requirement: optional
    default: "standard"
    description: "Testing depth: quick (smoke tests), standard (normal coverage), deep (exhaustive)"
  
  - key: workspace_dir
    input_type: string
    requirement: optional
    default: "./biorouterselftest"
    description: "Directory for test artifacts and results"
  
  - key: parallel_tests
    input_type: string
    requirement: optional
    default: "true"
    description: "Run independent tests in parallel where possible"
  
  - key: cleanup_after
    input_type: string
    requirement: optional
    default: "true"
    description: "Clean up test artifacts after completion"

  - key: sdk_app_id
    input_type: string
    requirement: optional
    default: "biorouter-self-test-sdk-v2"
    description: "Unused app id for the Apps SDK phase; an existing id stops the phase without mutation"

  - key: preview_app_id
    input_type: string
    requirement: optional
    default: "biorouter-self-test-preview"
    description: "Unused app id for preview tests, distinct from sdk_app_id; existing apps are preserved"

instructions: |
  You are testing yourself - a running BioRouter instance validating its own capabilities through meta-testing.
  This is true first-person integration testing where you use your own tools to test your own functionality.

  ## Understanding First-Person Integration Testing
  This is a crucial distinction - as a running BioRouter instance, you are testing yourself using your own capabilities.
  This is meta-testing in the truest sense: not unit tests or external test harnesses, but you using your tools 
  to validate your own functionality from within your active session. You can only test what you can observe and 
  control from inside your running instance - your tools, your behaviors, your error handling, your consistency.
  
  ## Core Testing Philosophy
  - You ARE the system under test AND the tester
  - Use your tools to create test scenarios, then validate the results
  - Test both success and failure paths
  - Document everything meticulously
  - Handle errors gracefully - a test failure shouldn't stop the suite
  
  ## Test Execution Framework
  
  ### Phase 1: Environment Setup & Basic Tool Validation
  Create a structured test workspace and validate core developer tools:
  - File operations (CRUD + undo)
  - Shell command execution
  - Code analysis capabilities
  - Error handling and recovery
  
  ### Phase 2: Extension System Testing
  Test dynamic extension management:
  - Discover available extensions
  - Enable/disable extensions
  - Test extension interactions
  - Verify isolation between extensions

  ### Phase 2B: Apps SDK v2 Testing
  Exercise Agent Drafter's typed app contract end to end:
  - Create one isolated dashboard app with the configured self-test id
  - Read its resolved manifest and verify the declared surface
  - Build and lint the app
  - Execute its controls through the browser smoke harness
  {% if cleanup_after == "true" %}
  - Delete only the dashboard app created by this run during cleanup
  {% endif %}

  ### Phase 2C: Artifact Preview Handoff
  Validate artifact-producing tools through the JavaScript execution extension:
  - Render one Auto Visualiser chart through `execute_code`
  - Create and launch one static Agent Drafter app with the configured preview id through `execute_code`
  - Verify both previews survive the nested tool call and the app launch returns its `/apps/<id>/` path
  - Change an already-open report and app; verify same-tab updates and preserved user edits
  - Check absolute and later shorthand report links against the actual session directory
  {% if cleanup_after == "true" %}
  - Delete only the preview app created by this run during cleanup
  {% endif %}
  
  ### Phase 3: Subagent Testing (Meta-Recursion)
  Create subagents to test yourself recursively:
  - Basic subagent creation and execution
  - Parallel subagent execution (multiple subagent calls at once)
  - Sequential subagent chains
  - Recursive depth testing (subagent creating subagent)
  - Test summary mode (default behavior for concise results)
  - Steer a running child and require the steered marker in its final answer
  - Close only the child's tab, verify its turn survives, then reattach
  - Watch long-running children without treating a watch timeout as failure
  - Verify the child retains its exact provider/model and delegated tool profile

  ### Phase 3B: Knowledge Round Trips
  Validate the current knowledge formats without touching the user's real bases:
  - Run deterministic OKF and BioOKF ingest → lint → query round trips
  - Verify native Markdown citations identify current bundle pages
  - Exercise empty-root creation and delete rollback tests
  - Exercise startup purge of registered and unregistered legacy residue
  - Verify the recreated built-in is named `soul` and has an OKF profile
  
  ### Phase 4: Advanced Self-Testing
  Push boundaries and test limits:
  - Intentionally trigger errors
  - Test timeout scenarios
  - Validate security controls
  - Measure performance metrics
  - Test resource constraints

  ### Phase 4B: Settings Reset Safety
  Validate the destructive reset feature without deleting the active self-test session:
  - Inspect the reset API and Settings panel definitions and verify all seven reset categories match
  - Verify the API rejects resets while a conversation or scheduled run is active
  - Run the targeted reset storage and factory-default tests from the repository
  - Never submit a destructive reset against the live self-test profile
  
  ### Phase 5: Report Generation
  Compile comprehensive test results:
  - Aggregate all test outcomes
  - Calculate success metrics
  - Document failures and issues
  - Generate recommendations
  
  ## Success Criteria
  - Phase success: Every required scenario passes; report optional skips separately
  - Suite success: All selected phases complete with no unresolved required failures
  - Unavailable or unobservable checks are not passes and leave the relevant release gate open
  - Each test logs: setup → execute → validate → result → cleanup

extensions:
  - type: builtin
    name: developer
    display_name: Developer
    timeout: 600
    bundled: true
    description: Core tool for file operations, shell commands, and code analysis

  - type: builtin
    name: agent_drafter
    display_name: Agent Drafter
    timeout: 600
    bundled: true
    description: Typed authoring, build, lint, and browser smoke tools for BioRouter apps

  - type: builtin
    name: autovisualiser
    display_name: Auto Visualiser
    timeout: 600
    bundled: true
    description: Browser-renderable charts and dashboards for artifact preview validation

  - type: platform
    name: code_execution
    bundled: true
    description: Sandboxed JavaScript orchestration for nested extension and artifact validation
  
prompt: |
  Execute the BioRouter Self-Testing Integration Suite in {{ workspace_dir }}.
  Test phases: {{ test_phases }}, Depth: {{ test_depth }}, Parallel: {{ parallel_tests }}

  Never stage, commit, or push test artifacts or source changes. Leave every generated report
  untracked in the test workspace for the caller to inspect and remove.
  
  ## 🚀 INITIALIZATION
  Create test workspace: {{ workspace_dir }}/ for all test artifacts and reports.
  
  Track your progress using the todo extension. Start with:
  - [ ] Initialize test workspace
  - [ ] Set up logging infrastructure
  - [ ] Begin Phase 1 testing
  
  {% if test_phases == "all" or "basic" in test_phases %}
  ## 📝 PHASE 1: Basic Tool Validation
  
  ### File Operations Testing
  1. Create test files with various content types (.txt, .py, .md, .json)
  2. Test str_replace on each file type
  3. Test insert operations at different line positions
  4. Test undo functionality
  5. Verify file deletion and recreation
  6. Test with special characters and Unicode
  
  ### Shell Command Testing
  Test comprehensive shell workflow: command chaining (mkdir test && cd test && echo "test" > file.txt), 
  error handling (false || echo "handled"), and environment variables (export VAR=test && echo $VAR).
  Verify both success and failure paths work correctly.
  
  ### Code Analysis Testing
  1. Create sample code files in Python, JavaScript, and Go
  2. Analyze each file for structure
  3. Test directory-wide analysis
  4. Test symbol focus and call graphs
  5. Verify LOC, function, and class counting
  
  Log results to: {{ workspace_dir }}/phase1_basic_tools.md
  {% endif %}
  
  {% if test_phases == "all" or "extensions" in test_phases %}
  ## 🔧 PHASE 2: Extension System Testing
  
  ### To Do Capability and Chat Summary
  1. Create three synthetic tasks: compare queue options, verify arithmetic, and present the result.
     Use fictional Option A ($120/month, 30 minutes/day saved) and Option B ($180/month,
     40 minutes/day saved). Verify $4 versus $4.50 per daily minute saved, and $60 incremental
     monthly cost for 10 additional daily minutes. Do not present these as clinical evidence.
  2. Update individual tasks through pending, in_progress, and completed. Reopen one completed
     task, rename it, and verify the persisted list reflects both changes accurately.
  3. In the desktop, keep Chat summary open during an update. Require compact label/value
     typography, a connected task list in checklist order, explicit statuses, and a completion
     count that decreases when work reopens. Switch to an empty chat: no previous task may leak
     into it. Plan-only state must not display a checklist. Mark these assertions NOT OBSERVABLE
     when running from the CLI; tool success alone is not visual evidence.
  4. Replace and clear only this synthetic checklist, with any required user confirmation.
     Verify removed items disappear and the progress section is absent when no tasks remain.

  ### Academic Figure Presentation
  Render the fictional comparison with Auto Visualiser. Require an informative title and axis
  units, neutral backgrounds, restrained distinguishable series, large readable labels, and no
  decorative gradient banner or generic subtitle. Check the real artifact at narrow and wide
  panel sizes, including a long Unicode label: no overlap or horizontal page overflow. Inspect
  the data alternative and legend controls. Mark visual checks NOT OBSERVABLE in the CLI.
  Include an out-of-range gauge, close-valued histogram bins, a mixed empty/nonempty boxplot,
  and a zero-radius bubble. Verify exact observations remain in the data alternatives, and
  any clipping, missing values, omitted labels or precision-limited bins are explained.
  Resize repeatedly; a plotted chart with a render-error banner is a failure. For diagrams,
  inspect the readable source alternative and verify distinct typed IDs remain distinct.
  A dashboard expand/collapse control must update its visible action and accessible state.

  ### Dynamic Extension Management
  1. Use `extensionmanager__search_available_extensions` to discover installed extensions.
     Report built-in capabilities separately from installed third-party extensions.
  2. In an isolated test profile, start with a public test extension detached. Ask for a concrete
     task, such as checking browser tabs, without specifying the tool sequence. Attach or install
     the needed public extension and invoke one of its tools during the same user request.
  3. Detach the test extension before finishing. Verify its tools are no longer advertised or
     callable. Repeat with a coding-agent provider: an install report alone is not a pass.
  4. Verify completed manager operations are not replayed after the catalog refresh. Check that
     parallel operations retain their results, and that failed installs remain marked as failures.
  5. Check the extension popup and tool count during attach and detach. Require semantic activity
     labels that name the action and target; todo updates should name the task when available.
     Mark visual assertions NOT OBSERVABLE if running headless.
  6. Verify private extensions remain absent from a public provider's tool catalog. Do not alter
     the user's normal profile, credentials, or installed packages for these tests.
  
  Log results to: {{ workspace_dir }}/phase2_extensions.md
  {% endif %}

  {% if test_phases == "all" or "apps" in test_phases %}
  ## 🧩 PHASE 2B: Apps SDK v2 Validation

  Use only the exact app id `{{ sdk_app_id }}`; never modify or delete any other app.

  1. Call `list_apps`. If that exact app id already exists or matches the preview id `{{ preview_app_id }}`, stop this phase and report the collision without modifying any app. Do not overwrite, reuse, or remove a prior run's app.
  2. Call `create_app` with that id, kind `agentic`, archetype `dashboard`, a concise title and description, and a system prompt that updates dashboard metrics through the declared action.
  3. Call `read_app` and verify the resolved manifest has the dashboard state schema, `set_metric` action, `refresh_requested` signal, and nonblank `surface.state_initial` metric labels. Missing measurements must be explicitly unavailable, not invented zero values. Keep declared initial state as the source of first-load values; do not add duplicate imperative initialization to work around the smoke harness.
  4. Call `build_app`; require a successful bundle.
  5. Call `build_app` with `check_only: true`; require zero ERROR findings.
  6. Call `smoke_app`; require the real-browser harness to execute successfully. A missing browser or skipped execution is a failure, not a pass.
  7. Record setup, manifest assertions, build output, lint output, and smoke output in {{ workspace_dir }}/phase2b_apps.md.
  {% if cleanup_after == "true" %}
  8. After recording the result, call `delete_app` for exactly `{{ sdk_app_id }}` only if this run created it. Preserve every pre-existing app, including on failure.
  {% endif %}
  {% endif %}

  {% if test_phases == "all" or "previews" in test_phases %}
  ## 🖼️ PHASE 2C: Artifact Preview Handoff

  Use only the exact app id `{{ preview_app_id }}`; never modify or delete any other app.

  First call `list_apps`. If that exact app id already exists or matches the dashboard id `{{ sdk_app_id }}`, stop this phase and report the collision without modifying any app. Do not overwrite, reuse, or remove a prior run's app.

  1. In one `execute_code` script, import an Auto Visualiser chart tool, render a small bar chart, and record its textual result. The outer call must also emit a user-facing HTML resource block for the client.
  2. In one `execute_code` script, import Agent Drafter's `create_app` and `launch_app`, create a static app with id `{{ preview_app_id }}`, launch it, and record the launch result.
  3. Require the nested Agent Drafter call to return its preview resource and launch metadata containing exactly `/apps/{{ preview_app_id }}/`. Resource blocks are rendered out-of-band by the CLI/desktop and are not part of JavaScript's textual `record_result` value, so do not mark a preview missing merely because its raw `ui://` URI is absent from that text. The Rust integration test and terminal transcript validate the client-facing block. In a terminal, record the browser/file URL printed for the user; in the desktop, record that the preview is click-to-open rather than auto-launching an external page.
  4. Create a small fictional queue-option report at {{ workspace_dir }}/preview-links/reports/summary.md. Resolve and verify its absolute path, then include a clickable link to that exact file in the response. In a later response, refer to the same unique `summary.md`; verify that the desktop opens the same file. A qualified relative link must instead resolve from the actual session working directory. An ambiguous basename must not silently open a different file.
  5. With the report open, update a numeric value using the same byte width and recompute its comparison. Require the existing preview to update after the successful write, without opening another tab. Update the existing self-test app's visible title through the current tool schema and include a small editable notes field for the next check, rebuilding if necessary; require its existing managed preview to update at the same URL.
  6. In the desktop, type an unsaved form value and blur the field before another app update. Require an explicit Update ready action, with the typed value intact. Annotation, resize, and active or reconnecting app work must also defer automatic reload. Explicit refresh must retain app IndexedDB state. External websites must not reload because a local tool finished. Do not broaden network or private-file permissions to pass these checks.
  7. Create small synthetic Markdown, CSV, TSV, Python, R, and plain-text fixtures under {{ workspace_dir }}/preview-links only. Include repeated text `LYCHEE5` and a long code line. Verify the exact saved contents and return clickable absolute links. In the desktop, inspect the paper ground, syntax tokens, orange selection, and horizontal scrolling. Repeatedly open and close the panel, resize the actual window between stacked and side layouts, and check that an embedded page keeps its unsaved value. Enable Reduce Motion and verify that transitions stop. A delayed older open must not replace a newer file or reopen a closed panel. Never use a DevTools viewport override as evidence of a real window resize.
  8. Record setup, exact verified file links, successful write/build results, preview URI, and validation outcome in {{ workspace_dir }}/phase2c_previews.md. If desktop interaction is unavailable, record click navigation, same-tab visual updates, edit preservation, styling, and motion as NOT OBSERVABLE, never PASS; source-file existence is not GUI evidence.
  {% if cleanup_after == "true" %}
  9. After recording the result, call `delete_app` for exactly `{{ preview_app_id }}` only if this run created it. Preserve every pre-existing app, including on failure.
  {% endif %}
  {% endif %}
  
  {% if test_phases == "all" or "subagents" in test_phases %}
  ## 🤖 PHASE 3: Subagent Meta-Testing
  
  ### Basic Subagent Test
  Give a child this deliberately outcome-oriented request, using the current tool schema:
  "Put together a useful comparison of these fictional queue options. Make something I can
  run again when the numbers change, and show me how you checked it."
  Supply Option A ($120/month, 30 minutes/day) and B ($180/month, 40 minutes/day), with
  exactly 30 days per month. Confine all files and any SQLite database to
  {{ workspace_dir }}/subagents/basic/. Grant only the tools needed for that work.
  Require a runnable comparator, input fixture, and executed verification, not a verbatim
  response or a file that only contains a marker. Check the incremental cost is $0.20 per
  additional minute saved. Judge whether the chosen implementation reasonably meets the request.
  
  ### Parallel Subagent Test
  {% if parallel_tests == "true" %}
  Create 3 subagent calls simultaneously (parallel execution):
  1. Build and query a local SQLite fixture in {{ workspace_dir }}/subagents/database/.
  2. Build a readable HTML comparison in {{ workspace_dir }}/subagents/report/.
  3. Independently verify the arithmetic in {{ workspace_dir }}/subagents/verification/.
  Use the same fictional inputs, separate output directories, and no real user databases.
  
  Make all three `subagent` tool calls at once to execute them in parallel.
  {% endif %}
  
  ### Sequential Chain Test
  Create dependent subagents (one after another):
  1. First: Build the comparator and its fixture in {{ workspace_dir }}/subagents/chain/.
  2. Second: Review it and add a test for changed inputs without rewriting the implementation.
  3. Third: Run the tests and report actual results, including any concrete defect found.
  
  ### Recursive Depth Test (if test_depth == "deep")
  {% if test_depth == "deep" %}
  Create a subagent that creates another subagent (test depth limit).
  Monitor for resource constraints and context window limits.
  {% endif %}
  
  ### Summary Mode Test
  Create subagents with summary mode (default) and verify concise output.
  Test with `summary: false` to get full conversation history.

  ### Live Steering, Supervision, and Close-Tab Survival
  1. Start a child asynchronously to build a tested queue-option comparator in
     {{ workspace_dir }}/subagents/steering/. Require its first visible progress checkpoint
     to contain `SELFTEST_CHILD_READY` while the implementation is still in progress.
     Do not block the parent waiting for completion before trying to steer.
  2. Call `workspace_list`; require that child to report `running: true` and record its exact
     provider, model, and enabled extensions.
  3. Call `workspace_send_prompt` with `mode: "steer"` and tell the running child to
     add Option C ($150/month, 45 minutes/day), assess whether any option is dominated, and
     include `SELFTEST_STEERED_OK` in its verification report. Do not start a replacement child.
  4. Call `workspace_watch` with a short timeout first. If it reports the child still running,
     record that as a successful nonterminal observation, then call it again; a watch timeout is
     not a turn failure.
  5. Require the child's final answer to contain `SELFTEST_STEERED_OK`, and independently run
     its comparator/tests to verify C is present and B is identified as dominated by C.
     A marker without the requested implementation is not a pass. Verify its provider,
     model, and delegated extensions are unchanged.
  6. Start a second child to build and execute a data-validation report in
     {{ workspace_dir }}/subagents/tab-survival/, including `SELFTEST_TAB_SURVIVED` on success. Call
     `workspace_close` with `scope: "tab"` while it is running, then call `workspace_watch`.
     Require the turn to continue and finish. Reopen the same session with `workspace_open`; do
     not spawn a replacement. Verify the transcript contains `SELFTEST_TAB_SURVIVED` and the
     validation report exists with evidence of an executed check.
  7. During both live turns, record whether the selected child tab shows the existing breathing
     activity dot and whether its composer shows the existing moving rim. If this workflow is
     running headless, record those two visual assertions as NOT OBSERVABLE, never PASS.
  
  Log results to: {{ workspace_dir }}/phase3_subagents.md
  {% endif %}

  {% if test_phases == "all" or "knowledge" in test_phases %}
  ## 🧠 PHASE 3B: Isolated OKF, BioOKF, and Soul Validation

  Never delete, rename, import into, or mutate any knowledge base in the user's active profile.
  Use the repository's temporary-directory regressions and keep generated artifacts under
  {{ workspace_dir }}/knowledge-evidence/.

  1. Run `cargo test -p biorouter-mcp --test knowledge_macros_e2e` and require the deterministic
     OKF ingest → lint → query round trip to pass.
  2. Run `cargo test -p biorouter --test knowledge_agent_roundtrip` and require the attached-agent
     OKF/BioOKF curation round trips to pass without a live API key.
  3. Run the focused native-citation, BRKB validation, create/import/delete rollback, and zero-base
     creation regressions. A current `.brkb` must require a readable manifest and the required
     OKF/BioOKF structure; traversal, oversized expansion, and legacy profiles must be refused.
  4. Run `cargo test -p biorouter startup_purges_unregistered_legacy_residue_and_recreates_native_soul --lib`.
     Require the recreated base id to be exactly `soul`, its profile to be OKF, and both registered
     and unregistered legacy residue to be absent.
  5. Record the exact commands, exit codes, current-format manifests, citation targets, and rollback
     assertions in {{ workspace_dir }}/phase3b_knowledge.md. Never copy page content from a real
     user knowledge base into the report.
  {% endif %}

  {% if test_phases == "all" or "reset" in test_phases %}
  ## ♻️ PHASE 4: Settings Reset Safety

  This phase verifies the destructive reset contract without invoking it against this live profile.

  1. Inspect `crates/biorouter-server/src/routes/reset.rs` and
     `ui/desktop/src/components/settings/app/ResetPanel.tsx`.
  2. Verify both define applications, knowledge, skills, extensions, schedules, workflows, and
     history, and that the server blocks reset while active work is running.
  3. Run `cargo test -p biorouter clear_all_sessions_removes_history_usage_and_side_tables`.
  4. Run `cargo test -p biorouter-server routes::reset::tests`.
  5. Do not call the live reset endpoint; doing so would erase the session running this test.

  Log results to: {{ workspace_dir }}/phase4_reset.md
  {% endif %}
  
  {% if test_phases == "all" or "advanced" in test_phases %}
  ## 🔬 PHASE 4B: Advanced Testing
  
  ### Error Boundary Testing
  1. Create a file with an invalid path (should fail gracefully)
  2. Run a non-existent shell command
  3. Try to analyze a binary file
  4. Test with extremely long filenames
  5. Test with nested directory creation beyond limits
  
  ### Performance Measurement
  {% if test_depth == "deep" %}
  1. Create and analyze a large file (>1MB)
  2. Run multiple parallel operations
  3. Track execution times for each operation
  4. Monitor token usage if accessible
  {% endif %}
  
  ### Security Validation
  1. Test input with special shell characters: $(echo test)
  2. Attempt directory traversal: ../../../etc/passwd
  3. Test with harmful Unicode characters
  4. Verify command injection prevention
  
  Log results to: {{ workspace_dir }}/phase4_advanced.md
  {% endif %}
  
  ## 📊 PHASE 5: Final Report Generation
  
  Create TWO reports:
  
  ### 1. Detailed Report at {{ workspace_dir }}/detailed_report.md
  Include all test details, logs, and technical information.
  
  ### 2. Executive Summary (REQUIRED - Display in Terminal)
  
  **IMPORTANT**: At the very end, generate and display a concise summary directly in the terminal:
  
  ```
  ========================================
  BIOROUTER SELF-TEST SUMMARY
  ========================================
  
  ✅ OVERALL RESULT: [PASS/FAIL]
  
  📊 Quick Stats:
  • Tests Run: [X]
  • Passed: [X] ([%])  
  • Failed: [X] ([%])
  • Duration: [X minutes]
  
  ✅ Working Features:
  • File operations: [✓/✗]
  • Shell commands: [✓/✗]
  • Code analysis: [✓/✗]
  • Extensions: [✓/✗]
  • Apps SDK v2: [✓/✗]
  • Subagents: [✓/✗]
  • OKF/BioOKF/Soul: [✓/✗]
  • Settings reset safety: [✓/✗]
  
  ⚠️ Issues Found:
  • [Issue 1 - brief description]
  • [Issue 2 - brief description]
  
  💡 Key Insights:
  • [Most important finding]
  • [Performance observation]
  • [Recommendation]
  
  📁 Full report: {{ workspace_dir }}/detailed_report.md
  ========================================
  ```
  
  This summary should be:
  - **Concise**: Under 30 lines
  - **Visual**: Use emojis and formatting for clarity
  - **Actionable**: Clear pass/fail status
  - **Informative**: Key findings at a glance
  
  Always end with this summary so users immediately see the results without digging through files.
  
  {% if cleanup_after == "true" %}
  ## 🧹 CLEANUP
  After report generation:
  1. Archive results to {{ workspace_dir }}/archive/
  2. Remove temporary test artifacts
  3. Keep only the final report and logs
  {% endif %}
  
  ## 🎯 META-TESTING NOTES
  Remember: You are testing yourself. This is recursive validation where:
  - Success means your tools work as expected
  - Failure reveals areas needing attention
  - The ability to complete this test IS itself a test
  - Document everything - your future self (or another BioRouter instance) will thank you
  
  Use your todo extension to track progress throughout.
  Handle errors gracefully - a failed test shouldn't crash the suite.
  Be thorough but efficient based on the test_depth parameter.
  
  This is true first-person integration testing. Execute with precision and document with clarity.
