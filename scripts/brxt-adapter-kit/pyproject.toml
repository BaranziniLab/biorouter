# The kit's own test environment. Adapters do not depend on this project: they
# vendor brxt_kit/ and brxt_kit_testing/ with bin/vendor_kit.py.
[project]
name = "brxt-adapter-kit"
version = "1.0.1"
description = "Shared HTTP core, tool shapes, templates and tests for Biorouter BRXT adapter extensions."
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11.7,<3",
]

[tool.uv]
package = false
# cryptography (pulled in by fastmcp) has no Intel Mac wheels from 49 on.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
