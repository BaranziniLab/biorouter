# Builds the Linux GUI deb/rpm and the CLI-only deb/rpm on a real Linux runner.
#
# ⚠ Why this exists rather than the Docker cross-build in `scripts/release.sh`
# `cmd_linux`. On a macOS release host, Docker Desktop stamps files with a
# `com.docker.grpcfuse.ownership` xattr and its file-sharing layer reports
# permissions from that xattr rather than the inode, so every file the container
# wrote into `out/resources/computer-use/` landed as `--w-------` and the
# packager could not read what it had just written. Measured on 1.91.0 across
# three attempts with the source verified clean each time; a Docker volume
# instead of the bind mount made no difference.
#
# Note what that would have done had the modes been merely wrong rather than
# unreadable: `ocu` at mode 0200 ships non-executable and Biorouter Copilot does
# not work on Linux, with nothing in the test suite catching it. Building where
# the packages are meant to run removes the whole class.
#
# ⚠ THE BACKEND IS NOT BUILT ON THE RUNNER. It is cross-compiled in the pinned
# `rust:1.92-bullseye` image by `scripts/build-computer-use-package-cross.sh`,
# which also runs `check-glibc-floor.sh` and `check-linux-runtime-deps.sh`.
# The first version of this workflow ran a bare `cargo build --release` on
# ubuntu-24.04 and would have shipped binaries linked against that runner's
# glibc 2.39, which fail to start on Debian 12 / Ubuntu 22.04 / Rocky 9 — the
# exact distros the 2.31 floor exists to protect. Nothing here would have caught
# it: `check-glibc-floor.sh`'s own header says a `cargo check` cannot see this
# because checks do not link, and the repo's container smoke tests all run on
# newer glibc (bookworm 2.36, rocky9 2.34). Do not "simplify" this back to a
# host cargo build.
name: Linux GUI packages
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
permissions:
  contents: read
jobs:
  backend:
    name: Linux backend (pinned glibc)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      # ⚠ No persisted cache: the cross target dir starts empty on every run,
      # as `release.sh` `run_cross_release` makes its own (it destroys its
      # target volume before every release build, because cached objects keep
      # stale glibc symbol versions). `check-glibc-floor.sh` still runs here on
      # what was produced and again in the packaging job, whatever the cache.
      #
      # This job used to restore and save `cross-<triple>-<Cargo.lock hash>`
      # through actions/cache, and that cache cost more than it saved. Measured
      # 2026-09-24..10-18, this job takes 34.7-37.5 min cold and 19.3-23.6
      # warm (n=12), against a 100 minute limit. A save from a release
      # branch is readable by that branch alone, and none was read again
      # (release/1.92.0, 1.93.1 and 1.93.2 each dispatched this once). Each
      # save is 1.2 GB here and 1.4 GB in windows-gui-packages.yml, and on
      # 2026-10-18 that pair pushed the repository past GitHub's 10 GB cache
      # limit, which evicted rust.yml's ubuntu test cache and cancelled the
      # next two pushes to main (see the note at that job's rust-cache step).
      # Saving from main only would not fit either: main's own caches come to
      # about 8.3 GB, and rust.yml's cross-check restores this same key prefix
      # on every run, so the pair would stay resident and push one of the test
      # caches out instead. Do not add a cache here without finding the room.

      # This is the ONLY supported way to produce shipped Linux binaries: it
      # pins the bullseye image and then asserts the floor it just built against.
      - name: Cross-build the backend and assert the glibc floor
        run: bash scripts/build-computer-use-package-cross.sh x86_64-unknown-linux-gnu

      - name: Take ownership of the container-written cache
        if: always()
        run: if [ -d .cross-cache ]; then sudo chown -R "$(id -u):$(id -g)" .cross-cache; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-backend-${{ inputs.version }}
          path: target/x86_64-unknown-linux-gnu/release/
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Linux deb + rpm (GUI and CLI-only)
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-backend-${{ inputs.version }}
          path: target/x86_64-unknown-linux-gnu/release/

      # Actions artifacts do not preserve the executable bit.
      - name: Restore executable modes
        run: chmod +x target/x86_64-unknown-linux-gnu/release/biorouter target/x86_64-unknown-linux-gnu/release/biorouterd target/x86_64-unknown-linux-gnu/release/biorouter-crew

      # Re-assert the floor on THIS job's copy. The check in `backend` proved the
      # bytes it compiled; this proves the bytes that are about to be packaged,
      # which is a different claim once an upload/download sits between them.
      - name: Re-assert the glibc floor on the downloaded binaries
        run: bash scripts/check-glibc-floor.sh

      # The Crew setup service installs the Linux broker on a server from the copy a package
      # carries (OW-9). Staged here from the artifact's own broker, with the manifest the
      # service trusts; `build-linux-deb.sh` copies target/crew-broker/linux-x86_64 into the GUI
      # packages, and `build-cli-linux-packages.sh` stages its own copy for the CLI ones.
      #
      # ⚠ Non-fatal when the artifact has no broker: the GUI packages then carry none and
      # prepare-platform-binaries.js warns instead of failing, because this workflow does not
      # set BIOROUTER_REQUIRE_CREW_BROKER. Today the chmod step above names the broker, so a
      # missing one fails there first; this guards a later change to the artifact. A broker
      # that IS present but fails staging (wrong ELF machine, glibc floor, version) still fails.
      - name: Stage the Crew broker for the GUI packages
        run: |
          broker=target/x86_64-unknown-linux-gnu/release/biorouter-crew
          if [ ! -f "$broker" ]; then
            echo "::warning::the linux-backend artifact has no biorouter-crew; the GUI packages will carry no Crew broker"
            exit 0
          fi
          bash scripts/stage-crew-broker.sh "$broker" target/crew-broker/linux-x86_64

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⚠ `inputs.version` is free text on a workflow_dispatch, and
      # `build-cli-linux-packages.sh` takes it as authoritative — it names the
      # output files from it. A typo would therefore produce correctly-named
      # packages for a version that does not exist, and every `[ -f ]` test
      # below would pass, because those tests are built from the same typo.
      - name: Check the dispatch version against the tree
        run: |
          set -e
          want='${{ inputs.version }}'
          cargo="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          pkg="$(node -p "require('./ui/desktop/package.json').version")"
          echo "dispatch=$want Cargo.toml=$cargo package.json=$pkg"
          [ "$want" = "$cargo" ] && [ "$want" = "$pkg" ] || {
            echo "::error::version $want does not match the tree ($cargo / $pkg)"; exit 1; }

      - name: Build the Biorouter Copilot helper payload
        run: python3 scripts/computer-use-runtime.py build linux-x64

      # `src/bin` is not tracked in git, and `build-linux-deb.sh` copies the
      # Rust binaries into it rather than creating it.
      - name: Create the staging directory
        run: mkdir -p ui/desktop/src/bin

      # ⚠ USE THE CANONICAL SCRIPT — this is `release.sh` `cmd_linux` verbatim,
      # just running where Docker bind mounts are ordinary bind mounts.
      #
      # Do NOT open-code `npm run make --platform=linux` here. That command is
      # `check-package-prereqs.mjs && fix-node-pty-permissions.mjs &&
      # electron-forge make`, and no forge hook calls
      # `prepare-platform-binaries.js`. This repository has already shipped that
      # exact bug once: `build-linux-deb.sh`'s own comment records that it "used
      # to call `npm run make` directly and skip it entirely, which is why the
      # Linux packages were the only ones with no binary validation — and why
      # they shipped a Windows llama-server". `fetchLlamaServer` is called from
      # nowhere else, and the two binary guards live inside the script that
      # would be skipped, so the omission conceals itself.
      #
      # The script copies the Linux binaries into src/bin, sweeps foreign
      # executables recursively, runs prepare-platform-binaries, and then makes
      # the deb and rpm.
      # ⚠ The baseline path must be ABSOLUTE. `require()` treats a bare relative
      # path as a MODULE NAME, not a file, so `ui/desktop/scripts/...json` dies
      # with "Cannot find module" and the unset image makes docker fail with
      # "invalid reference format" (exit 125) — a message that names neither the
      # file nor the reason. `release.sh:496` passes "$ROOT/..." for this exact
      # reason; this step was copied from it with the prefix dropped.
      - name: Build the GUI deb and rpm with the canonical script
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/ws \
            "$(node -e 'console.log(require(process.argv[1]).image)' "$PWD/ui/desktop/scripts/linux-native-baseline.json")" \
            bash /ws/ui/desktop/scripts/build-linux-deb.sh

      # ⚠ Chown the WHOLE checkout, not a list of directories. The container
      # mounts `$PWD` at /ws and runs as root, so every path it touches becomes
      # root-owned — and the set is larger than it looks. An earlier version
      # enumerated out/, src/bin/ and node_modules/, and the run died three
      # steps later on `ui/desktop/public/pdfjs`, which `build:web` recreates
      # via rmSync inside that same container:
      #     [biorouter-pdfjs-assets] EACCES, Permission denied: .../public/pdfjs
      # Guessing the set is the bug; the mount root is the boundary, so cover
      # that instead of predicting what the container will write.
      - name: Take ownership of the container-written tree
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      # ⚠ Mirror `ensure_host_node_deps`, which `cmd_cli-linux` calls before this
      # script for a reason: `build-cli-linux-packages.sh` runs `npm run
      # build:web` on the HOST, and the node_modules sitting here was installed
      # by `npm ci` INSIDE the packaging container, as root, through a bind
      # mount. CLAUDE.md records the failure that produces: `node_modules/.bin`
      # ends up empty with the packages themselves present, and the build dies
      # with `vite: command not found` — which reads as a missing tool rather
      # than a broken install.
      #
      # `npm ci`, never `npm install`: install rewrites package-lock.json, and
      # the next container build's `npm ci` then refuses the out-of-sync lock.
      # The rollup probe is the assertion half — a green `npm ci` does not imply
      # a usable tree, which is the whole point of checking.
      - name: Reinstall host-native desktop dependencies
        working-directory: ui/desktop
        run: |
          npm ci
          node -e "require('rollup')" || { echo "::error::host-native rollup is unavailable after npm ci"; exit 1; }

      # Release assets 7 and 8. Independent of the GUI packaging and it does not
      # disturb node_modules, exactly as `cmd_cli-linux` notes.
      - name: Build the CLI-only deb and rpm
        run: bash scripts/build-cli-linux-packages.sh "${{ inputs.version }}"

      # `build-cli-linux-packages.sh` runs its own containers with `-v "$ROOT":/work`
      # as root, so dist/cli comes back root-owned exactly as the GUI build's
      # output did. The upload step reads these files.
      - name: Take ownership again after the CLI containers
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      # Assert what was produced rather than trusting an exit code. `cmd_linux`
      # carries the same assertion, and its comment records why: a bash function
      # returns its LAST command's status, so three trailing `log` lines once
      # masked a failing `docker run` entirely and the phase printed paths for
      # files it had not produced.
      - name: Verify the artifacts, the helper, and the packaged payload
        run: |
          set -e
          v='${{ inputs.version }}'
          deb="ui/desktop/out/make/deb/x64/biorouter_${v}_amd64.deb"
          rpm="ui/desktop/out/make/rpm/x64/Biorouter-${v}-1.x86_64.rpm"
          cli_deb="dist/cli/biorouter-cli_${v}_amd64.deb"
          cli_rpm="dist/cli/biorouter-cli-${v}-1.x86_64.rpm"
          # ⚠ `[ -f ]` passes on a zero-byte or truncated file, and
          # `if-no-files-found: error` only checks existence. These run 100 MB
          # and up, so a modest floor still catches a maker that wrote a stub.
          for f in "$deb" "$rpm" "$cli_deb" "$cli_rpm"; do
            [ -f "$f" ] || { echo "::error::missing release artifact $f"; exit 1; }
            bytes=$(stat -c %s "$f")
            [ "$bytes" -ge 50000000 ] || { echo "::error::$f is only $bytes bytes — expected a package of 100 MB or more"; exit 1; }
            echo "$(du -h "$f" | cut -f1)  $f"
          done

          # ⚠ Inspect the SHIPPED .deb, not `out/Biorouter-linux-x64/`. Testing
          # the staged tree would be a check that cannot fail: forge's
          # postPackage hook already calls verifyComputerUse on that exact
          # directory, so `make` would have died before reaching here. The
          # question this step answers is what the package actually carries.
          rm -rf /tmp/pkgcheck && mkdir -p /tmp/pkgcheck
          dpkg-deb -x "$deb" /tmp/pkgcheck

          # ⚠ Anchor on CONTENT, not on layout. forge's deb/rpm makers ignore
          # `prefix` entirely and install to usr/lib/<name>/resources, where the
          # deb installer LOWERCASES the name and the rpm one PRESERVES its case
          # — so no single literal path serves both. A prefix-based glob
          # (`opt/*/resources`) already matched zero and failed the whole Linux
          # install job of the package acceptance run, and the same wrong prefix
          # was live in three places including shipped product code.
          # The unique computer-use/manifest.json is the reliable anchor: find
          # it, assert exactly one, and walk up.
          mans="$(find /tmp/pkgcheck -type f -path '*/computer-use/manifest.json')"
          n="$(printf '%s\n' "$mans" | grep -c . || true)"
          [ "$n" = "1" ] || { echo "::error::expected exactly one computer-use/manifest.json in the deb, found $n"; printf '%s\n' "$mans"; exit 1; }
          res="$(dirname "$(dirname "$mans")")"
          [ "$(basename "$res")" = "resources" ] || { echo "::error::manifest's grandparent is $(basename "$res"), expected resources"; exit 1; }
          echo "inspecting $res"

          # A PRESENCE check, because this failure mode is an ABSENCE. A package
          # with no llamacpp sidecar is byte-valid, correctly named and exits 0;
          # only asking for the file by name sees it.
          [ -d "$res/bin/llamacpp" ] || { echo "::error::no llamacpp sidecar in the deb — prepare-platform-binaries.js did not run"; ls -la "$res/bin"; exit 1; }
          [ -d "$res/web" ] || { echo "::error::no browser interface bundle in the deb"; exit 1; }

          # The Crew broker, whenever the staging step found one: in the shipped .deb, the bytes
          # its manifest describes, and the very broker the artifact carried.
          if [ -f target/crew-broker/linux-x86_64/manifest.json ]; then
            node -e '
              const { inspectCrewBroker } = require("./ui/desktop/scripts/crew-broker-resources");
              const result = inspectCrewBroker(process.argv[1], { required: true, appVersion: process.argv[2] });
              result.problems.forEach((problem) => console.log(`::error::${problem}`));
              process.exit(result.problems.length > 0 ? 1 : 0);
            ' "$res/bin" "$v"
            cmp "$res/bin/crew-broker/linux-x86_64/biorouter-crew" target/x86_64-unknown-linux-gnu/release/biorouter-crew \
              || { echo "::error::the deb's Crew broker is not the linux-backend artifact's"; exit 1; }
            echo "the deb carries the Crew broker and its manifest"
          fi

          # `ocu` at mode 0200 ships non-executable and Biorouter Copilot does
          # not work on Linux, with nothing in the test suite catching it. That
          # is the mode-mangling this whole workflow exists to avoid, so read it
          # back off the packaged copy.
          ocu="$res/computer-use/ocu"
          [ -x "$ocu" ] || { echo "::error::the Copilot helper is not executable in the deb: $(ls -l "$ocu" 2>&1)"; exit 1; }
          echo "ocu in the deb: $(ls -l "$ocu" | awk '{print $1}')"

          # No other platform's executables may ride along. The recursive sweep
          # in build-linux-deb.sh exists because a top-level *.exe glob could not
          # match src/bin/llamacpp/llama-server.exe, and 31 Windows files shipped
          # inside a .deb as a result.
          foreign="$(find "$res/bin" \( -name '*.exe' -o -name '*.dll' -o -name '*.cmd' \) -type f | head -20)"
          [ -z "$foreign" ] || { echo "::error::Windows files in a Linux package:"; echo "$foreign"; exit 1; }

          # ⚠ RUN it and COMPARE. The runner is x86_64 Linux, so the packaged
          # backend is natively executable here — there is no reason to ship a
          # version nobody asked. Printing it would not be a check; an automated
          # run has no eye to read it with. `biorouterd --version` prints
          # "biorouter-server <ver>".
          got="$("$res/bin/biorouterd" --version)"
          echo "packaged backend reports: $got"
          case "$got" in
            *"$v") : ;;
            *) echo "::error::packaged backend is '$got' but this release is $v"; exit 1 ;;
          esac

          sha256sum "$deb" "$rpm" "$cli_deb" "$cli_rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ inputs.version }}
          path: |
            ui/desktop/out/make/deb/x64/*.deb
            ui/desktop/out/make/rpm/x64/*.rpm
            dist/cli/*.deb
            dist/cli/*.rpm
          if-no-files-found: error
          retention-days: 7
