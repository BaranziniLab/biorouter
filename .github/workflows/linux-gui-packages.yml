# Builds the Linux GUI deb/rpm and the CLI-only deb/rpm on a real Linux runner.
#
# ⚠ Why this exists rather than the Docker cross-build in `scripts/release.sh`
# `cmd_linux`. On a macOS release host, Docker Desktop stamps files with a
# `com.docker.grpcfuse.ownership` xattr and its file-sharing layer reports
# permissions from that xattr rather than the inode, so every file the container
# wrote into `out/resources/computer-use/` landed as `--w-------` and the
# packager could not read what it had just written. Measured on 1.91.0 across
# three attempts with the source verified clean each time; a Docker volume
# instead of the bind mount made no difference.
#
# Note what that would have done had the modes been merely wrong rather than
# unreadable: `ocu` at mode 0200 ships non-executable and Biorouter Copilot does
# not work on Linux, with nothing in the test suite catching it. Building where
# the packages are meant to run removes the whole class.
#
# ⚠ THE BACKEND IS NOT BUILT ON THE RUNNER. It is cross-compiled in the pinned
# `rust:1.92-bullseye` image by `scripts/build-computer-use-package-cross.sh`,
# which also runs `check-glibc-floor.sh` and `check-linux-runtime-deps.sh`.
# The first version of this workflow ran a bare `cargo build --release` on
# ubuntu-24.04 and would have shipped binaries linked against that runner's
# glibc 2.39, which fail to start on Debian 12 / Ubuntu 22.04 / Rocky 9 — the
# exact distros the 2.31 floor exists to protect. Nothing here would have caught
# it: `check-glibc-floor.sh`'s own header says a `cargo check` cannot see this
# because checks do not link, and the repo's container smoke tests all run on
# newer glibc (bookworm 2.36, rocky9 2.34). Do not "simplify" this back to a
# host cargo build.
name: Linux GUI packages
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
permissions:
  contents: read
jobs:
  backend:
    name: Linux backend (pinned glibc)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .cross-cache/registry
            .cross-cache/target/x86_64-unknown-linux-gnu
          key: cross-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/cross-env.sh') }}
          restore-keys: cross-x86_64-unknown-linux-gnu-

      # This is the ONLY supported way to produce shipped Linux binaries: it
      # pins the bullseye image and then asserts the floor it just built against.
      - name: Cross-build the backend and assert the glibc floor
        run: bash scripts/build-computer-use-package-cross.sh x86_64-unknown-linux-gnu

      - name: Take ownership of the container-written cache
        if: always()
        run: if [ -d .cross-cache ]; then sudo chown -R "$(id -u):$(id -g)" .cross-cache; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-backend-${{ inputs.version }}
          path: target/x86_64-unknown-linux-gnu/release/
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Linux deb + rpm (GUI and CLI-only)
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-backend-${{ inputs.version }}
          path: target/x86_64-unknown-linux-gnu/release/

      # Actions artifacts do not preserve the executable bit.
      - name: Restore executable modes
        run: chmod +x target/x86_64-unknown-linux-gnu/release/biorouter target/x86_64-unknown-linux-gnu/release/biorouterd

      # Re-assert the floor on THIS job's copy. The check in `backend` proved the
      # bytes it compiled; this proves the bytes that are about to be packaged,
      # which is a different claim once an upload/download sits between them.
      - name: Re-assert the glibc floor on the downloaded binaries
        run: bash scripts/check-glibc-floor.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Biorouter Copilot helper payload
        run: python3 scripts/computer-use-runtime.py build linux-x64

      # `src/bin` is not tracked in git, and `build-linux-deb.sh` copies the
      # Rust binaries into it rather than creating it.
      - name: Create the staging directory
        run: mkdir -p ui/desktop/src/bin

      # ⚠ USE THE CANONICAL SCRIPT — this is `release.sh` `cmd_linux` verbatim,
      # just running where Docker bind mounts are ordinary bind mounts.
      #
      # Do NOT open-code `npm run make --platform=linux` here. That command is
      # `check-package-prereqs.mjs && fix-node-pty-permissions.mjs &&
      # electron-forge make`, and no forge hook calls
      # `prepare-platform-binaries.js`. This repository has already shipped that
      # exact bug once: `build-linux-deb.sh`'s own comment records that it "used
      # to call `npm run make` directly and skip it entirely, which is why the
      # Linux packages were the only ones with no binary validation — and why
      # they shipped a Windows llama-server". `fetchLlamaServer` is called from
      # nowhere else, and the two binary guards live inside the script that
      # would be skipped, so the omission conceals itself.
      #
      # The script copies the Linux binaries into src/bin, sweeps foreign
      # executables recursively, runs prepare-platform-binaries, and then makes
      # the deb and rpm.
      - name: Build the GUI deb and rpm with the canonical script
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/ws \
            "$(node -e 'console.log(require(process.argv[1]).image)' ui/desktop/scripts/linux-native-baseline.json)" \
            bash /ws/ui/desktop/scripts/build-linux-deb.sh

      # The container writes as root; later steps and the upload run as the
      # runner user.
      - name: Take ownership of the container-written tree
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ui/desktop/out ui/desktop/src/bin ui/desktop/node_modules 2>/dev/null || true

      # Release assets 7 and 8. Independent of the GUI packaging and it does not
      # disturb node_modules, exactly as `cmd_cli-linux` notes.
      - name: Build the CLI-only deb and rpm
        run: bash scripts/build-cli-linux-packages.sh "${{ inputs.version }}"

      # Assert what was produced rather than trusting an exit code. `cmd_linux`
      # carries the same assertion, and its comment records why: a bash function
      # returns its LAST command's status, so three trailing `log` lines once
      # masked a failing `docker run` entirely and the phase printed paths for
      # files it had not produced.
      - name: Verify the artifacts, the helper, and the packaged payload
        run: |
          set -e
          v='${{ inputs.version }}'
          deb="ui/desktop/out/make/deb/x64/biorouter_${v}_amd64.deb"
          rpm="ui/desktop/out/make/rpm/x64/Biorouter-${v}-1.x86_64.rpm"
          cli_deb="dist/cli/biorouter-cli_${v}_amd64.deb"
          cli_rpm="dist/cli/biorouter-cli-${v}-1.x86_64.rpm"
          for f in "$deb" "$rpm" "$cli_deb" "$cli_rpm"; do
            [ -f "$f" ] || { echo "::error::missing release artifact $f"; exit 1; }
            echo "$(du -h "$f" | cut -f1)  $f"
          done

          # ⚠ A PRESENCE check, because this failure mode is an ABSENCE. A
          # package with no llamacpp sidecar is byte-valid, correctly named and
          # exits 0; only asking for the file by name sees it. `ocu` at mode
          # 0200 ships non-executable and Biorouter Copilot does not work on
          # Linux, with nothing in the test suite catching it.
          pkg="ui/desktop/out/Biorouter-linux-x64/resources"
          ocu="$pkg/computer-use/ocu"
          [ -x "$ocu" ] || { echo "::error::the Copilot helper is not executable: $(ls -l "$ocu" 2>&1)"; exit 1; }
          [ -d "$pkg/bin/llamacpp" ] || { echo "::error::no llamacpp sidecar in the package — prepare-platform-binaries.js did not run"; ls -la "$pkg/bin"; exit 1; }
          [ -d "$pkg/web" ] || { echo "::error::no browser interface bundle at $pkg/web"; exit 1; }

          # No other platform's executables may ride along. The recursive sweep
          # in build-linux-deb.sh exists because a top-level *.exe glob could not
          # match src/bin/llamacpp/llama-server.exe, and 31 Windows files shipped
          # inside a .deb as a result.
          foreign="$(find "$pkg/bin" \( -name '*.exe' -o -name '*.dll' -o -name '*.cmd' \) -type f | head -20)"
          [ -z "$foreign" ] || { echo "::error::Windows files in a Linux package:"; echo "$foreign"; exit 1; }

          echo "ocu: $(ls -l "$ocu" | awk '{print $1}')"
          sha256sum "$deb" "$rpm" "$cli_deb" "$cli_rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ inputs.version }}
          path: |
            ui/desktop/out/make/deb/x64/*.deb
            ui/desktop/out/make/rpm/x64/*.rpm
            dist/cli/*.deb
            dist/cli/*.rpm
          if-no-files-found: error
          retention-days: 7
