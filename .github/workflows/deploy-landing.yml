name: Deploy landing site

# Publishes the static landing site in landing/ (the former biorouter-landing
# repo, custom domain biorouter.ucsf.edu) to GitHub Pages. Runs on every push to
# main that touches landing/, docs/website/ (the docs page's sources) or this
# workflow, so the landing page ships together with the app, and once a day, to
# refresh the Baseten model catalog published beside it.
#
# One-time setup before the first successful run (see landing/README.md):
#   1. Release the biorouter.ucsf.edu custom domain from the old
#      BaranziniLab/biorouter-landing repo (Settings -> Pages -> remove domain).
#   2. In THIS repo: Settings -> Pages -> Source = "GitHub Actions".
#   3. The `baseten-feed` Environment, restricted to main, holding the secret
#      BASETEN_API_KEY (see `baseten-catalog` below). Done 2026-10-20.
# The CNAME file in landing/ re-asserts the custom domain on each deploy.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'docs/website/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch: {}
  # Daily, so the Baseten model catalog (see `baseten-catalog` below) is at
  # most a day old. Off the hour to stay clear of GitHub's busiest minute.
  schedule:
    - cron: '17 9 * * *'

# Allow the workflow to mint the OIDC token Pages needs and publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight deploy finish rather
# than cancelling it (avoids leaving the live site half-published).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # This workflow used to run zero checks, so a push to landing/ could publish a
  # registry the shipped app does not enforce — retagging an extension Public on
  # the site while the compiled-in private set still calls it private, or the
  # reverse. The deploy is now gated on the same two registry assertions
  # `just check-everything` runs, so the published catalog and the app that
  # enforces it can never be shipped out of agreement.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The mutant suite first, then the checker it grades. Order matters: the
      # live `--check` below passes against a `checkDocsPrivacy` rewritten to
      # `return []`, so on its own it cannot tell "the table agrees" from "the
      # check stopped asking". The suite is what refuses the second reading.
      - name: Check the docs privacy checker still catches what it must
        run: node --test landing/scripts/check-docs-privacy.test.mjs

      # The site's look rules: the type scale, two weights, tracking tokens, no
      # caps labels, the shared easing and the control heights. It reads the
      # stylesheets as text, and its mutants show each rule failing first.
      - name: Check the site stylesheets keep the look rules
        run: node --test landing/scripts/look-rules.test.mjs

      - name: Check the BAAM private set agrees in all three committed copies
        run: node landing/scripts/check-consistency.mjs --check

      - name: Check the documentation matches its tracked sources
        run: node landing/scripts/assemble-docs.mjs --check

      - name: Check the three registry outputs are what baam.html generates
        run: node landing/scripts/build-registry.mjs --check

      # The two checks above are about the CATALOG. This one is about the PAGE
      # that is being published: the privacy facet, the tier badges in both the
      # rendered and the no-JS view, and the tag row that deletes rather than
      # wraps what does not fit. Without it the entire shelf UI could regress and
      # still ship, because the published bytes are `landing/` as-is — there is
      # no build step between this repo and biorouter.ucsf.edu whose failure
      # would catch anything.
      - name: Install the Playwright module and a chromium
        run: npm ci
        working-directory: ui/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui/desktop

      - name: Check the BAAM shelf's privacy badges and facet in a browser
        run: node --test landing/scripts/baam-privacy-facet.test.mjs

      # Fills before lines (owner message 13, R-27). look-rules.test.mjs above
      # reads the stylesheets as text; this reads what the pages PAINT at 1440
      # and 390 wide, so a rule that is written right and still loses the
      # cascade, or a box the animations build from script, fails here.
      - name: Check the site paints fills, not outlines, in a browser
        run: node --test landing/scripts/fill-rules.browser.test.mjs

      # Layout that holds still (vision round 2, V5-R2-1 and V5-R2-2). The wall
      # animation's composers keep the model's name at 390, 360 and 320 wide, and
      # opening a BAAM row moves none of its GitHub link, download button or
      # chevron out from under the pointer. Both are measurements, which jsdom
      # cannot take; this reads the real pages in the same chromium.
      - name: Check the site's layout holds still in a browser
        run: node --test landing/scripts/layout-stability.browser.test.mjs

  # Baseten's model list and prices (`GET /v1/models`) need an API key, and
  # the app must not. This job reads them with a key held ONLY in the
  # `baseten-feed` Environment, which is restricted to `main`, so a branch or a
  # fork's pull request can never run it with the key (this workflow has no
  # pull_request trigger at all). The key is in the environment of one step,
  # is sent only as a header, and is never echoed. The step that builds the
  # published file does not have it.
  #
  # What it publishes, provider-catalogs/baseten.json, is read by
  # crates/biorouter/src/providers/live_catalog.rs. If this job fails (no
  # secret yet, Baseten down, a response that has shrunk), the deploy below
  # republishes the feed that is live now, and the app keeps its bundled
  # catalog until a feed exists. The run still shows red, so someone looks.
  #
  # Setup (a repo admin, once): Settings -> Environments -> New environment
  # `baseten-feed`; Deployment branches = Selected -> `main`; add the
  # environment secret BASETEN_API_KEY (a Baseten team key with "Call Model
  # APIs" on one cheap model; listing models runs no inference). The
  # environment exists: created 2026-10-20, deployments limited to `main`,
  # secret BASETEN_API_KEY set. Rotating the key means replacing that secret.
  baseten-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: baseten-feed
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The builder's own suite, before the key is used and before anything is
      # built: it holds the script to the bounds live_catalog.rs enforces, so a
      # script that would publish a feed every client refuses fails here, and
      # the deploy carries the live feed forward. No install and no key needed.
      - name: Test the feed builder
        run: node --test landing/scripts/build-provider-catalog.test.mjs

      - name: Fetch Baseten's model catalog
        env:
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
        run: |
          if [ -z "${BASETEN_API_KEY}" ]; then
            echo "::error::BASETEN_API_KEY is not set in the baseten-feed environment. The site deploys with the feed that is live now."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${BASETEN_API_KEY}" \
            --output "${RUNNER_TEMP}/baseten-models.json" \
            https://inference.baseten.co/v1/models

      - name: Build the published feed
        run: |
          mkdir -p "${RUNNER_TEMP}/provider-catalogs"
          node landing/scripts/build-provider-catalog.mjs \
            "${RUNNER_TEMP}/baseten-models.json" \
            "${RUNNER_TEMP}/provider-catalogs/baseten.json"

      - name: Hand the feed to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: provider-catalogs
          path: ${{ runner.temp }}/provider-catalogs/
          retention-days: 3

  deploy:
    needs: [check, baseten-catalog]
    # A failed catalog must not stop the site: deploy whenever the checks pass.
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Take the fresh Baseten catalog
        if: ${{ needs.baseten-catalog.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: provider-catalogs
          path: landing/provider-catalogs

      # A Pages deploy replaces the whole site, so a run without a fresh feed
      # would otherwise delete the live one. Carry the live one forward; with
      # neither (the first runs, before the secret exists) publish none and
      # the app uses its bundled catalog.
      - name: Otherwise keep the feed that is live now
        if: ${{ needs.baseten-catalog.result != 'success' }}
        run: |
          mkdir -p landing/provider-catalogs
          if curl --fail --silent --show-error --max-time 30 \
              --output landing/provider-catalogs/baseten.json \
              https://biorouter.ucsf.edu/provider-catalogs/baseten.json; then
            echo "::warning::Republishing the Baseten catalog that was already live."
          else
            rm -f landing/provider-catalogs/baseten.json
            echo "::warning::No Baseten catalog published; the app uses its bundled one."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Served as-is (no Jekyll). The CNAME inside sets the custom domain.
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
