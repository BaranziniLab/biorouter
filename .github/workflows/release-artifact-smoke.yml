name: Release artifact smoke
run-name: Release artifact smoke v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Download Windows artifact from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $tag = "v$env:VERSION"
          $assetName = "Biorouter-win32-x64-$env:VERSION.zip"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          # The draft is what the publish gate asks about, so it wins. A
          # PUBLISHED release of the same tag is accepted too, so this workflow
          # can be re-run after publication — which is how the port-release step
          # below is proven able to fail: dispatch it at a version whose daemon
          # HAS the defect and require it to fail there.
          $found = @($releases | Where-Object { $_.tag_name -eq $tag -and $_.draft })
          if ($found.Count -eq 0) {
            $found = @($releases | Where-Object { $_.tag_name -eq $tag -and -not $_.draft })
            if ($found.Count -eq 1) { Write-Host "No draft for $tag; using the published release" }
          }
          if ($found.Count -ne 1) {
            throw "Expected one draft or published release for $tag, found $($found.Count)"
          }

          $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($found[0].id)/assets?per_page=100" | ConvertFrom-Json
          $assetMatches = @($assets | Where-Object { $_.name -eq $assetName })
          if ($assetMatches.Count -ne 1) {
            throw "Expected one $assetName asset, found $($assetMatches.Count)"
          }

          $zip = "artifact/$assetName"
          $headers = @{
            Accept = "application/octet-stream"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-WebRequest $assetMatches[0].url -Headers $headers -OutFile $zip
          Expand-Archive $zip artifact/unpacked

      - name: Run packaged CLI, daemon, and desktop
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          BIOROUTER_DISABLE_KEYRING: "true"
        run: |
          $desktopMatches = @(
            Get-ChildItem -LiteralPath "artifact/unpacked" -File -Recurse |
              Where-Object { $_.Name -ceq "Biorouter.exe" }
          )
          if ($desktopMatches.Count -ne 1) {
            throw "Expected one packaged Biorouter.exe, found $($desktopMatches.Count)"
          }
          $app = $desktopMatches[0].Directory.FullName
          $cli = Join-Path $app "resources/bin/biorouter.exe"
          $daemon = Join-Path $app "resources/bin/biorouterd.exe"
          $desktop = Join-Path $app "Biorouter.exe"
          $git = Join-Path $app "resources/bin/git/cmd/git.exe"
          $minGitMarker = Join-Path $app "resources/bin/git/mingit-version.txt"

          $helper = Join-Path $app "resources/computer-use"
          python scripts/computer-use-runtime.py verify win32-x64 --directory $helper
          if ($LASTEXITCODE -ne 0) { throw "Packaged native helper integrity check failed" }
          python scripts/test-computer-use-protocol.py $helper
          if ($LASTEXITCODE -ne 0) { throw "Packaged native helper protocol check failed" }
          python scripts/test-computer-use-windows-fixture.py $helper --report artifact/windows-fixture.json
          if ($LASTEXITCODE -ne 0) { throw "Packaged native helper fixture check failed" }
          python scripts/test-computer-use-packaged-windows-console.py --cli $cli --report artifact/windows-packaged-console.json
          if ($LASTEXITCODE -ne 0) { throw "Packaged Rust-to-Go console check failed" }
          $cliVersion = & $cli --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -notmatch [regex]::Escape($env:VERSION)) {
            throw "Packaged CLI did not report $env:VERSION"
          }
          $daemonVersion = & $daemon --version
          if ($LASTEXITCODE -ne 0 -or $daemonVersion -notmatch [regex]::Escape($env:VERSION)) {
            throw "Packaged daemon did not report $env:VERSION"
          }
          & $cli term --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaged terminal help failed" }

          if (!(Test-Path -LiteralPath $git) -or !(Test-Path -LiteralPath $minGitMarker)) {
            throw "Packaged MinGit executable or version marker is missing"
          }
          $minGitVersion = (Get-Content -LiteralPath $minGitMarker -Raw).Trim()
          $gitVersion = & $git --version
          if (
            [string]::IsNullOrWhiteSpace($minGitVersion) -or
            $LASTEXITCODE -ne 0 -or
            $gitVersion -notmatch [regex]::Escape($minGitVersion)
          ) {
            throw "Packaged MinGit did not match marker '$minGitVersion': $gitVersion"
          }

          $process = Start-Process $desktop -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "Packaged desktop exited during startup" }
          Stop-Process -Id $process.Id -Force
          Write-Host "Windows packaged runtime smoke passed for v$env:VERSION"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-windows-copilot-console
          path: artifact/windows-packaged-console.json
          if-no-files-found: warn

      # ⚠ Proven able to fail, and repeatable: dispatch this workflow at a
      # version whose daemon HAS the defect and the step below must fail with
      # "PORT STILL HELD". Measured on v1.91.0 (2026-09-22, run 35763477213):
      # the sleeper was spawned, the daemon was killed, the child stayed alive,
      # and the listener was still attributed to the dead daemon's pid.
      - name: A child the daemon spawns must not keep its port
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $desktopMatches = @(
            Get-ChildItem -LiteralPath "artifact/unpacked" -File -Recurse |
              Where-Object { $_.Name -ceq "Biorouter.exe" }
          )
          if ($desktopMatches.Count -ne 1) {
            throw "Expected one packaged Biorouter.exe, found $($desktopMatches.Count)"
          }
          $daemon = Join-Path $desktopMatches[0].Directory.FullName "resources/bin/biorouterd.exe"

          # Built by Windows PowerShell 5.1: pwsh 7 dropped Add-Type's
          # -OutputAssembly / -OutputType, so `shell: pwsh` cannot build it.
          $sleeper = Join-Path $env:RUNNER_TEMP "port-release-sleeper.exe"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows/build-port-release-sleeper.ps1 -Output $sleeper
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $sleeper)) {
            throw "could not build the stand-in sidecar"
          }

          ./scripts/windows/port-release-regression.ps1 -Daemon $daemon -Sleeper $sleeper `
            -Label "packaged v$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "the packaged daemon's port test failed" }
