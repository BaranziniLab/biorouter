name: Release artifact smoke
run-name: Release artifact smoke v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      windows_package_run:
        description: Optional successful Windows GUI packages run ID; blank downloads release assets
        required: false
        type: string
        default: ''
      package_source_sha:
        description: Exact 40-character source commit required with windows_package_run
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Parse the installed application smoke helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($helper in @('installed-release-smoke.ps1', 'normal-release-smoke.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              "$env:GITHUB_WORKSPACE/scripts/windows/$helper",
              [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$helper has PowerShell syntax errors"
            }
          }
      - name: Download Windows ZIP and installer from the release
        if: inputs.windows_package_run == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $tag = "v$env:VERSION"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read release metadata" }
          # The draft is what the publish gate asks about, so it wins. A
          # PUBLISHED release of the same tag is accepted too, so this workflow
          # can be re-run after publication — which is how the port-release step
          # below is proven able to fail: dispatch it at a version whose daemon
          # HAS the defect and require it to fail there.
          $found = @($releases | Where-Object { $_.tag_name -eq $tag -and $_.draft })
          if ($found.Count -eq 0) {
            $found = @($releases | Where-Object { $_.tag_name -eq $tag -and -not $_.draft })
            if ($found.Count -eq 1) { Write-Host "No draft for $tag; using the published release" }
          }
          if ($found.Count -ne 1) {
            throw "Expected one draft or published release for $tag, found $($found.Count)"
          }

          $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($found[0].id)/assets?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read release assets" }
          $headers = @{
            Accept = "application/octet-stream"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $evidence = @()
          foreach ($assetName in @("Biorouter-win32-x64-$env:VERSION.zip", "Biorouter-Setup-$env:VERSION.exe")) {
            $assetMatches = @($assets | Where-Object { $_.name -ceq $assetName })
            if ($assetMatches.Count -ne 1) {
              throw "Expected one $assetName asset, found $($assetMatches.Count)"
            }
            $asset = $assetMatches[0]
            $path = [IO.Path]::GetFullPath("artifact/$assetName")
            Invoke-WebRequest $asset.url -Headers $headers -OutFile $path
            $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.digest -cne "sha256:$digest" -or (Get-Item $path).Length -ne $asset.size) {
              throw "Downloaded $assetName does not match GitHub asset provenance"
            }
            $evidence += @{ name = $assetName; id = $asset.id; digest = $asset.digest;
              size = $asset.size; updated_at = $asset.updated_at; path = $path;
              release_id = $found[0].id; tag = $tag; workflow_source = $env:GITHUB_SHA }
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content artifact/windows-release-assets.json
          Expand-Archive "artifact/Biorouter-win32-x64-$env:VERSION.zip" artifact/unpacked

      - name: Download exact successful Windows package run assets
        if: inputs.windows_package_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PACKAGE_RUN: ${{ inputs.windows_package_run }}
          PACKAGE_SOURCE_SHA: ${{ inputs.package_source_sha }}
        run: |
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or
              $env:PACKAGE_RUN -notmatch '^[0-9]+$' -or
              $env:PACKAGE_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'CI package mode requires a stable version, numeric run ID and exact source SHA'
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package run metadata' }
          if ($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
              $run.path -cne '.github/workflows/windows-gui-packages.yml' -or
              $run.head_sha -cne $env:PACKAGE_SOURCE_SHA -or
              $run.repository.full_name -cne $env:GITHUB_REPOSITORY) {
            throw 'Package run does not match the successful expected workflow and exact source'
          }
          $metadata = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package artifact metadata' }
          $matches = @($metadata.artifacts | Where-Object { $_.name -ceq "windows-packages-$env:VERSION" })
          if ($matches.Count -ne 1 -or $matches[0].expired -or
              $matches[0].workflow_run.id -ne [long]$env:PACKAGE_RUN -or
              $matches[0].workflow_run.head_sha -cne $env:PACKAGE_SOURCE_SHA -or
              $matches[0].digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Expected one unexpired versioned package artifact from the exact run and source'
          }
          $asset = $matches[0]
          New-Item -ItemType Directory -Force artifact | Out-Null
          $archive = [IO.Path]::GetFullPath('artifact/windows-ci-packages.zip')
          Invoke-WebRequest $asset.archive_download_url -OutFile $archive -Headers @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.digest -cne "sha256:$digest" -or (Get-Item -LiteralPath $archive).Length -ne $asset.size_in_bytes) {
            throw 'Downloaded CI package archive does not match GitHub artifact digest and size'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath artifact/ci-packages
          $evidence = @()
          foreach ($name in @("Biorouter-win32-x64-$env:VERSION.zip", "Biorouter-Setup-$env:VERSION.exe")) {
            $files = @(Get-ChildItem -LiteralPath artifact/ci-packages -File -Recurse |
              Where-Object { $_.Name -ceq $name })
            if ($files.Count -ne 1) { throw "CI package artifact must contain exactly one $name" }
            $path = [IO.Path]::GetFullPath("artifact/$name")
            Copy-Item -LiteralPath $files[0].FullName -Destination $path
            $fileDigest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $evidence += @{ name = $name; path = $path; digest = "sha256:$fileDigest";
              size = (Get-Item -LiteralPath $path).Length; digest_source = 'authenticated CI artifact archive';
              artifact_id = $asset.id; artifact_digest = $asset.digest; package_run = $run.id;
              package_source_sha = $run.head_sha; workflow_source = $env:GITHUB_SHA; tag = "v$env:VERSION" }
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content artifact/windows-release-assets.json
          @{ version = $env:VERSION; package_run = $run.id; package_run_url = $run.html_url;
            package_source_sha = $run.head_sha; package_workflow = $run.path; artifact_id = $asset.id;
            artifact_name = $asset.name; artifact_digest = $asset.digest; archive_sha256 = $digest;
            archive_size = (Get-Item -LiteralPath $archive).Length; workflow_source = $env:GITHUB_SHA } |
            ConvertTo-Json -Depth 4 | Set-Content artifact/windows-ci-package-evidence.json
          Expand-Archive "artifact/Biorouter-win32-x64-$env:VERSION.zip" artifact/unpacked

      - name: Install Setup.exe and run the installed application
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $desktopMatches = @(Get-ChildItem -LiteralPath artifact/unpacked -File -Recurse |
            Where-Object { $_.Name -ceq "Biorouter.exe" })
          if ($desktopMatches.Count -ne 1) { throw "Expected exactly one ZIP desktop executable" }
          ./scripts/windows/installed-release-smoke.ps1 `
            -Setup "artifact/Biorouter-Setup-$env:VERSION.exe" `
            -ZipAppDirectory $desktopMatches[0].Directory.FullName `
            -Version $env:VERSION -AssetEvidence artifact/windows-release-assets.json `
            -Report artifact/installed/windows-installer-smoke.json

      - name: Run packaged CLI, daemon, and desktop
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          BIOROUTER_DISABLE_KEYRING: "true"
        run: |
          $desktopMatches = @(
            Get-ChildItem -LiteralPath "artifact/unpacked" -File -Recurse |
              Where-Object { $_.Name -ceq "Biorouter.exe" }
          )
          if ($desktopMatches.Count -ne 1) {
            throw "Expected one packaged Biorouter.exe, found $($desktopMatches.Count)"
          }
          $app = $desktopMatches[0].Directory.FullName
          $cli = Join-Path $app "resources/bin/biorouter.exe"
          $daemon = Join-Path $app "resources/bin/biorouterd.exe"
          $desktop = Join-Path $app "Biorouter.exe"
          $git = Join-Path $app "resources/bin/git/cmd/git.exe"
          $minGitMarker = Join-Path $app "resources/bin/git/mingit-version.txt"

          $helper = Join-Path $app "resources/computer-use"
          python scripts/computer-use-runtime.py verify win32-x64 --directory $helper
          if ($LASTEXITCODE -ne 0) { throw "Packaged native helper integrity check failed" }
          python scripts/test-computer-use-protocol.py $helper
          if ($LASTEXITCODE -ne 0) { throw "Packaged native helper protocol check failed" }
          python scripts/test-computer-use-windows-fixture.py $helper --report artifact/windows-fixture.json
          if ($LASTEXITCODE -ne 0) { throw "Packaged native helper fixture check failed" }
          python scripts/test-computer-use-packaged-windows-console.py --cli $cli --report artifact/windows-packaged-console.json
          if ($LASTEXITCODE -ne 0) { throw "Packaged Rust-to-Go console check failed" }
          $cliVersion = & $cli --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -notmatch [regex]::Escape($env:VERSION)) {
            throw "Packaged CLI did not report $env:VERSION"
          }
          $daemonVersion = & $daemon --version
          if ($LASTEXITCODE -ne 0 -or $daemonVersion -notmatch [regex]::Escape($env:VERSION)) {
            throw "Packaged daemon did not report $env:VERSION"
          }
          & $cli term --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaged terminal help failed" }

          if (!(Test-Path -LiteralPath $git) -or !(Test-Path -LiteralPath $minGitMarker)) {
            throw "Packaged MinGit executable or version marker is missing"
          }
          $minGitVersion = (Get-Content -LiteralPath $minGitMarker -Raw).Trim()
          $gitVersion = & $git --version
          if (
            [string]::IsNullOrWhiteSpace($minGitVersion) -or
            $LASTEXITCODE -ne 0 -or
            $gitVersion -notmatch [regex]::Escape($minGitVersion)
          ) {
            throw "Packaged MinGit did not match marker '$minGitVersion': $gitVersion"
          }

          ./scripts/windows/normal-release-smoke.ps1 -AppDirectory $app -ZipAppDirectory $app `
            -Version $env:VERSION -AssetEvidence artifact/windows-release-assets.json `
            -Report artifact/normal-zip/windows-normal-smoke.json
          Write-Host "Windows packaged runtime smoke passed for v$env:VERSION"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-windows-copilot-console
          path: artifact/windows-packaged-console.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-windows-installer-runtime
          path: |
            artifact/windows-release-assets.json
            artifact/windows-ci-package-evidence.json
            artifact/installed/
            artifact/normal-zip/
          if-no-files-found: warn

      # ⚠ Proven able to fail, and repeatable: dispatch this workflow at a
      # version whose daemon HAS the defect and the step below must fail with
      # "PORT STILL HELD". Measured on v1.91.0 (2026-09-22, run 35763477213):
      # the sleeper was spawned, the daemon was killed, the child stayed alive,
      # and the listener was still attributed to the dead daemon's pid.
      - name: A child the daemon spawns must not keep its port
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $desktopMatches = @(
            Get-ChildItem -LiteralPath "artifact/unpacked" -File -Recurse |
              Where-Object { $_.Name -ceq "Biorouter.exe" }
          )
          if ($desktopMatches.Count -ne 1) {
            throw "Expected one packaged Biorouter.exe, found $($desktopMatches.Count)"
          }
          $daemon = Join-Path $desktopMatches[0].Directory.FullName "resources/bin/biorouterd.exe"

          # Built by Windows PowerShell 5.1: pwsh 7 dropped Add-Type's
          # -OutputAssembly / -OutputType, so `shell: pwsh` cannot build it.
          $sleeper = Join-Path $env:RUNNER_TEMP "port-release-sleeper.exe"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows/build-port-release-sleeper.ps1 -Output $sleeper
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $sleeper)) {
            throw "could not build the stand-in sidecar"
          }

          ./scripts/windows/port-release-regression.ps1 -Daemon $daemon -Sleeper $sleeper `
            -Label "packaged v$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "the packaged daemon's port test failed" }
