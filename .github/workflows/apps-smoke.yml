name: Apps smoke

on:
  pull_request:
    paths:
      - ".github/workflows/apps-smoke.yml"
      - "crates/biorouter-mcp/**"
      - "scripts/agent-drafter/**"
      - "scripts/agent-drafter-apps/**"
      - "ui/desktop/package.json"
      - "ui/desktop/package-lock.json"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Same rule as rust.yml and frontend.yml: a newer run of the same pull request,
  # or a newer push to main (since 2026-11-14), cancels the older one; a manual
  # dispatch is keyed by run_id and never cancelled.
  group: apps-smoke-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# The repository's default token can write to every scope, and a workflow with
# no permissions block hands it to every job. Nothing here writes: checkout reads
# the tree, and caches and artifacts use the runner's own token
# (scripts/check-workflow-hardening.py).
permissions:
  contents: read

jobs:
  reference-apps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.92"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The image's own toolchain must not reach the cache key, and only main
      # saves. rust.yml's `lib-tests` job has the measurements behind both.
      - name: Keep only the pinned Rust toolchain (stable cache key)
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(rustup show active-toolchain | tr -d '\r' | cut -d' ' -f1)
          [ -n "$pinned" ]
          for t in $(rustup toolchain list | tr -d '\r' | cut -d' ' -f1); do
            if [ "$t" != "$pinned" ]; then rustup toolchain uninstall "$t"; fi
          done
          rustup toolchain list
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: apps-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Rust native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libxcb1-dev pkg-config
      - name: Install desktop test runtime
        working-directory: ui/desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The whole binary, not just the Chromium harness. Its other tests bundle
      # every example with esbuild, which is hermetic only where `npm ci` has
      # put one in ui/desktop/node_modules — here. Anywhere else the bundler
      # falls back to `npx --yes esbuild`, a download from the npm registry,
      # which is why rust.yml's no-network integration step leaves this binary
      # to this job. This line used to filter by name to the Chromium test
      # alone, so the other five ran in no workflow at all.
      - name: Run reference apps in Chromium, and the bundling tests
        run: cargo test -p biorouter-mcp --test ui_example_apps -- --include-ignored --nocapture
