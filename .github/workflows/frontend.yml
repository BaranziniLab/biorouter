name: Frontend

# The desktop app had NO CI gate of any kind until this workflow. `just
# check-everything` wires up `npm run lint:check`, and package.json declares a
# lint-staged block, but neither ever runs automatically: core.hooksPath points
# at an absolute developer-specific directory containing only `commit-msg`, so
# husky's hooks are never consulted. Every frontend gate ran only on whichever
# machine last happened to run it by hand.
#
# Scope is deliberately narrow. The cheap static gates and vitest run on
# ubuntu-latest; separate jobs regenerate the API contract and exercise the file
# preview surface in Electron. It does not package, sign, notarize, or stage any
# release binary, and it never writes to `ui/desktop/src/bin/` — so the release
# pipeline's "one platform at a time" and "reinstall node_modules after a Docker
# build" invariants are untouched.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Deliberately NOT path-filtered. A path-filtered job that is also a required
# status check blocks merges forever on PRs that do not touch the filter (GitHub
# reports "expected — waiting for status" and never resolves). Always running is
# free on a public repo and keeps the check safe to mark required.

concurrency:
  group: frontend-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a main run — a cancelled push
  # leaves that commit with no status at all, which matters when bisecting.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ui/desktop

env:
  # `electron` is a non-optional devDependency whose install script downloads a
  # ~150 MB platform binary. No vitest test needs the Electron runtime — the one
  # file that references it (src/biorouterd.test.ts) imports `electron` as
  # `import type`, which TypeScript erases. Skipping the download removes ~30s
  # and a network flake source from every run.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  FORCE_COLOR: "1"

jobs:
  # ── Generated API contract ────────────────────────────────────────────────
  # `scripts/check-openapi-schema.sh` is only a diff checker. The schema and
  # TypeScript client must be regenerated first or a stale committed client is
  # indistinguishable from a current one. Keep this as a PR job as well as the
  # local `just check-openapi-schema` target so CI cannot go green on drift.
  api-contract:
    name: Generated API contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: openapi-contract

      - name: Install Rust native build dependencies
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libxcb1-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate server OpenAPI schema
        working-directory: ${{ github.workspace }}
        run: cargo run -p biorouter-server --bin generate_schema --locked

      - name: Regenerate TypeScript API client
        run: npx @hey-api/openapi-ts

      - name: Generated schema and client are committed
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-openapi-schema.sh

  # ── Static gates: typecheck, lint, theme codegen, contrast, token mirrors ──
  # Measured at ~42s CPU (tsc) + ~32s CPU (eslint) + ~1s CPU (the three node
  # scripts). eslint is NOT type-aware here — eslint.config.js declares no
  # parserOptions.project — so it is pure syntactic linting over 656 files.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json declares engines ^24.0.0 and hermit pins 24.10.0.
          # (Note: apps-smoke.yml still pins 22 — that is a pre-existing
          # inconsistency, not something this workflow should copy.)
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Each gate is its own step rather than a single `npm run lint:check`, and
      # each runs even if an earlier one failed. `lint:check` chains with && and
      # stops at the first failure, which means a contributor fixes one gate,
      # pushes, waits, and discovers the next — five round trips instead of one.
      # `!cancelled()` (not `always()`) still honours a cancelled run.
      #
      # The price: these steps copy `lint:check` from package.json BY HAND, so a
      # gate added there runs in no CI job until it also gets a step here.
      # check:tokens was in lint:check from 2026-08-07 and in no workflow until
      # its step below was added.
      - name: Typecheck (tsc --noEmit)
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint (eslint, zero warnings)
        if: ${{ !cancelled() }}
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings 0 --no-warn-ignored

      - name: Theme codegen is current
        if: ${{ !cancelled() }}
        run: npm run check:themes

      - name: Contrast assertions (WCAG)
        if: ${{ !cancelled() }}
        run: npm run check:contrast

      - name: Token mirrors (@theme inline)
        if: ${{ !cancelled() }}
        run: npm run check:tokens

  # ── The BAAM registry generator ───────────────────────────────────────────
  # landing/scripts/build-registry.mjs writes three copies of one catalog, and
  # one of them is a compiled-in Rust security baseline
  # (crates/biorouter/src/privacy/registry_private.rs). Its refusals are what
  # keeps a mis-tagged card from silently classifying a private extension as
  # Public, so they get a gate rather than a hand-run.
  #
  # Its own job, not a step in `static`: it needs no npm install (node:test
  # ships with the runtime) and it runs from the repo root, not ui/desktop.
  registry:
    name: Registry generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generator regression suite
        run: node --test landing/scripts/build-registry.test.mjs

      # The published registry, the desktop fallback snapshot and the
      # compiled-in private set are one catalog in three forms. Being written by
      # one command is not the same as being in sync — an interrupted run, a
      # hand edit or a rebase that took one side of a conflict all leave a
      # published catalog the app does not enforce.
      - name: The three generated outputs match baam.html
        if: ${{ !cancelled() }}
        run: node landing/scripts/build-registry.mjs --check

      # docs.html's agents table is the one privacy surface with no generator.
      # Its checker runs in the Pages deploy — which is AFTER merge, i.e. too
      # late to stop the drift landing. These two steps are the pre-merge half:
      # the mutant suite (a checker that cannot fail is not a gate) and then the
      # live join against registry.json.
      - name: The docs privacy checker still catches what it must
        if: ${{ !cancelled() }}
        run: node --test landing/scripts/check-docs-privacy.test.mjs

      - name: docs.html's agents table agrees with the registry
        if: ${{ !cancelled() }}
        run: node landing/scripts/check-consistency.mjs --check

  # ── The BAAM shelf in a real browser ──────────────────────────────────────
  # The generator job above proves the CATALOG is right. This proves the PAGE
  # is: that the privacy facet matches a card's declared tier rather than a
  # substring of its prose, that the 22px `overflow: hidden` tag row drops only
  # what does not fit and never the tier badge, that the no-JS fallback labels
  # every card, and that a registry entry with an unreadable tier is refused
  # rather than painted Public.
  #
  # Half of that is layout, and jsdom returns zeros for every rect — a clipped
  # tag row and a perfect one are indistinguishable there. So it needs a real
  # chromium, which is why it is its own job: `npm ci` in ui/desktop for the
  # Playwright module, one browser download, and nothing else in the workflow
  # has to wait for either.
  shelf:
    name: BAAM shelf (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only chromium. The suite launches whatever it can find, but a runner
      # with no browser at all FAILS rather than skipping — a layout gate that
      # silently skips is a decoration.
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Privacy badges and facet
        working-directory: .
        run: node --test landing/scripts/baam-privacy-facet.test.mjs

  # ── Unit tests ────────────────────────────────────────────────────────────
  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The reported "flakiness under parallelism" is a timeout budget defect,
      # not test-order pollution:
      #
      #   * vitest.config.ts sets no `pool` or `isolate`, so the defaults apply
      #     (pool: 'forks', isolate: true). Every file gets a fresh process and
      #     module registry, so cross-file state bleed is structurally
      #     impossible — which rules out the usual parallelism explanation.
      #   * In a full local run, 40 of 42 failures had a recorded duration of
      #     >= 5000ms, exactly vitest's default testTimeout. Failure is almost
      #     perfectly predicted by crossing that line.
      #   * src/test/setup.ts sets asyncUtilTimeout to *exactly* 5000ms, equal
      #     to the test timeout — so any waitFor/findBy that actually uses its
      #     budget kills the test before the async helper can succeed.
      #   * Controlled single-variable check: dialog.test.tsx run alone FAILED
      #     at the 5000ms default (test took 8005ms) and PASSED at 30000ms
      #     (same test, 8358ms). Only the flag changed.
      #
      # So the fix is a timeout, applied here on the CLI so this workflow can
      # merge without touching source. Raising a timeout costs nothing on a
      # green run — it bounds failures only.
      #
      # `--no-file-parallelism` is explicitly the WRONG lever: per-file fixed
      # overhead dominates (one measured file: 44.15s wall, of which ~34s was
      # jsdom environment + setup + import versus 12.6s of actual test time).
      # Serialising 159 files multiplies that overhead and would trade a red
      # 14-minute build for a green multi-hour one nobody waits for.
      #
      # NO --retry. A retry flag green-washes precisely the "everything is
      # green" pathology that let several bugs ship from this branch, and a
      # clean full run needs zero retries. If a test needs one, fix the test.
      - name: Run vitest
        run: |
          npx vitest run \
            --testTimeout=30000 \
            --hookTimeout=30000 \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=./vitest-junit.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: ui/desktop/vitest-junit.xml
          if-no-files-found: warn
          retention-days: 7

  # ── File preview panel in a native Electron renderer ─────────────────────
  # Vitest/jsdom cannot render PDFs, Office documents or compositor captures.
  # This job deliberately remains separate from `unit` and downloads Electron
  # only here. It covers image/PDF/DOCX/XLSX/PPTX rendering plus annotation
  # crop geometry. Live websites are not claimed: those use the app main
  # process's native WebContentsView and are covered by the packaged/dev-app
  # release gate in docs/releases/preview-panel-release-gate.md.
  preview-panel:
    name: Preview panel (Electron)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json

      # The workflow-level environment skips Electron everywhere else. This
      # job is the one intentional exception because Playwright launches that
      # exact runtime rather than a browser substitute.
      - name: Install dependencies including Electron
        run: env -u ELECTRON_SKIP_BINARY_DOWNLOAD npm ci

      - name: Render files and capture an annotated region
        env:
          BIOROUTER_PREVIEW_OUTPUT_DIR: ${{ github.workspace }}/ui/desktop/preview-panel-evidence
        run: npm run test:preview-panel

      - name: Upload preview screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-panel-evidence-${{ runner.arch }}
          path: ui/desktop/preview-panel-evidence
          if-no-files-found: error
          retention-days: 14
