name: Rust

# BR-70 — the repo's first `cargo` CI. Two orthogonal axes:
#   * cross-check  — does the code we SHIP (windows-gnu / linux-gnu) COMPILE,
#                    including #[cfg(test)] code, using the release's own docker
#                    recipe (scripts/cross-env.sh)? This is the PR gate.
#   * test         — does the platform BEHAVIOUR work on real kernels (macOS
#                    Seatbelt, Linux Landlock, Windows PowerShell + taskkill)?
# A nightly job runs the full cross BUILD — link errors, the glibc floor, and
# the shipped packages' runtime-library contract — none of which a `cargo check`
# can see, because a check never links and so never emits a NEEDED entry or a
# symbol version.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"   # nightly: the expensive full cross-BUILD + glibc floor
  # A schedule-only job is a job nobody can check. When this was written,
  # cross-build-nightly had run 36 times since 2026-07-15 — its entire existence
  # up to then — for 33 failures and 3 cancellations and not one green. (It has
  # since been fixed and passes; that figure is the history behind this design,
  # not the job's current state. Read its latest run rather than this line.) Part of why that stood for a month is that
  # there was no way to ASK it a question: you could read the log the morning
  # after, change something, and then wait a day to learn whether the change
  # helped. Manual dispatch turns a 24-hour edit loop into a 20-minute one. It
  # runs every job in this file, the nightly included; the three PR-gate jobs
  # are cheap next to the cross build and their signal is never unwelcome. Read
  # cross-build-nightly's OWN conclusion rather than the run's, though — the
  # matrix carries whatever is red on main at the time (windows-latest was, the
  # day this was written), and that says nothing about the cross build.
  workflow_dispatch:

# Keyed by event as well as ref, and the event half is load-bearing. `github.ref`
# for the nightly is refs/heads/main — the SAME group a push to main lands in —
# so with cancel-in-progress a morning merge silently killed the night's cross
# build. Three scheduled runs died that way (2026-08-01, 08-07, 08-09) and were
# indistinguishable in the run list from a real failure. Adding manual dispatch
# would have made it worse: pressing the button on main would cancel whatever
# push-triggered gate was in flight. Separating by event keeps the behaviour that
# was actually wanted — a newer push supersedes an older push on the same ref —
# without letting three unrelated kinds of run compete for one slot.
concurrency:
  # A group holds at most ONE pending run by default: a newly queued run cancels
  # the pending one, whatever cancel-in-progress says (that governs only the
  # running one). Keyed by ref, a merge burst to main cancels its own queued
  # runs and leaves those commits with no status at all. So only a PR's runs
  # share a group, where the newest should win; any other run is keyed by
  # run_id, not sha, which repeat dispatches of one commit share.
  group: rust-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Cheap guards ────────────────────────────────────────────────────────
  guards:
    # ⚠ A job with no timeout burns GitHub's SIX HOUR ceiling when it hangs,
    # and this workflow has done exactly that: `test (macos-latest)` finished
    # BUILDING in ~13 minutes and then sat silent for 5h46m on three
    # `subagent_handler` tests that await `run_complete_subagent_task`
    # unbounded, until the ceiling cancelled it. Same three names on a feature
    # branch and on clean main; not reproducible on a developer's own macOS.
    #
    # These budgets are deliberately well ABOVE the measured maxima (warm
    # cache, 2026-08-27: guards 0.1m, cross-check 8.2m, test 15.0m, serve
    # 9.5m) so a merely slow run is never failed -- they exist to make a HANG
    # cheap and legible, not to police duration. The native test job has its
    # own cold-cache budget below, rather than GitHub's six-hour default.
    # (The `test` job's budget was 40 until 2026-10-18, when its cold runs
    # reached it; that job's comment has the numbers.)
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross recipes have not drifted / glibc floor pin intact
        run: ./scripts/check-no-cross-drift.sh
      - name: Tracked tree names neither the retired upstream nor its publisher
        run: ./scripts/check-no-goose-block.sh
      - name: Version consistency (CLI = daemon = GUI)
        run: ./scripts/check-version-consistency.sh
      # The capability is "Biorouter Copilot" wherever a person reads it -- never
      # its former "Computer Use" or the removed "Computer Controller", never
      # vendor-qualified. The internal `computercontroller` identifier is
      # deliberately exempt; see the script.
      - name: Biorouter Copilot naming consistency
        run: ./scripts/check-computer-use-naming.sh

      # The vendored upstream Open Computer Use source must match its manifest AND
      # be fully committable. Repository-wide .gitignore rules matched 15 of its
      # files when it was first vendored; a tree that verifies locally while
      # those files never reach a fresh clone is worse than one that fails here.
      - name: Vendored Open Computer Use source
        run: ./scripts/check-vendored-computer-use.sh

      # The vendored whisper.cpp subset (the local dictation engine, DD-3) must match
      # its manifest both ways, be committable and exempt from end-of-line conversion,
      # and name a pin that contains the CVE-2026-110810 loader fix. The self test
      # proves the check fails on an edited, missing, extra or gitignored file.
      - name: Vendored whisper.cpp source
        run: |
          ./scripts/check-vendored-whisper-cpp.sh
          ./scripts/check-vendored-whisper-cpp.sh --self-test

      # Dictation fixtures stay within 2.75 MiB in all, 1 MiB per file and 0.75 MiB of
      # audio; real speech models belong in release assets. The self test proves a
      # 1.1 MiB dummy fails.
      - name: Dictation fixture size budget
        run: |
          ./scripts/check-dictation-fixtures.sh
          ./scripts/check-dictation-fixtures.sh --self-test

      # The engine's build prerequisites (DD-10 rules 7, 8, 10 and 11): cmake in the Docker
      # builder, the hermit cmake pin, a Release CMake profile whatever the Cargo profile, no
      # bindgen; and the crate boundaries: no engine in the Crew broker, no capture in the
      # daemon. Read from Cargo.lock, because this job has no Rust toolchain. The self tests of
      # the two Python checks that the nightly and the package smokes run cost milliseconds, so
      # a broken checker shows itself on the pull request instead of the night after.
      - name: Dictation build prerequisites
        run: |
          ./scripts/check-dictation-build-prereqs.sh
          ./scripts/check-dictation-build-prereqs.sh --self-test
          python3 -I scripts/check-windows-imports.py --self-test
          python3 -I scripts/check-dictation-status-json.py --self-test

  # ── 2. Cross COMPILE gate — the BR-70 core. Docker, the SAME images/flags as
  #      scripts/release.sh (both source scripts/cross-env.sh). ubuntu-latest is
  #      just the docker HOST; the TARGET triple is what is being proven.
  cross-check:
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v4

      # Registry + per-triple target dir, persisted across runs. The per-triple
      # target dir is why this is minutes, not a quarter-hour — and it makes the
      # mac/linux build-script clobber (release.sh) structurally impossible here.
      - name: Restore cross cache
        uses: actions/cache@v4
        with:
          path: |
            .cross-cache/registry
            .cross-cache/target/${{ matrix.target }}
          key: cross-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/cross-env.sh') }}
          restore-keys: cross-${{ matrix.target }}-

      - name: cargo check --workspace --all-targets (${{ matrix.target }})
        run: |
          set -euo pipefail
          mkdir -p .cross-cache/registry ".cross-cache/target/${{ matrix.target }}"
          export CROSS_REGISTRY_MOUNT="$PWD/.cross-cache/registry"
          export CROSS_TARGET_MOUNT="$PWD/.cross-cache/target/${{ matrix.target }}"
          . scripts/cross-env.sh
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              cross_linux  "cargo check --workspace --all-targets --locked" /cross-target ;;
            x86_64-pc-windows-gnu)
              cross_windows "cargo check --workspace --all-targets --locked" /cross-target ;;
          esac

      # The socket gate again (the `test` job runs it on ubuntu), for the target
      # where the bug it guards against lives: `cfg(windows)` production code is
      # compiled only here, so a Windows-only tokio bind would pass the ubuntu
      # run. `cross_windows` appends `--target x86_64-pc-windows-gnu`, which the
      # script hands to cargo, and the script adds `--release` itself, so this
      # leg lints exactly what the ubuntu one does, for the other target.
      # rust-toolchain.toml's `default` profile is what puts clippy in the
      # container's toolchain; the image's python3 (3.11+, for tomllib) runs
      # gate.py. `!cancelled()` for the same reason as in the `test` job: a
      # failed `cargo check` above must not hide a site the gate would report.
      - name: No production socket a Windows child process can inherit (${{ matrix.target }})
        if: matrix.target == 'x86_64-pc-windows-gnu' && !cancelled()
        run: |
          set -euo pipefail
          export CROSS_REGISTRY_MOUNT="$PWD/.cross-cache/registry"
          export CROSS_TARGET_MOUNT="$PWD/.cross-cache/target/${{ matrix.target }}"
          . scripts/cross-env.sh
          cross_windows "./scripts/check-non-inheritable-sockets.sh" /cross-target

  # ── 3. Native unit tests on REAL kernels. This is where platform BEHAVIOUR is
  #      proven: PowerShell selection + taskkill (windows), Seatbelt (macos),
  #      Landlock (ubuntu, once BR-69 slice 2 lands — this runner is its venue).
  #      NOTE: windows-latest is MSVC; we SHIP mingw/gnu. Job 2 covers the gnu
  #      ABI, this job covers the Windows behaviour. Both are load-bearing.
  test:
    # ⚠ Sized for a COLD cache, because main's first run after any change to
    # the cache key (a dependency in Cargo.lock, the toolchain, a CARGO_* env)
    # is cold by design, and an evicted cache makes it cold without one. 40
    # was set when this job took 15 minutes warm; the integration-binary step
    # and the socket gate have since doubled that, and the budget stayed. So a
    # cold ubuntu run was a red X with every step green. Measured over the
    # completed runs of 2026-10-10..18, by rust-cache's own restore line:
    #
    #   ubuntu  warm 21.3-31.0m (n=52)   cold 30.5-40.2m (n=10, eight >37;
    #           39156748556 and 39158205693 were cancelled at 40.0 and 40.2
    #           with every step, "Complete job" included, green)
    #   macos   warm 14.3-38.2m (n=60)   cold 20.1-37.6m (n=6)
    #   windows warm 15.5-29.7m (n=54)   cold 21.3-31.6m (n=8), and one cold
    #           run still in `cargo test` when 40 hit (39057096529, main)
    #
    # Main run 41393586499 reached 60 minutes during host Clippy after all
    # tests and the socket gate passed. 90 leaves room for that cold build
    # and cache upload while keeping a hung job bounded.
    timeout-minutes: 90
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe Windows directory reopen and nested-handle move semantics
        if: runner.os == 'Windows'
        timeout-minutes: 1
        shell: pwsh
        run: |
          python scripts/security/windows-directory-lease-probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/security/windows-nested-handle-probe.py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          components: clippy

      # MSVC's test PDBs dominate the Windows link and cache footprint (the
      # biorouter harness alone produced a ~1.1 GiB PDB). This keeps debug
      # assertions, overflow checks and panic locations while omitting debugger
      # symbols that CI never consumes. Set it before rust-cache so the action's
      # CARGO_* environment hash separates these artifacts from debug=2 builds.
      #
      # macOS is included for a different reason: it is the only runner in this
      # matrix with NO Rust cache (see the cache-on-failure note below), so it
      # pays a cold full-workspace build every run and its debug symbols are
      # what would push the repository over GitHub's 10 GiB cache ceiling once
      # it finally saves one.
      #
      # ⚠ Ubuntu was left out while it had a warm 1.7 GiB cache and no problem
      # for this to fix. It has one now: the integration-binary step below
      # links ~117 more executables, and on Linux every one of them EMBEDS the
      # DWARF of everything it links rather than leaving it in a side file.
      # Measured 2026-09-11 (run 34628149105) with debug=2: that build took the
      # runner from 70 GB free to 1.4 GB and died with `No space left on
      # device` before it finished. The variable changes rust-cache's key, so
      # ubuntu builds cold (measured: lib + bins 3.7 -> 7.5 min) until main's
      # first run with it saves the new cache. A one-time price.
      - name: Reduce CI test debuginfo
        shell: bash
        run: echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"

      # ⚠ rust-cache folds EVERY installed toolchain into its key: it runs
      # `rustup toolchain list` and hashes `rustc -vV` of each one. The runner
      # image ships its own `stable`, which nothing here builds with
      # (rust-toolchain.toml pins 1.92), so each image that moves that stable
      # changes every Rust cache key in the repository at once. Measured: image
      # 20260901.588 -> 20261002.596 moved it from 1.98.1 to 1.99.0, the ubuntu
      # key went from `...-15238ee1-c299e55f` to `...-edf29d0d-c299e55f`, and
      # every ubuntu run built cold from 2026-10-10 until main next saved, on
      # 10-12 (37.0-39.2 minutes each). While an image rolls out, runners on
      # the old and new images compute different keys, and main ends up saving
      # both. Removing every toolchain but the pinned one keeps the key on what
      # this build actually compiles with. `serve`, frontend.yml and
      # apps-smoke.yml do the same before their rust-cache steps.
      - name: Keep only the pinned Rust toolchain (stable cache key)
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(rustup show active-toolchain | tr -d '\r' | cut -d' ' -f1)
          [ -n "$pinned" ]
          for t in $(rustup toolchain list | tr -d '\r' | cut -d' ' -f1); do
            if [ "$t" != "$pinned" ]; then rustup toolchain uninstall "$t"; fi
          done
          rustup toolchain list

      # ⚠ `cache-on-failure` is what breaks a self-perpetuating deadlock, not a
      # convenience. rust-cache's post step is skipped whenever the job does not
      # succeed, so a job that cannot finish never saves a cache, is cold on the
      # next run, and therefore cannot finish. That is exactly what happened to
      # `test (macos-latest)`: it was cancelled on main at d0a177f8 after 360
      # minutes with its post step skipped, and `gh cache list` subsequently
      # showed no `v0-rust-macos-latest-*` entry at all while ubuntu and windows
      # both had one. Every macOS run since has compiled the whole workspace
      # from scratch — 56+ minutes against a 20 minute budget, versus 17.8m on
      # the last run that had a warm cache (44ac420f).
      #
      # Compiled dependencies are valid whether or not the *tests* passed, so
      # saving them on a red job costs nothing and means a broken test can never
      # again strand the cache.
      # ⚠ `save-if` restricts SAVING to main, and that is what keeps a cache
      # available to anyone at all. GitHub scopes a cache to the branch that
      # wrote it: a feature branch can read its own caches and **main's**, and
      # nothing else. So every feature-branch run was writing its own private
      # 1-1.7 GiB copy per OS that no other branch could ever use, while the
      # repository sat at 9.74 GiB against a 10 GiB ceiling — evicting main's
      # copies, which are the only ones shared. Measured on windows-latest, by
      # rust-cache's own restore time:
      #
      #   restore 0.7m -> `cargo test`  9.4m   (hit, branch's own earlier cache)
      #   restore 0.1m -> `cargo test` 19.5m   (miss)
      #   restore 0.1m -> `cargo test` 17.4m   (miss)
      #
      # With saving confined to main, every branch restores one authoritative,
      # continuously refreshed cache and none of them compete for the ceiling.
      # A PR that changes Cargo.lock still builds cold and cannot save; that is
      # the accepted cost, and it is much smaller than three OSes' worth of
      # write-only caches evicting the shared ones on every push.
      #
      # ⚠ The rule only works if EVERY cache writer follows it, and until
      # 2026-10-18 this was the only one that did. On 2026-10-18 the release
      # branch's package workflows saved two cross caches (2.6 GB, readable by
      # that branch alone and never read again) at 18:16-18:18, the repository
      # went past 10 GB, and GitHub evicted the least recently used entry: this
      # job's ubuntu cache, last read at 17:39:11, one second before `serve`'s.
      # The next two pushes to main (39156748556, 39158205693) found "No cache
      # found" for an unchanged key and were cancelled at 40 minutes. `serve`,
      # frontend.yml and apps-smoke.yml now save from main only as well, and
      # the two GUI package workflows no longer persist a cache at all (their
      # files say why). Main's own caches come to about 8.3 GB of the 10.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc (build-script dep)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux native build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          # ⚠ Drop the runner image's Microsoft apt repositories FIRST.
          # `packages.microsoft.com` has repeatedly answered 403 for the
          # `azure-cli` and `prod` lists that the hosted image ships
          # preinstalled, and `apt-get update` exits 100 on any repository it
          # cannot refresh — so an outage on a third-party CDN we do not use
          # fails this job with `E: ... is no longer signed`. Nothing here
          # installs from them. Removing them makes the update depend only on
          # the archives the packages below actually come from.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libxcb1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Windows launcher runtime digest (actual PowerShell template)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 2
        run: node scripts/agent-drafter/check-windows-runtime-digest.mjs

      - name: Full export payload (generated launchers and authenticated daemon fixture)
        timeout-minutes: 2
        run: node scripts/agent-drafter/check-export-payload.mjs

      - name: Stage pinned native app compiler
        timeout-minutes: 2
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const { fetchEsbuild, ESBUILD_VERSION } = require('./ui/desktop/scripts/fetch-esbuild.js');
          const compiler = path.resolve(fetchEsbuild(process.platform, process.arch, {
            binDir: path.join(process.env.RUNNER_TEMP, 'biorouter-test-tools'),
            cacheDir: path.join(process.env.RUNNER_TEMP, 'biorouter-esbuild-cache'),
          }));
          const version = execFileSync(compiler, ['--version'], {
            encoding: 'utf8', timeout: 5000, maxBuffer: 64,
          }).trim();
          if (version !== ESBUILD_VERSION) throw new Error('Native esbuild does not match the pinned release');
          fs.appendFileSync(process.env.GITHUB_ENV, `BIOROUTER_ESBUILD_BIN=${compiler}\n`);
          NODE

      # Start narrow (lib + bins on every OS) so the matrix is green on arrival;
      # widen as it proves stable. This selector leaves out `tests/`; those
      # binaries run in their own step below, ubuntu only, with no network.
      # (They were long assumed to need cassettes and credentials the runners
      # lack. Measured, they do not: `mcp_integration_test` REPLAYS its
      # cassettes offline and only records under BIOROUTER_RECORD_MCP, and the
      # tests that need a real provider or vendor CLI are `#[ignore]`d.)
      #
      # ⚠ It does NOT follow that nothing in this step touches the network. The
      # selector filters by TARGET, not by behaviour, and a test that lives in
      # `src/` is a unit test as far as cargo is concerned however far it dials.
      # `biorouter-server/src/tunnel/lapstone_test.rs` did exactly that against a
      # third-party Cloudflare worker, and because `biorouter-server/src/main.rs`
      # re-declares `mod tunnel;` rather than using the library, both `--lib` and
      # `--bins` carried it: 2 tests x 2 targets x 3 platforms, twelve live
      # requests per run, red whenever that worker had a bad day. It is now
      # opt-in behind BIOROUTER_TEST_LAPSTONE_TUNNEL. Gate the test, not the
      # selector, if another one appears.
      # ⚠ `--no-fail-fast` is load-bearing on this matrix, not a nicety. Without
      # it cargo stops at the FIRST test binary that fails, and everything
      # ordered after it never runs. On windows-latest that was `biorouter_mcp`,
      # so `biorouter_sandbox`, `biorouter_server`, `biorouterd` and
      # `biorouter_test` were unreported for a hundred consecutive runs: each
      # batch of Windows fixes made the job fail one binary further along, which
      # read as "a new rotating set of failures" and was really one hidden queue
      # being drained one CI round-trip at a time. One run now names them all.
      # ⚠ **The OS credential store must be off, or macOS hangs until the job
      # is killed.** `Config::read` resolves a secret through `keyring`, and on
      # a runner with no unlocked login keychain `SecKeychainFindGenericPassword`
      # blocks on an authorization prompt nothing is there to answer. The
      # secrets tests in `routes::action_required` sit on that call, so the
      # whole binary stops: `test (macos-latest)` ran SIX HOURS on main
      # (run 32997530845) and was cancelled. Reproduced locally and sampled —
      # `Config::read` -> `keyring::Entry::get_password` ->
      # `SecKeychainFindGenericPassword` -> `CSSM_DecryptData`, blocked. With
      # this set the same binary finishes in seconds.
      #
      # Windows reaches the same code through the Credential Manager. Whether
      # that is what has made windows-latest slow is NOT measured, so this is
      # not offered as the explanation there — it is set on the whole matrix
      # because the store is unwanted on every runner, not as a Windows fix.
      #
      # It costs no coverage: nothing in the workspace asserts keyring
      # behaviour — the store is incidental to these tests, which are about
      # routes. `serve` below and `release-artifact-smoke.yml` already set it
      # for the same reason; this is the one job that was missing it.
      - name: cargo test (Ollama readiness and recovery)
        env:
          BIOROUTER_DISABLE_KEYRING: "true"
        run: cargo test -p biorouter --test ollama_readiness --test ollama_diagnostics_20261006_2 --test ollama_protocols --locked --no-fail-fast -- --test-threads=2

      - name: cargo test (workspace, lib + bins)
        env:
          BIOROUTER_DISABLE_KEYRING: "true"
        run: cargo test --workspace --lib --bins --locked --no-fail-fast --timings

      # Minimum macOS of the backends (dictation plan, DD-11). .cargo/config.toml
      # sets MACOSX_DEPLOYMENT_TARGET=12.0 for every cargo build; without it rustc
      # stamps 11.0 while the `cc` crate compiles C at the SDK's version, and a
      # strong import newer than the Mac makes dyld refuse the whole binary. The
      # self test proves the check fails on a binary built with the variable
      # cleared, and that the config file is what carries it.
      #
      # The binaries checked are the real `biorouterd` and `biorouter`, not the
      # test executables the step above linked for those bin targets. A test
      # executable's entry point is the test runner, so the linker's dead
      # stripping drops every path only `main` reaches, and that path's imports
      # with it: measured on 2026-11-05, the `biorouter` test executable had 148
      # imports and the real binary 434. Engine code that only the real worker
      # entry reaches would vanish the same way, strong imports included.
      #
      # cargo builds a package's bins for its integration tests, inside the unit
      # graph of the step above (the same workspace features, dev-dependencies
      # included, and the same test profile). So asking for one small std-only
      # integration test per package, the two sandbox guards, compiles only the
      # bin targets of those two packages and the two tests again. A plain
      # `cargo build` would resolve
      # features without the dev-dependencies, use the dev profile's debug info,
      # and compile most of the graph a second time. A renamed guard makes cargo
      # fail here ("no test target named"), not pass.
      #
      # They are unstripped, but --require-imports holds either way: the check
      # reads a stripped binary's imports with nm, which is how release.sh's
      # build_mac_backends and verify check the stripped binaries that ship.
      - name: Backends declare macOS 12.0
        if: matrix.os == 'macos-latest' && !cancelled()
        timeout-minutes: 15
        shell: bash
        env:
          BIOROUTER_DISABLE_KEYRING: "true"
        run: |
          set -euo pipefail
          scripts/check-macos-deployment.sh --self-test
          cargo test --workspace --locked --no-run --message-format=json \
            --test every_test_binary_is_sandboxed --test cli_test_binaries_are_sandboxed \
            > "$RUNNER_TEMP/backend-artifacts.jsonl"
          python3 - "$RUNNER_TEMP/backend-artifacts.jsonl" > "$RUNNER_TEMP/backend-executables" <<'PY'
          import json, sys
          found = {}
          with open(sys.argv[1], encoding="utf-8") as artifacts:
              for line in artifacts:
                  try:
                      message = json.loads(line)
                  except ValueError:
                      continue
                  if message.get("reason") != "compiler-artifact" or not message.get("executable"):
                      continue
                  target = message["target"]
                  # The real executable: a bin target built as a program, not as a test.
                  if ("bin" in target["kind"] and target["name"] in ("biorouterd", "biorouter")
                          and not message["profile"]["test"]):
                      found[target["name"]] = message["executable"]
          if set(found) != {"biorouterd", "biorouter"}:
              sys.exit(f"expected the biorouterd and biorouter executables, found {sorted(found)}")
          for name in sorted(found):
              print(found[name])
          PY
          xargs scripts/check-macos-deployment.sh --require-imports < "$RUNNER_TEMP/backend-executables"

      - name: Copilot hostname lookup never creates a Windows child console
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $messages = cargo test -p biorouter --test computer_use_hostname --locked --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifact = $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'computer_use_hostname' -and $_.executable
          } | Select-Object -Last 1
          if (!$artifact) { throw 'Cargo did not produce the hostname regression executable' }
          ./scripts/test-copilot-hostname-windows.ps1 -TestBinary $artifact.executable -OutputDirectory target/copilot-hostname-evidence

      - name: Upload Windows Copilot hostname process trace and screenshots
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-copilot-hostname-evidence
          path: target/copilot-hostname-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: No Windows-unsafe dependency hostname calls
        if: runner.os == 'Windows' && !cancelled()
        run: cargo clippy --workspace --lib --bins --locked -- -D clippy::disallowed_methods

      - name: Upload Windows Cargo timings
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cargo-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: warn
          retention-days: 14

      # The cross-platform-sensitive suites BR-70 exists to prove, run on every
      # OS they apply to. The workspace step above already runs the sandbox,
      # developer shell/background and security unit tests through their library
      # targets. The sandbox integration runs on every OS; Windows also runs
      # bounded_fs to exercise its retained-handle and ACL fixtures natively.
      # Ubuntu runs bounded_fs in the offline integration step below.
      - name: cargo test (sandbox integration)
        run: cargo test -p biorouter-sandbox --test sandbox ${{ matrix.os == 'windows-latest' && '--test bounded_fs' || '' }} --locked --no-fail-fast

      # The dictation engine's offline tests, the real `biorouterd`'s worker roles (PR-09:
      # capture and an unknown role answer 2, and the self test decodes jfk.wav with the
      # vendored fixtures), and the real engine worker under the real supervisor with
      # `biorouter dictation status` (PR-10: frames on real pipes, a killed worker, a
      # refused header, the managed policy). Ubuntu runs the three binaries in the offline
      # integration step below; this is their run on macOS and on the MSVC leg, which is
      # where M-3 is decided (`MSVC_NATIVE` in crates/biorouter-dictation/build.rs).
      # `--workspace` keeps the unit graph of the lib + bins step, so only biorouterd and
      # the three tests are compiled again.
      - name: cargo test (dictation engine, worker roles and supervisor)
        if: matrix.os != 'ubuntu-latest'
        env:
          BIOROUTER_DISABLE_KEYRING: "true"
        run: cargo test --workspace --test dictation_engine_offline --test dictation_worker_role --test dictation_worker --locked --no-fail-fast

      # ── Every other `tests/*.rs` binary, bar a table of exceptions ─────────
      #
      # Until this step no workflow ran them. The lib + bins selector above
      # leaves `tests/` out, and `clippy --all-targets` below only COMPILES
      # them, which says nothing about whether they pass. So the guards
      # CLAUDE.md treats as load-bearing (the privacy master-switch binaries,
      # the keyless-daemon binaries, `privacy_ar15_is_retired`,
      # `every_test_binary_is_sandboxed`) ran only when someone remembered to.
      # The cost is on record: from eb594ded until PR #229,
      # `the_documented_closure_is_the_one_the_code_performs` read the wrong
      # function, and would have stayed green with the AR-15 gate deleted.
      #
      # ⚠ The table is an EXCLUSION list on purpose. An allowlist would rebuild
      # the gap one file at a time: a new binary would run only if its author
      # remembered to add it. This way it runs the day it lands, and one that
      # cannot run hermetically gets a line saying why. A line naming a target
      # that no longer exists fails the step, so the table cannot outlive what
      # it excuses.
      #
      # ⚠ Never add `--ignored` or `--include-ignored`. The live tests (real
      # providers, the vendor CLIs, llama.cpp downloads, GitHub fetches) are
      # `#[ignore]`d inside binaries whose other tests belong here, so the
      # binary stays in and its live tests stay out.
      #
      # ⚠ No network, enforced rather than assumed. The tests run in a network
      # namespace holding nothing but loopback, so a test that dials out fails
      # at once with a connection error instead of passing whenever the third
      # party is up (the lapstone note above is what that looks like).
      # `setpriv` drops back to the runner user once loopback is up: as root,
      # every "permission denied" assertion would pass for the wrong reason.
      # Servers on 127.0.0.1 and ::1 work as usual.
      #
      # The table's second entry is the instructive one. `ui_example_apps`
      # bundles each example with `npx --yes esbuild` when no local esbuild
      # exists, and this job installs none. Offline it does NOT fail: measured,
      # npx sits on the unreachable registry until the bundler's 60 s timeout,
      # then the test passes on the type-stripper fallback without esbuild
      # ever running. That is a minute spent proving nothing, and a pass that
      # turns into a failure the day npm's retries give up before the timeout.
      #
      # Measured 2026-09-11, one binary at a time on hosted runners (scratch
      # runs 34628149105 and 34629544896). ubuntu, inside the namespace: all
      # 119 binaries green, 687 tests passed, 0 failed, 49 ignored. Building
      # them took 135 s on top of the lib + bins build (14.5 GiB of
      # executables, with the debuginfo setting above) and the 117 this step
      # selects spend ~135 s in their tests. macOS was green but for one
      # log-capture test that failed once in ~70 runs. windows-latest fails
      # 31 tests in 9 binaries that had never run there, which is why this is
      # ubuntu only: widening means fixing those first, and `unshare` is
      # Linux-only, so another OS also needs its own way to stay offline.
      - name: cargo test (integration binaries, no network)
        if: matrix.os == 'ubuntu-latest'
        env:
          BIOROUTER_DISABLE_KEYRING: "true"
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          # One line per target, no wrapping: the first word is the name.
          # target          why it does not run in this step
          excluded='
          sandbox           "cargo test (sandbox integration)" above runs it, on every OS
          ollama_readiness   "cargo test (Ollama readiness and recovery)" above runs it, on every OS
          ollama_diagnostics_20261006_2 "cargo test (Ollama readiness and recovery)" above runs it, on every OS
          ollama_protocols   "cargo test (Ollama readiness and recovery)" above runs it, on every OS
          ui_example_apps   needs the npm registry (`npx --yes esbuild`); apps-smoke.yml runs it after `npm ci`
          '
          all=$(cargo metadata --format-version 1 --no-deps --locked \
                  | jq -r '.packages[].targets[] | select(.kind == ["test"]) | .name' | sort)
          # `--test` selects by name across the workspace, so a name two
          # packages share would run (or be excluded) twice over.
          dup=$(uniq -d <<<"$all")
          if [ -n "$dup" ]; then
            echo "::error::two packages have an integration target named: $dup"; exit 1
          fi
          skip=$(awk 'NF { print $1 }' <<<"$excluded" | sort)
          stale=$(comm -13 <(echo "$all") <(echo "$skip"))
          if [ -n "$stale" ]; then
            echo "::error::the exclusion table names targets that no longer exist; delete their lines: $stale"; exit 1
          fi
          awk 'NF { t = $1; $1 = ""; printf "not run here: %s --%s\n", t, $0 }' <<<"$excluded"
          args=()
          for t in $(comm -23 <(echo "$all") <(echo "$skip")); do args+=(--test "$t"); done
          echo "running $(( ${#args[@]} / 2 )) integration binaries"
          # sudo-rs ignores -E. Pass the offline build profile after dropping
          # privileges, or Cargo rebuilds with debuginfo and fills the runner.
          sudo unshare --net -- sh -c \
            'ip link set lo up && exec setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups -- "$@"' sh \
            env HOME="$HOME" PATH="$PATH" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            CARGO_INCREMENTAL=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_NET_OFFLINE=true \
            BIOROUTER_DISABLE_KEYRING=true BIOROUTER_ESBUILD_BIN="$BIOROUTER_ESBUILD_BIN" \
            sh -c '
              set -eu
              printf "offline Cargo: debug=%s incremental=%s offline=%s keyring_disabled=%s\n" \
                "$CARGO_PROFILE_TEST_DEBUG" "$CARGO_INCREMENTAL" "$CARGO_NET_OFFLINE" "$BIOROUTER_DISABLE_KEYRING"
              test "$CARGO_PROFILE_TEST_DEBUG" = 0
              test "$CARGO_INCREMENTAL" = 0
              test "$CARGO_NET_OFFLINE" = true
              test "$BIOROUTER_DISABLE_KEYRING" = true
              test -x "$BIOROUTER_ESBUILD_BIN"
              exec cargo test --workspace --locked --no-fail-fast "$@"
            ' sh "${args[@]}"

      # ⚠ BLOCKING, unlike the clippy step below it. No production code may open
      # a socket a Windows child process inherits (tokio's `TcpListener::bind`
      # and `TcpStream::connect`, the websocket `connect_async` family: see
      # scripts/clippy-non-inheritable/clippy.toml for the list and why). It is
      # clippy's `disallowed_methods`, force-warned so no `#[allow]` hides a
      # site, over `--lib --bins` in the release profile with every other lint
      # allowed, so it neither waits on the warnings below nor touches test code.
      # It checks the dependencies itself, in release and without
      # dev-dependency features, so it shares little with the steps around it
      # (measured on an M-series Mac: 1m48s with no release clippy cache, a few
      # seconds after that; a runner is slower). Exit 1 is a site, 2 a gate that could not run, 3 a rotten
      # configuration; the script's header says more.
      # `!cancelled()`: it runs even when a test step above has failed. Without
      # it a red test skipped the gate, and a PR that broke a test AND added an
      # inheritable socket was told about the test only. A failure here still
      # fails the job: there is no `continue-on-error`.
      # The `cross-check` job runs it again for the Windows target, where
      # `cfg(windows)` code is compiled and this ubuntu run cannot see it.
      - name: No production socket a Windows child process can inherit
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: ./scripts/check-non-inheritable-sockets.sh

      - name: clippy (host, informational until warnings are burned down)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --locked

  # ── 4. Nightly: the FULL cross BUILD. `check` cannot catch link errors
  #      (aws-lc-sys / winpthread) or glibc symbol-version regressions.
  cross-build-nightly:
    timeout-minutes: 120
    # The three jobs above are gated `!= 'schedule'`, so they pick up
    # workflow_dispatch on their own; this one has to name it, or the button
    # would run everything EXCEPT the job it was added for.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build shipped binaries for both cross targets (release command)
        run: |
          set -euo pipefail
          . scripts/cross-env.sh
          cross_linux   "cargo build --release --bin biorouterd --bin biorouter --bin biorouter-crew"
          cross_windows "cargo build --release --bin biorouterd --bin biorouter" "" "$WIN_DLL_STAGE"

      # For windows-native-dictation below: the exes and the runtime DLLs the release stages
      # beside them, exactly as this job's release command built them. Uploaded before the
      # Linux checks that follow, so a red Linux step never hides the Windows result.
      - name: Keep the mingw binaries for the native Windows run
        uses: actions/upload-artifact@v4
        with:
          name: mingw-binaries
          path: |
            target/x86_64-pc-windows-gnu/release/biorouter.exe
            target/x86_64-pc-windows-gnu/release/biorouterd.exe
            target/x86_64-pc-windows-gnu/release/*.dll
          if-no-files-found: error
          retention-days: 3

      - name: Assert the glibc floor (2.31 / bullseye) is not raised
        run: ./scripts/check-glibc-floor.sh

      # `join-by-name` is a default feature of the broker (naming design D17). A broker built
      # without it boots, passes the step below and refuses every join by invitation.
      - name: The Crew broker lets people join by invitation
        run: ./scripts/check-crew-broker-join.sh

      # The glibc floor check covers the libraries the binaries need from libc.
      # This covers the ones they need from everywhere ELSE — today exactly one,
      # libxcb.so.1 — and asserts that the packages we ship name it, so apt/dnf
      # put it on the box before the binary ever runs. See the script's header;
      # the short version is that a new system dependency is invisible to every
      # other gate in this file and surfaces as exit 127 on a user's machine.
      - name: The shipped binaries' runtime deps are declared by the shipped packages
        id: runtime-deps
        run: |
          set -euo pipefail
          ./scripts/check-linux-runtime-deps.sh
          echo "deb_packages=$(./scripts/check-linux-runtime-deps.sh --print-deb-packages)" >> "$GITHUB_OUTPUT"

      # This step used to `docker run` the bare ELF out of target/ in a stock
      # debian:bullseye, and had therefore failed EVERY night since it was
      # written — ~40 consecutive red runs, never once green. The failure was
      # real and reproducible and meant nothing: `biorouter` links libxcb.so.1
      # (arboard's clipboard, xcap's screen capture), the base image ships no
      # X11 libraries at all, so the loader aborted before `main`. It was
      # reporting a catastrophe that no user can reach, because no user runs the
      # naked binary — they install biorouter-cli_*.deb or the .rpm, and those
      # DECLARE libxcb1/libxcb, so the package manager installs it as a matter
      # of course. Measured on a clean debian:bullseye and a clean rockylinux:9:
      # both packages install and both binaries report their version.
      #
      # What the step proves now is the thing that was worth proving all along:
      # that the declared dependency set is SUFFICIENT. It installs exactly the
      # packages the shipped specs name — derived from the ELF by the guard
      # above rather than hardcoded here, so the list cannot go stale in one
      # place while moving in the other — and nothing else. If a future crate
      # adds a system library, the guard above fails first and names the fix; if
      # the declared set were merely incomplete, this boot fails and says so.
      # Both binaries are booted: they ship together and link the same set, and
      # only `biorouter` was ever being checked.
      #
      # bullseye is the floor pin (GLIBC_FLOOR / LINUX_RUST_IMG in
      # scripts/cross-env.sh). Its apt mirrors are what make the install step
      # work; when Debian 11 finally leaves them, this image moves forward
      # together with that pin, not on its own.
      #
      # The dictation self test (DD-12) runs here too: the engine loads the
      # vendored test model and voice detector and decodes jfk.wav, offline, on
      # the oldest glibc we ship to.
      - name: Boot all Linux binaries on the oldest supported distro
        env:
          DEB_PACKAGES: ${{ steps.runtime-deps.outputs.deb_packages }}
        run: |
          set -euo pipefail
          docker run --rm -e DEB_PACKAGES -v "$PWD":/w debian:bullseye sh -euxc '
            apt-get update -q
            apt-get install -y --no-install-recommends $DEB_PACKAGES
            /w/target/x86_64-unknown-linux-gnu/release/biorouter --version
            /w/target/x86_64-unknown-linux-gnu/release/biorouterd --version
            bash /w/scripts/dictation-self-test.sh --fixtures /w/vendor/whisper.cpp/source --expect-backend cpu /w/target/x86_64-unknown-linux-gnu/release/biorouter /w/target/x86_64-unknown-linux-gnu/release/biorouterd
            test -x /w/target/x86_64-unknown-linux-gnu/release/biorouter-crew
            crew_version=$(/w/target/x86_64-unknown-linux-gnu/release/biorouter-crew --version)
            case "$crew_version" in "biorouter-crew "*) ;; *) exit 1 ;; esac
            /w/target/x86_64-unknown-linux-gnu/release/biorouter-crew --help
          '

      # The engine's ggml code is compiled for x86-64-v3 (AVX2, FMA, F16C, BMI2). On a
      # processor without them, both binaries must still start, and the dictation self test
      # must answer exit 20 with the MSG-CPU sentence instead of dying on SIGILL. A compiler
      # that vectorizes a static initializer would break `--version` for every user of such a
      # processor, before any check of ours runs. The self test first proves each step can
      # fail. The last step reads `biorouter dictation status --format json` under the old
      # processor: `unsupported_cpu`, with `avx2` among the missing features.
      - name: Old processors get a sentence, not a crash (DD-12)
        run: |
          set -euo pipefail
          ./scripts/check-dictation-isa.sh --self-test
          ./scripts/check-dictation-isa.sh

      # whisper.cpp is C++. A mingw link that takes libstdc++, libgcc, winpthreads or OpenMP
      # as a DLL starts here and fails on a user's machine with a loader dialog (DD-10 rules
      # 3 to 5). Measured on the shipped v1.94.1 binaries, built without the engine: both
      # import only system DLLs, so the script carries no allowance.
      - name: Windows binaries import only system DLLs
        run: |
          set -euo pipefail
          python3 -I scripts/check-windows-imports.py --self-test
          python3 -I scripts/check-windows-imports.py target/x86_64-pc-windows-gnu/release/biorouter.exe target/x86_64-pc-windows-gnu/release/biorouterd.exe

      # P-10: the terminal's microphone code is a crate only biorouter-cli depends on, but the
      # release command above builds both binaries in one Cargo invocation, which unifies
      # features across them. So the daemon is checked as that command built it: no
      # PulseAudio library name in its bytes, the hidden capture role refused with exit 2 on
      # the oldest supported distro, and no capture crate in its dependency tree. The CLI must
      # carry capture, loaded at run time: the names are in it and DT_NEEDED holds no sound
      # library (DD-73). release.sh verify runs the same checks on the release's own build.
      - name: Capture is absent from the daemon (P-10)
        env:
          DEB_PACKAGES: ${{ steps.runtime-deps.outputs.deb_packages }}
        run: |
          set -euo pipefail
          linux=target/x86_64-unknown-linux-gnu/release
          for daemon in "$linux/biorouterd" target/x86_64-pc-windows-gnu/release/biorouterd.exe; do
            count=$(strings -a "$daemon" | grep -c libpulse || true)
            if [ "$count" != 0 ]; then
              echo "$daemon names libpulse $count times: capture code reached the daemon"
              exit 1
            fi
          done
          strings -a "$linux/biorouter" | grep -q 'libpulse.so.0' \
            || { echo "biorouter carries no capture code"; exit 1; }
          for bin in biorouter biorouterd; do
            if readelf -d "$linux/$bin" | grep -E 'NEEDED.*(libasound|libpulse)'; then
              echo "$bin links a sound library at load time"
              exit 1
            fi
          done
          code=$(docker run --rm -e DEB_PACKAGES -v "$PWD":/w debian:bullseye sh -c '
            apt-get update -q >/dev/null
            apt-get install -y --no-install-recommends $DEB_PACKAGES >/dev/null
            /w/target/x86_64-unknown-linux-gnu/release/biorouterd __br-dictation-worker capture </dev/null >/dev/null 2>&1
            echo $?' | tail -1)
          if [ "$code" != 2 ]; then
            echo "biorouterd __br-dictation-worker capture exited $code, expected 2"
            exit 1
          fi
          tree=$(cargo tree --locked -p biorouter-server --features local-dictation -e normal,build --prefix none --color never)
          grep -q '^biorouter-dictation ' <<< "$tree" \
            || { echo "cargo tree listed no biorouter-dictation, so the check read nothing"; exit 1; }
          if grep -q '^biorouter-dictation-capture ' <<< "$tree"; then
            echo "biorouter-server depends on biorouter-dictation-capture"
            exit 1
          fi

  # The shipped mingw binaries run the dictation self test on real Windows (M-1), with the
  # fixtures in a folder whose path is not ASCII. whisper.cpp turns UTF-8 paths into UTF-16
  # only under MSVC, so a mingw build that handed it a path would fail here; Biorouter opens
  # the files itself. The folder name is built from a code point so this file stays ASCII.
  # The real model run of M-1 (installed under such a folder, then `transcribe jfk.wav`)
  # joined with PR-12; it is the job's last step.
  #
  # `!cancelled()`: it runs whenever the artifact exists, even when a Linux check of
  # cross-build-nightly failed after the upload. When the build itself failed there is no
  # artifact, and the download step fails on its own.
  windows-native-dictation:
    needs: cross-build-nightly
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mingw-binaries
          path: mingw-binaries
      - name: Self test of the mingw biorouter.exe and biorouterd.exe from a folder whose path is not ASCII
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'vendor\whisper.cpp\source'
          $folder = Join-Path $env:RUNNER_TEMP ('dictation-Jos' + [char]0x00E9)
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $model = Join-Path $folder 'for-tests-ggml-base.en.bin'
          $vad = Join-Path $folder 'for-tests-silero-v6.2.0-ggml.bin'
          $wav = Join-Path $folder 'jfk.wav'
          Copy-Item -LiteralPath (Join-Path $source 'models\for-tests-ggml-base.en.bin') -Destination $model
          Copy-Item -LiteralPath (Join-Path $source 'models\for-tests-silero-v6.2.0-ggml.bin') -Destination $vad
          Copy-Item -LiteralPath (Join-Path $source 'samples\jfk.wav') -Destination $wav
          Write-Host "fixtures in $folder"
          foreach ($name in @('biorouter.exe', 'biorouterd.exe')) {
            $exe = Join-Path $env:GITHUB_WORKSPACE "mingw-binaries\$name"
            $errFile = Join-Path $env:RUNNER_TEMP "$name.self-test.err"
            $out = @(& $exe __br-dictation-worker self-test --model $model --vad $vad --wav $wav 2> $errFile)
            $code = $LASTEXITCODE
            $lines = @($out | ForEach-Object { "$_".TrimEnd("`r") } | Where-Object { $_ -ne '' })
            if ($code -ne 0 -or $lines.Count -ne 1 -or -not $lines[0].Contains('"selftest":"ok"') -or -not $lines[0].Contains('"backend":"cpu"')) {
              Get-Content -LiteralPath $errFile -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
              throw "$name dictation self test failed: exit $code, stdout: $($lines -join ' | ')"
            }
            Write-Host "${name}: $($lines[0])"
          }
          # The daemon never captures audio (P-10): the capture role answers 2 in biorouterd.
          $daemon = Join-Path $env:GITHUB_WORKSPACE 'mingw-binaries\biorouterd.exe'
          & $daemon __br-dictation-worker capture
          if ($LASTEXITCODE -ne 2) {
            throw "biorouterd.exe __br-dictation-worker capture exited $LASTEXITCODE, expected 2"
          }
          Write-Host 'biorouterd.exe answers the capture role with exit 2'
          exit 0

      # PR-10 on real Windows: `biorouter dictation status --verbose` starts the engine
      # worker over its pipes (frames on stdout, the tokio spawner, the peak working set
      # through K32GetProcessMemoryInfo) and reads its hello. Schema 1, no model; the probe
      # worker says protocol 1 and exits 0 at end of file. From PR-25 the terminal's
      # microphone comes from the capture child's probe, which a hosted runner answers
      # honestly with no microphone: `no_device` from WASAPI with no input, or
      # `no_audio_system` when the audio service does not answer; `dictation devices
      # --format json` must give the same answer.
      - name: dictation status --verbose of the mingw biorouter.exe
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'dictation-status-root'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:BIOROUTER_PATH_ROOT = $root
          $env:BIOROUTER_DISABLE_KEYRING = 'true'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'mingw-binaries\biorouter.exe'
          $file = Join-Path $env:RUNNER_TEMP 'dictation-status.json'
          $errFile = Join-Path $env:RUNNER_TEMP 'dictation-status.err'
          $out = @(& $cli dictation status --format json --verbose 2> $errFile)
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content -LiteralPath $errFile -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            throw "biorouter.exe dictation status --format json --verbose exited $code"
          }
          [System.IO.File]::WriteAllText($file, ($out -join "`n"))
          python -I scripts/check-dictation-status-json.py --expect-no-models $file
          if ($LASTEXITCODE -ne 0) { throw 'the dictation status of biorouter.exe is not schema 1' }
          $status = Get-Content -Raw -LiteralPath $file | ConvertFrom-Json
          if ($status.probe.hello.protocol -ne 1 -or $status.probe.exit_code -ne 0) {
            throw "the probe worker did not say hello with protocol 1 and exit 0: $($status.probe | ConvertTo-Json -Compress -Depth 4)"
          }
          if ($status.capture.available -ne $false -or @('no_device', 'no_audio_system') -notcontains $status.capture.reason) {
            throw "a hosted runner has no microphone, but the capture probe answered $($status.capture | ConvertTo-Json -Compress)"
          }
          $devicesOut = @(& $cli dictation devices --format json 2> $errFile)
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $errFile -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            throw "biorouter.exe dictation devices --format json exited $LASTEXITCODE"
          }
          $devices = ($devicesOut -join "`n") | ConvertFrom-Json
          if ($devices.schema -ne 1 -or $devices.available -ne $false -or $devices.reason -ne $status.capture.reason) {
            throw "dictation devices disagrees with the status: $($devices | ConvertTo-Json -Compress)"
          }
          Write-Host "biorouter.exe capture probe: $($status.capture.reason) ($($status.capture.backend))"
          Write-Host "biorouter.exe dictation status: engine $($status.engine.state), worker hello protocol $($status.probe.hello.protocol), exit $($status.probe.exit_code)"

      # M-1's real model run (PR-12, DD-94: `transcribe`'s gate lands with it). The shipped
      # installer puts `whisper-small.en-q8_0` and its voice detector, from A-1's releases,
      # under a BIOROUTER_PATH_ROOT whose path is not ASCII, and `transcribe jfk.wav` must
      # give the JFK sentence, case and punctuation aside. The engine opens the model, and
      # the detector by its bare name inside its folder, under that path; this is the one
      # check of that on real Windows. The downloaded files are cached in an ASCII folder
      # by the catalog's pins and installed from there with `--from` on a hit, so most runs
      # download nothing and every run still goes through the installer's verification.
      - name: Restore the Light model and its voice detector
        id: m1-models
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\m1-models
          key: dictation-m1-windows-small-en-${{ hashFiles('crates/biorouter-dictation/src/catalog.rs') }}
      - name: transcribe jfk.wav with the real Light model under a path that is not ASCII
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.m1-models.outputs.cache-hit }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('dictation-Jos' + [char]0x00E9 + '-m1')
          $cache = Join-Path $env:RUNNER_TEMP 'm1-models'
          New-Item -ItemType Directory -Force -Path $root, $cache | Out-Null
          $env:BIOROUTER_PATH_ROOT = $root
          $env:BIOROUTER_DISABLE_KEYRING = 'true'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'mingw-binaries\biorouter.exe'
          $errFile = Join-Path $env:RUNNER_TEMP 'm1.err'
          if ($env:CACHE_HIT -eq 'true') {
            & $cli dictation install --yes --from $cache 2> $errFile
          } else {
            & $cli dictation install --yes whisper-small.en-q8_0 2> $errFile
          }
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $errFile -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            throw "biorouter.exe dictation install exited $LASTEXITCODE"
          }
          if ($env:CACHE_HIT -ne 'true') {
            Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.bin' | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $cache
            }
          }
          $jfk = Join-Path $env:GITHUB_WORKSPACE 'vendor\whisper.cpp\source\samples\jfk.wav'
          $out = @(& $cli transcribe $jfk --model whisper-small.en-q8_0 --format json 2> $errFile)
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content -LiteralPath $errFile -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            throw "biorouter.exe transcribe exited $code, stdout: $($out -join ' ')"
          }
          $transcript = ($out -join "`n") | ConvertFrom-Json
          $words = { param($text) (($text.ToLowerInvariant() -split '[^a-z0-9]+') | Where-Object { $_ -ne '' }) -join ' ' }
          $expected = & $words 'And so my fellow Americans, ask not what your country can do for you, ask what you can do for your country.'
          $got = & $words $transcript.text
          if ($got -ne $expected) {
            throw "transcribe gave '$($transcript.text)', not the JFK sentence"
          }
          Write-Host "biorouter.exe transcribe under $root on $($transcript.timings.backend): $($transcript.text)"
          Write-Host "timings: $($transcript.timings | ConvertTo-Json -Compress)"
      - name: Save the Light model and its voice detector
        if: success() && steps.m1-models.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\m1-models
          key: dictation-m1-windows-small-en-${{ hashFiles('crates/biorouter-dictation/src/catalog.rs') }}

  # `biorouter serve` end to end: the daemon serving the interface, the token
  # exchange, and the endpoints that were previously unauthenticated.
  #
  # Before this job there was NO CI coverage of browser mode at all -- `grep -rn
  # headless .github/` returned nothing while a tarball of it was a shipped
  # release asset. The one smoke test that existed asserted the served page
  # contained "<!doctype html>", which is true of a completely non-functional
  # app.
  #
  # It cannot drive a real agent turn: there are no provider credentials here,
  # and a browser session may not set a provider by design (decision SD-1 in
  # docs/deployment/serve-decisions.md). What it does assert is everything
  # between the browser and that boundary.
  serve:
    # Was 30 against a measured 9.5m. The lifecycle step below builds
    # biorouter-cli's tests, which unify its dev-dependency features and so
    # recompile part of the graph a plain `cargo build` already built (4m56s on
    # a loaded M4 Max); the budget keeps the same margin over that.
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      # Same as the `test` job: the image's own toolchain must not reach the
      # cache key.
      - name: Keep only the pinned Rust toolchain (stable cache key)
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(rustup show active-toolchain | tr -d '\r' | cut -d' ' -f1)
          [ -n "$pinned" ]
          for t in $(rustup toolchain list | tr -d '\r' | cut -d' ' -f1); do
            if [ "$t" != "$pinned" ]; then rustup toolchain uninstall "$t"; fi
          done
          rustup toolchain list
      # Saves from main only, like `test` and for the reason given there. When
      # main's copy was evicted (2026-10-11/12), every PR's first run here
      # wrote its own 1.9 GB copy that no other branch could read, which
      # pushed the repository further past the ceiling.
      - uses: Swatinem/rust-cache@v2
        with:
          key: serve
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install protoc (build-script dep)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux native build dependencies
        run: |
          # ⚠ Drop the runner image's Microsoft apt repositories FIRST.
          # `packages.microsoft.com` has repeatedly answered 403 for the
          # `azure-cli` and `prod` lists that the hosted image ships
          # preinstalled, and `apt-get update` exits 100 on any repository it
          # cannot refresh — so an outage on a third-party CDN we do not use
          # fails this job with `E: ... is no longer signed`. Nothing here
          # installs from them. Removing them makes the update depend only on
          # the archives the packages below actually come from.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libxdo-dev liblzma-dev pulseaudio pulseaudio-utils

      - name: Build the interface bundle
        working-directory: ui/desktop
        run: |
          npm ci
          npm run build:web
          # A RELATIVE base (issue #402): the daemon names the interface's mount
          # in a <base href> it writes into the shell, so one bundle works at the
          # root of a hostname and under a reverse proxy's path prefix. A
          # root-base bundle asks for /assets/... at the proxy's root and never
          # mounts there.
          grep -q 'src="./assets/' src/web/index.html
          ! grep -q 'src="/assets/' src/web/index.html
          worklet=$(find src/web/assets -maxdepth 1 -type f -name '*pcmCapture*.js' -print -quit)
          [ -n "$worklet" ] || { echo 'the PCM capture worklet was inlined or omitted'; exit 1; }
          worklet_ref=0
          for chunk in src/web/assets/*.js; do
            [ "$chunk" = "$worklet" ] && continue
            if grep -qF "$(basename "$worklet")" "$chunk"; then worklet_ref=1; break; fi
          done
          [ "$worklet_ref" = 1 ] \
            || { echo 'the web bundle does not reference the PCM capture worklet file'; exit 1; }

      - name: Install Playwright browsers for served dictation
        working-directory: ui/desktop
        run: npx playwright install --with-deps chromium firefox

      - name: Build the command and the daemon
        run: cargo build -p biorouter-cli -p biorouter-server

      - name: Serve, and check the whole browser contract
        run: |
          set -euo pipefail
          export BIOROUTER_PATH_ROOT="$RUNNER_TEMP/serve-root"
          export BIOROUTER_DISABLE_KEYRING=true
          mkdir -p "$BIOROUTER_PATH_ROOT"
          ./target/debug/biorouter serve \
            --port 18777 --token citoken \
            --web-dir "$PWD/ui/desktop/src/web" > "$RUNNER_TEMP/serve.log" 2>&1 &
          serve_pid=$!
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null "http://127.0.0.1:18777/?t=citoken" && break
            sleep 1
          done

          fail() { echo "FAILED: $1"; echo '--- serve log ---'; cat "$RUNNER_TEMP/serve.log"; exit 1; }

          # The document carries the daemon secret, so it is gated.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18777/)" = 401 ] \
            || fail 'the shell was served without a credential'
          [ "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18777/?t=wrong')" = 401 ] \
            || fail 'a wrong token was accepted'

          # The token is exchanged for a cookie and leaves the address bar. It is
          # not consumed (SD-9 in docs/deployment/serve-decisions.md): the
          # readiness loop above has already redeemed it. The answer is a page of
          # the daemon's own origin that moves on to /, not a 303: a redirect
          # drops a SameSite=Strict cookie on a navigation that `serve --open`'s
          # file: page started (routes::web_ui::exchange_bounce).
          curl -s -o "$RUNNER_TEMP/bounce.html" -D "$RUNNER_TEMP/h" "http://127.0.0.1:18777/?t=citoken"
          grep -qi '^HTTP/1.1 200' "$RUNNER_TEMP/h" || fail 'the token exchange did not answer its page'
          grep -qi 'set-cookie: biorouter_session=' "$RUNNER_TEMP/h" || fail 'no session cookie'
          grep -qi 'HttpOnly' "$RUNNER_TEMP/h" || fail 'the session cookie is readable from script'
          grep -qi 'SameSite=Strict' "$RUNNER_TEMP/h" || fail 'the session cookie is sent cross-site'
          grep -qi 'cache-control: no-store' "$RUNNER_TEMP/h" || fail 'the exchange page is cacheable'
          grep -qi 'referrer-policy: no-referrer' "$RUNNER_TEMP/h" || fail 'the exchange page leaks its address'
          grep -q 'http-equiv="refresh" content="0;url=./"' "$RUNNER_TEMP/bounce.html" \
            || fail 'the exchange page does not move on to the interface'
          ! grep -q citoken "$RUNNER_TEMP/bounce.html" || fail 'the exchange page carries the token'

          # With the cookie, the shell and its runtime configuration.
          curl -fsS -b 'biorouter_session=citoken' http://127.0.0.1:18777/ > "$RUNNER_TEMP/shell.html"
          grep -q '__BIOROUTER_HEADLESS_CONFIG__' "$RUNNER_TEMP/shell.html" || fail 'no runtime config'
          grep -qE '"secretKey":"[0-9a-f]{64}"' "$RUNNER_TEMP/shell.html" || fail 'no daemon secret'
          # ABSENT, not empty: empty is falsy in the renderer and sends the
          # browser to a hardcoded 127.0.0.1:3000.
          ! grep -q 'apiBaseUrl' "$RUNNER_TEMP/shell.html" \
            || fail 'apiBaseUrl is present; the renderer will not use its own origin'
          grep -q 'no-store' <(curl -s -D - -o /dev/null -b 'biorouter_session=citoken' http://127.0.0.1:18777/) \
            || fail 'the shell is cacheable and it carries the secret'
          # The shell names its mount, relative to where the request landed, so
          # the relative bundle resolves under a proxy's path prefix and on a
          # path that fell through to the shell alike.
          grep -q '<head><base href="./">' "$RUNNER_TEMP/shell.html" || fail 'the shell names no mount'
          # To a file first: under pipefail, `grep -q` exiting early can kill
          # curl mid-write and fail the step at random.
          curl -fsS -b 'biorouter_session=citoken' -o "$RUNNER_TEMP/deep.html" http://127.0.0.1:18777/a/b/c \
            || fail 'a deep path did not answer'
          grep -q '<base href="../../">' "$RUNNER_TEMP/deep.html" || fail 'a deep path does not lead back to the mount'

          # Behind an HTTPS reverse proxy (issue #402). The browser's Fetch
          # Metadata is what says the page is at a secure address; the scheme a
          # proxy chain reports is not asked, because JupyterHub's chain reports
          # `https,http`. Without the metadata, a network address is refused.
          nav=(-H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document')
          for proto in https 'https,http' http; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -b 'biorouter_session=citoken' "${nav[@]}" \
                -H 'Host: hub.example.org' -H "X-Forwarded-Proto: $proto" http://127.0.0.1:18777/)" = 200 ] \
              || fail "a proxied navigation with X-Forwarded-Proto: $proto was refused"
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b 'biorouter_session=citoken' \
              -H 'Host: 192.168.1.5:18777' -H 'X-Forwarded-Proto: https' http://127.0.0.1:18777/)" = 403 ] \
            || fail 'a network address without Fetch Metadata was served the shell'

          # The bundle is really served.
          asset=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' "$RUNNER_TEMP/shell.html" | head -1)
          [ -n "$asset" ] || fail 'no bundle reference in the shell'
          curl -fsS -o /dev/null "http://127.0.0.1:18777$asset" || fail 'the bundle is not served'

          # The interface's own endpoints are behind the daemon's auth now. They
          # had none at all before.
          secret=$(grep -o '"secretKey":"[0-9a-f]*"' "$RUNNER_TEMP/shell.html" | cut -d'"' -f4)
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18777/headless/health)" = 401 ] \
            || fail 'an interface endpoint answered without the secret'
          curl -fsS -H "X-Secret-Key: $secret" http://127.0.0.1:18777/headless/health \
            | grep -q '"status":"ok"' || fail 'the interface endpoint did not answer with the secret'

          # And a path traversal is refused, which the retired implementation
          # allowed outright: fs_read had no validation of any kind.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Secret-Key: $secret" \
              'http://127.0.0.1:18777/headless/fs/read?path=/etc/passwd')" = 403 ] \
            || fail 'the filesystem endpoint read outside its allowed roots'

          # Stopping serve by pid stops its daemon. It used to leave the daemon
          # running, still holding this port and still honouring the token.
          # `serve` reaps the daemon before it exits, so the port is closed the
          # moment `wait` returns.
          kill "$serve_pid" || fail 'serve was no longer running'
          wait "$serve_pid" || true
          ! curl -s -o /dev/null --max-time 5 http://127.0.0.1:18777/status \
            || fail 'the daemon outlived serve'
          echo 'the browser contract holds'

      - name: Served microphone and dictation in Chromium and Firefox
        working-directory: ui/desktop
        env:
          BIOROUTER_SERVE_BIN: ${{ github.workspace }}/target/debug/biorouter
          BIOROUTER_PW_CHANNEL: chromium
        run: |
          set -euo pipefail
          pulse_pid=
          pulse_start=
          pulse_start_of() {
            [ -r "/proc/$1/stat" ] || return 1
            sed 's/^.*) //' "/proc/$1/stat" | awk '{print $20}'
          }
          stop_owned_pulse() {
            if [ -n "$pulse_pid" ] &&
               [ "$(pulse_start_of "$pulse_pid" 2>/dev/null || true)" = "$pulse_start" ] &&
               [ "$(cat "/proc/$pulse_pid/comm" 2>/dev/null || true)" = pulseaudio ]; then
              kill -TERM "$pulse_pid" 2>/dev/null || true
              wait "$pulse_pid" || true
            fi
          }
          trap stop_owned_pulse EXIT
          if ! pactl info >/dev/null 2>&1; then
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/serve-pulse-runtime"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            pulseaudio --daemonize=no --exit-idle-time=-1 > "$RUNNER_TEMP/serve-pulse.log" 2>&1 &
            pulse_pid=$!
            pulse_start="$(pulse_start_of "$pulse_pid")"
            [ -n "$pulse_start" ] || { echo 'FAILED: Firefox audio server process not recorded'; exit 1; }
            printf '%s %s\n' "$pulse_pid" "$pulse_start" > "$RUNNER_TEMP/serve-pulse-owned.pid"
            for _ in $(seq 1 50); do
              if pactl info >/dev/null 2>&1; then break; fi
              if ! kill -0 "$pulse_pid" 2>/dev/null; then break; fi
              sleep 0.2
            done
            pactl info >/dev/null 2>&1 || { echo 'FAILED: Firefox audio server unavailable'; exit 1; }
          fi
          npx playwright test tests/e2e/serve-app-microphone.spec.ts tests/e2e/serve-dictation.spec.ts --reporter=list

      # SIGTERM and SIGINT to `serve`, and SIGKILL, which leaves only the
      # daemon's own parent watch to stop it. Here rather than in the workspace
      # test job, which runs `--lib --bins` only: this needs a `biorouterd` from
      # the same tree beside `biorouter`, which the build step above provides.
      - name: Stopping serve stops its daemon
        env:
          BIOROUTER_DISABLE_KEYRING: "true"
        run: cargo test -p biorouter-cli --test serve_lifecycle
