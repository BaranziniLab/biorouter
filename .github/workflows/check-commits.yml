name: Check Commit Messages

# Pushes to main and pull requests. A push to a pull request's branch also
# fires `pull_request`, which reports the same `no-ai-coauthor` check on the
# same commit, so a `push` run there was a second runner slot for one answer
# (until 2026-11-13 this listened to pushes on every branch).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-ai-coauthor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI co-author trailers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.event.after }}
          fi

          # Fall back to last commit if before is the null SHA (first push)
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="${HEAD}^"
          fi

          HITS=$(git log "$BASE".."$HEAD" --format="%B" | \
            grep -iE "^Co-Authored-By:.*(anthropic|claude|openai|chatgpt|gemini|copilot)" || true)

          if [ -n "$HITS" ]; then
            echo "::error::AI co-author trailer found in one or more commits:"
            echo "$HITS"
            exit 1
          fi

          echo "OK — no AI co-author trailers found."
