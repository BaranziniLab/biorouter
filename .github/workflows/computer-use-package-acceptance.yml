name: Biorouter Copilot installed packages
# Release-format candidates on every platform, installed, with the installed
# engine's manifest, identity, version and readiness probe checked without any
# capture (AD-21 in docs/design/copilot-agent-desktop.md). It builds full
# packages, so it runs on dispatch, as a release gate, not on every pull request.
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: computer-use-packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  BIOROUTER_BUILD_JOBS: '2'
  CARGO_BUILD_JOBS: '2'
jobs:
  cross:
    name: Production GNU build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cross-cache/registry
            .cross-cache/target/${{ matrix.target }}
          key: cross-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/cross-env.sh') }}
          restore-keys: cross-${{ matrix.target }}-
      - run: bash scripts/build-computer-use-package-cross.sh ${{ matrix.target }}
      # Biorouter Copilot's engine for the same platform, in the pinned bullseye
      # container; the Windows runner below cannot run it, so both platforms take
      # the payload as an artifact and only verify it.
      - name: Build the Biorouter Copilot helper payload
        env:
          CROSS_REGISTRY_MOUNT: ${{ github.workspace }}/.cross-cache/copilot-registry
        run: bash scripts/build-computer-use-helper-cross.sh ${{ matrix.target == 'x86_64-pc-windows-gnu' && 'win32-x64' || 'linux-x64' }}
      - name: Restore runner ownership of Docker build caches
        if: always()
        run: |
          if [ -d .cross-cache ]; then
            sudo chown -R "$(id -u):$(id -g)" .cross-cache
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-backends-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-copilot-helper-${{ matrix.target }}
          path: target/computer-use/${{ matrix.target == 'x86_64-pc-windows-gnu' && 'win32-x64' || 'linux-x64' }}/
          if-no-files-found: error
          retention-days: 7
  packages:
    name: Install packages (${{ matrix.target }})
    needs: cross
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - target: win32-x64
            runner: windows-latest
            triple: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.triple != ''
        with:
          name: package-backends-${{ matrix.triple }}
          path: target/${{ matrix.triple }}/release/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.triple != ''
        with:
          name: package-copilot-helper-${{ matrix.triple }}
          path: target/computer-use/${{ matrix.target }}/
      - name: Restore Unix executable modes after Actions artifact download
        if: runner.os == 'Linux'
        run: |
          chmod +x target/${{ matrix.triple }}/release/biorouter target/${{ matrix.triple }}/release/biorouterd
          chmod +x target/computer-use/${{ matrix.target }}/agent-desktop
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Linux package maker and extraction tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libarchive-tools
      - name: Test installed readiness assertions
        run: python scripts/test-installed-computer-use.py
      - name: Build genuine candidate packages
        run: python scripts/computer-use-package-acceptance.py build ${{ matrix.target }}
      - name: Verify archives and installed runtimes
        timeout-minutes: 35
        run: python scripts/computer-use-package-acceptance.py verify ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: installed-packages-${{ matrix.target }}
          path: target/package-acceptance/
          if-no-files-found: error
          retention-days: 7
  package-gate:
    if: always()
    needs:
      - cross
      - packages
      - mac-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all nine release-format candidates and installed checks
        env:
          CROSS: ${{ needs.cross.result }}
          PACKAGES: ${{ needs.packages.result }}
          MAC: ${{ needs.mac-packages.result }}
        run: test "$CROSS" = success && test "$PACKAGES" = success && test "$MAC" = success
  mac-packages:
    name: Install packages (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.92'
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-release-${{ matrix.target }}
          cache-on-failure: true
      - name: Test installed readiness assertions
        run: python scripts/test-installed-computer-use.py
      - name: Build genuine candidate packages
        run: python scripts/computer-use-package-acceptance.py build ${{ matrix.target }}
      - name: Verify archives and installed runtimes
        timeout-minutes: 35
        run: python scripts/computer-use-package-acceptance.py verify ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: installed-packages-${{ matrix.target }}
          path: target/package-acceptance/
          if-no-files-found: error
          retention-days: 7
