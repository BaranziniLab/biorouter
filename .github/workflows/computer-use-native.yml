name: Biorouter Copilot native payloads

# Builds Biorouter Copilot's engine (agent-desktop, vendored at vendor/agent-desktop)
# for every target on the OS that builds it, verifies each payload's bytes and
# identity, and runs the contract smoke: the binary reports the pinned release and
# refuses a bare reference before delivering anything, with no desktop access
# (AD-03, AD-05, AD-06 and AD-21 in docs/design/copilot-agent-desktop.md).
#
# The macOS payloads build on macOS runners (the Objective-C bridges need the
# Xcode tools). The Linux and Windows payloads build in the pinned
# rust:1.92-bullseye container through scripts/build-computer-use-helper-cross.sh,
# the same recipe the release and the package workflows use; the Windows payload
# is then checked on a Windows runner. GUI behaviour (the fixture apps driven
# through Copilot's tools, drag included) runs in the fixture jobs, not here.

on:
  pull_request:
    paths:
      - "vendor/agent-desktop/**"
      - "crates/biorouter-mcp/src/computer_use/**"
      - "crates/biorouter-mcp/src/computercontroller/**"
      - "Dockerfile"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "scripts/*computer-use*"
      - "scripts/cross-env.sh"
      - "scripts/check-macos-deployment.sh"
      - "ui/desktop/scripts/computer-use-resources.js"
      - "ui/desktop/scripts/prepare-platform-binaries.js"
      - "ui/desktop/forge.config.ts"
      - "packaging/biorouter-cli.yaml"
      - ".github/workflows/computer-use-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build ${{ matrix.target }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    env:
      BIOROUTER_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - name: Vendored engine source matches its manifest
        run: ./scripts/check-vendored-computer-use.sh
      - name: Build the engine payload (ad hoc signed)
        run: python scripts/computer-use-runtime.py build ${{ matrix.target }}
      - name: Verify payload bytes, bundle identity and signature
        run: python scripts/computer-use-runtime.py verify ${{ matrix.target }}
      - name: Pinned minimum macOS and no newer strong import
        run: |
          floor=$(python -I -c 'import json; print(json.load(open("vendor/agent-desktop/pin.json"))["minimum_macos"])')
          bundle=$(python -I -c 'import json; print(json.load(open("vendor/agent-desktop/pin.json"))["macos_bundle"])')
          ./scripts/check-macos-deployment.sh --floor "$floor" --require-imports \
            "target/computer-use/${{ matrix.target }}/$bundle/Contents/MacOS/agent-desktop"
      - name: Contract smoke (no desktop access)
        run: python scripts/computer-use-runtime.py contract ${{ matrix.target }}
      - name: Packaging regression tests
        run: python scripts/test-computer-use-packaging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-use-${{ matrix.target }}
          path: target/computer-use/${{ matrix.target }}/
          if-no-files-found: error

  container:
    name: Build ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          # Built and checked although no desktop package ships it: the CLI
          # Docker image does, and it keeps the arm64 adapter compiling.
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      BIOROUTER_BUILD_JOBS: "3"
      CROSS_REGISTRY_MOUNT: ${{ github.workspace }}/.cross-cache/copilot-registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: .cross-cache/copilot-registry
          key: copilot-registry-${{ hashFiles('vendor/agent-desktop/source/Cargo.lock') }}
          restore-keys: copilot-registry-
      - name: Vendored engine source matches its manifest
        run: ./scripts/check-vendored-computer-use.sh
      - name: Build in the pinned rust:1.92-bullseye container
        run: bash scripts/build-computer-use-helper-cross.sh ${{ matrix.target }}
      - name: Take ownership of the container-written cache
        if: always()
        run: if [ -d .cross-cache ]; then sudo chown -R "$(id -u):$(id -g)" .cross-cache; fi
      - name: Verify payload bytes, glibc floor and imports
        run: python scripts/computer-use-runtime.py verify ${{ matrix.target }}
      # In a network namespace holding only loopback: the engine has no network
      # client (AD-20), and a contract command that reached out would fail here.
      - name: Contract smoke (no desktop access, no network)
        if: matrix.target != 'win32-x64'
        run: |
          sudo unshare --net -- sh -c \
            'ip link set lo up && exec setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups -- "$@"' sh \
            env HOME="$HOME" PATH="$PATH" python scripts/computer-use-runtime.py contract ${{ matrix.target }}
      - name: Packaging regression tests
        run: python scripts/test-computer-use-packaging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-use-${{ matrix.target }}
          path: target/computer-use/${{ matrix.target }}/
          if-no-files-found: error

  windows:
    name: Check win32-x64 on Windows
    needs: container
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: computer-use-win32-x64
          path: target/computer-use/win32-x64
      - name: Verify payload bytes, console subsystem and imports
        run: python scripts/computer-use-runtime.py verify win32-x64
      # The windows-gnu build is ours, not upstream's (it ships msvc). It must
      # start on Windows with no MinGW runtime DLL beside it (AD-05).
      - name: Contract smoke (no desktop access)
        run: python scripts/computer-use-runtime.py contract win32-x64

  # Upstream's own unit tests for the platform-neutral core, on the vendored tree
  # and Biorouter's toolchain, so a pin move that breaks the core under 1.92 is
  # caught before a payload is built from it.
  upstream-core-tests:
    name: agent-desktop core unit tests
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - name: cargo test -p agent-desktop-core --lib
        env:
          RUSTUP_TOOLCHAIN: "1.92"
        run: cargo test --locked --manifest-path vendor/agent-desktop/source/Cargo.toml -p agent-desktop-core --lib -j 3

  native-release-gate:
    timeout-minutes: 5
    if: always()
    needs: [macos, container, windows, upstream-core-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every target's payload and the core tests
        env:
          MACOS: ${{ needs.macos.result }}
          CONTAINER: ${{ needs.container.result }}
          WINDOWS: ${{ needs.windows.result }}
          CORE: ${{ needs.upstream-core-tests.result }}
        run: test "$MACOS" = success && test "$CONTAINER" = success && test "$WINDOWS" = success && test "$CORE" = success
