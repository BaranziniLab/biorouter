[package]
name = "biorouter-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
biorouter = { path = "../biorouter" }
# The Crew naming rules (name keys, the confusable skeleton, UUID-shaped IDs) the broker also
# applies, so the daemon's resolver and labels agree with it byte for byte.
biorouter-crew = { path = "../biorouter-crew" }
biorouter-mcp = { path = "../biorouter-mcp", features = ["utoipa"] }
rmcp = { workspace = true }
async-trait = "0.1.89"
axum = { version = "0.8.1", features = ["ws", "macros", "multipart"] }
tokio = { workspace = true }
chrono = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = "0.2"
tokio-stream = "0.1"
anyhow = { workspace = true }
bytes = "1.5"
http = "1.0"
base64 = "0.21"
config = { version = "0.15.13", features = ["toml"] }
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde_yaml = "0.9.34"
utoipa = { version = "4.1", features = ["axum_extras", "chrono"] }
reqwest = { version = "0.12.9", features = ["json", "rustls-tls", "blocking", "multipart"], default-features = false }
tokio-util = "0.7.15"
serde_path_to_error = "0.1.20"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
url = "2.5.7"
rand = "0.9.2"
hex = "0.4.3"
# Issue #56 DR-16: the daemon holds the SHA-256 DIGEST of the user-action key,
# never the key. Same 0.10 line the other two crates already pin.
sha2 = "0.10"
# `routes::shell` identifies the exact bytes it previewed with a digest KEYED on
# a per-process secret, so a revision handed to a model is not a reusable
# dictionary-attack hash of the user's local file. The 0.12 line is the one that
# pairs with `sha2` 0.10's `digest` traits.
hmac = "0.12"
socket2 = "0.6.1"
fs2 = "0.4.3"
# `routes::shell` unpacks skill archives and `.brxt` extension bundles, which the
# retired `biorouter-headless` binary used to do with the same crate at the same
# version. `default-features = false` keeps it to the one codec a zip actually
# produced by our tooling uses, exactly as that binary pinned it.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rustls = { version = "0.23", features = ["ring"] }
cap-std = "3"
zeroize = "1"
tempfile = "3.15"
uuid = { version = "1", features = ["v4"] }

# jemalloc only builds on Unix; the mingw windows-gnu cross target can't link it,
# so depend on it only off Windows. Windows uses the system allocator.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }

# `routes::shell` opens a previewed artifact with `O_NOFOLLOW`, which has no
# portable spelling in `std` and a per-architecture value on Linux. Unix only:
# the flag does not exist elsewhere and the code that uses it is `cfg(unix)`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["jemalloc"]
# Use tuned jemalloc as the global allocator for the long-running daemon.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
winreg = { version = "0.55.0" }

[[bin]]
name = "biorouterd"
path = "src/main.rs"

[[bin]]
name = "generate_schema"
path = "src/bin/generate_schema.rs"

[dev-dependencies]
ctor = "0.2"
tower = "0.5"
tempfile = "3.15.0"
env-lock = { workspace = true }
wiremock = { workspace = true }
zip = "8.6.0"
serial_test = { workspace = true }
# `tests/declassify_store_busy.rs` holds `sessions.db`'s write lock from a
# connection outside the daemon's pool, which no public API of `biorouter` can
# do. The same version and features `biorouter` already compiles, so this adds
# no crate to the build.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
# Issue #56 DR-20 / Task 55. This crate's routes raise the OS authentication
# prompt — `POST /sessions/{id}/declassify` and `/config/upsert`'s master-switch
# arm — so its TESTS would type a real password on every run without a stand-in.
#
# ⚠ `[dev-dependencies]` and nowhere else. Under `resolver = "2"` that unifies
# the feature into a test build and NOT into `cargo build`, which is the whole
# reason the seam is reachable here and absent from the shipped daemon. Moving
# this line into `[dependencies]` ships the bypass, and
# `privacy::system_auth::tests::the_test_seam_cannot_be_compiled_into_a_shipped_profile`
# is what turns that into a red build rather than a silent one.
biorouter = { path = "../biorouter", features = ["privacy-test-auth"] }
