[package]
name = "biorouter-sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-scoped sandboxed execution for Biorouter agents (leaf crate; no engine deps)"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
anyhow = { workspace = true }
thiserror = "1.0"
tokio = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
cap-std = "3"
uuid = { version = "1", features = ["v4"] }
cap-fs-ext = "3"

# BR-69 Linux shell sandbox. Both are pure-Rust syscall wrappers (no C
# `libseccomp`/`libseccomp-dev` build dep, no runtime `.so`), so they cross-
# compile cleanly on the pinned `rust:1.92-bullseye` glibc-2.31 image and add
# nothing to the mac/Windows dependency graphs.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
