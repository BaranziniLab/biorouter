[package]
name = "biorouter-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
rmcp = { workspace = true, features = ["server", "client", "transport-io", "macros"] }
biorouter-sandbox = { path = "../biorouter-sandbox" }
# `std::fs::canonicalize` on Windows returns a VERBATIM path (`\\?\C:\…`). The
# Biorouter Copilot payload paths are canonicalized and then reported by
# `biorouter doctor`, so without this they reach the installed-payload
# acceptance check, the CLI's human output and the desktop Diagnostics view in
# a spelling nothing else in the tree uses. `biorouter::system::real_path` has
# applied `dunce::simplified` for the same reason since before this crate
# needed it; MCP cannot import that crate, because the host already depends on
# MCP.
dunce = "1"
aes-gcm = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = "2.5"
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
# RFC-6902 JSON Patch for the Apps SDK v2 shared-state document (agent_drafter).
json-patch = "4.2"
# JSON Schema validation for Apps SDK v2 custom `component` widget props
# (agent_drafter/control.rs). Pinned to the version already used by the
# `biorouter` crate so the workspace resolves a single copy.
jsonschema = "0.30.0"
# Server-side HTML sanitization for the capability-gated `ui_html` tool
# (agent_drafter/control.rs). Fail-closed XSS barrier — see design §3.7.
ammonia = "4.1"
schemars = "1.0"
shellexpand = "3.1.0"
indoc = "2.0.5"
reqwest = { version = "0.11", features = [
    "json",
    "rustls-tls-native-roots",
], default-features = false }
chrono = { version = "0.4.38", features = ["serde"] }
etcetera = { workspace = true }
tempfile = "3.8"
include_dir = "0.7.4"
regex = { workspace = true }
once_cell = "1.20.2"
ignore = { workspace = true }
lopdf = "0.36.0"
pdf-inspector = "0.1"
docx-rs = "0.4.7"
calamine = "0.35"
roxmltree = "0.20"
image = "0.24.9"
umya-spreadsheet = "2.2.3"
utoipa = { version = "4.1", features = ["chrono"], optional = true }
which = {workspace = true}
lru = "0.16"
tree-sitter = "0.26"
streaming-iterator = "0.1"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-ruby = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-r = "1.2"
tree-sitter-julia = "0.23"
tree-sitter-matlab = "1.3"
rayon = "1.10"
libc = "0.2"
# TODO: Fork mpatch or replace with a custom implementation using `similar` crate
# for fuzzy patch matching. Current crate has limited maintenance (single maintainer,
# ~1000 downloads). Pinned to exact version to prevent supply chain attacks.
mpatch = "=0.2.0"
tokio-util = "0.7.16"
# knowledge module deps
zip = { version = "0.6", features = ["deflate"] }
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
sha2 = "0.10"
serde_yaml = "0.9.34"
pdf-extract = "0.10"
htmd = "0.5"
csv = "1.3"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
pdf-writer = "0.15"
bm25 = "2.3"
dashmap = "6"
futures = { workspace = true }
async-trait = "0.1"
fs2 = "0.4.3"
tar = "0.4.46"
flate2 = "1.1.9"
xz2 = "0.1.7"
bzip2 = "0.6.1"

[dev-dependencies]
# Issue #56: `knowledge::tier_user`'s two source audits walk `crates/` to pin the
# set of files that may name the proof-of-user or write the tier store.
walkdir = "2.5.0"
sysinfo = "0.32.1"
temp-env = "0.3.6"
colored = "2"
serial_test = { workspace = true }
wiremock = { workspace = true }
env-lock = { workspace = true }
# `test_tracing`'s before-main registration in this crate's own test binary.
ctor = "0.2"

[features]
utoipa = ["dep:utoipa"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }
