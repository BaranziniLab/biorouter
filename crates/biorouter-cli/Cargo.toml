[package]
name = "biorouter-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "biorouter"
path = "src/main.rs"

[dependencies]
biorouter = { path = "../biorouter" }
# The dictation worker's entry point (DD-4); the engine runs in a worker process.
biorouter-dictation = { path = "../biorouter-dictation", optional = true, features = ["engine"] }
# `biorouter transcribe` reads recordings (DD-78): WAV of any rate, channel count and
# depth, AIFF, FLAC and MP3. In this crate only: the engine and the daemon take 16 kHz
# PCM and never parse a file. No SIMD features.
#
# `biorouter transcribe` reads WAV, AIFF, FLAC, MP3, M4A and MP4 (AAC), raw AAC (ADTS) and
# Ogg (Vorbis or FLAC), so a phone's or a Mac's voice memo transcribes without `ffmpeg`
# (DD-78 as O-39 changed it). DD-78's own rule left out the AAC decoder, the MP4 reader, the
# Vorbis decoder and the Ogg reader when symphonia passed 1.5 MB with them; the owner lifted
# that gate on 2026-11-06. With them the stripped release `biorouter` on macOS arm64 grew
# by 949,904 to 1,097,360 B (three PR-12b builds against the commit before it, 2026-11-07),
# and they add 1,115,736 B to a stripped Linux x86_64 probe built in the release image and
# 1,081,624 B to a macOS x86_64 one [M]; the size ceilings that hold `biorouter` are
# `dictation_size_ceiling` in scripts/smoke-test-release-artifacts.sh.
# Apple Lossless (ALAC) in an M4A, which Voice Memos writes when set to Lossless, joined on
# 2026-11-13 (O-41, decided by the owner), adding 11,924 B of code and data to the stripped
# release `biorouter` on macOS arm64, 96 B of file size because it fit in the segments' page
# padding [M].
# Opus (symphonia 0.5 has no decoder) and WebM are refused with an `ffmpeg` line that
# converts them.
symphonia = { version = "0.5.5", optional = true, default-features = false, features = ["wav", "pcm", "aiff", "flac", "mp3", "aac", "isomp4", "vorbis", "ogg", "alac"] }
# The terminal's microphone (PR-25, DD-5, DD-73): the child side of
# `biorouter __br-dictation-worker capture`, over the vendored miniaudio. Only this crate
# depends on it, so `biorouterd` never links capture code (P-10).
biorouter-dictation-capture = { path = "../biorouter-dictation-capture", optional = true }
biorouter-acp = { path = "../biorouter-acp" }
biorouter-bench = { path = "../biorouter-bench" }
biorouter-mcp = { path = "../biorouter-mcp" }
rmcp = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
cliclack = "0.3.5"
console = "0.16.1"
uuid = { version = "1.11", features = ["v4"] }
dotenvy = "0.15.7"
# `serve` derives the interface bundle and the daemon from the real path of the
# running executable, and on Windows `canonicalize` hands back a verbatim
# `\\?\C:\…` path that must not reach a message or a child's environment. The
# stripping itself now lives in `biorouter::system::real_path`, beside the
# installer that has to spell those paths the same way; what is left here is the
# Windows-only test that pins the behaviour at the string level.
dunce = "1"
bat = "0.25.0"
pulldown-cmark = { version = "0.13", default-features = false }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { version = "1.0", features = ["derive"] }  # For serialization
serde_yaml = "0.9"
tempfile = "3"
etcetera = { workspace = true }
rand = "0.8.5"
rustyline = "15.0.0"
tracing = { workspace = true }
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = "0.2"
shlex = "1.3.0"
async-trait = "0.1.89"
base64 = "0.22.1"
regex = "1.11.1"
tar = "0.4"
zip = "0.6"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
# Web server dependencies
axum = { version = "0.8.1", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "auth"] }
http = "1.0"
webbrowser = {workspace = true}
indicatif = "0.18.1"
tokio-util = { version = "0.7.15", features = ["compat", "rt"] }
anstream = "0.6.18"
open = "5.3.2"
urlencoding = "2.1"
clap_complete = "4.5.62"
arboard = "3.6.1"
url = "2.5.4"
zeroize = "1"
sha2 = "0.10"
tokio-tungstenite = "0.28"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# jemalloc only builds on Unix; the mingw windows-gnu cross target can't link it,
# so depend on it only off Windows. Windows uses the system allocator.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["wincred"] }

# `serve` asks the daemon it started to stop with SIGTERM before it kills it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["jemalloc", "local-dictation", "dictation"]
# Use tuned jemalloc as the global allocator (returns freed pages to the OS).
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# The local dictation engine (DD-5). The direct dependency is for `main()`'s
# `biorouter_dictation::worker::run_if_invoked()`.
local-dictation = ["biorouter/local-dictation", "dep:biorouter-dictation"]
# The terminal's dictation commands: `biorouter transcribe` and its file decoders
# (PR-12), and `biorouter dictate` with the capture child (PR-25). Without it
# `transcribe` and `dictate` answer MSG-NO-ENGINE.
dictation = ["local-dictation", "dep:symphonia", "dep:biorouter-dictation-capture"]

[dev-dependencies]
tempfile = "3"
# `src/test_sandbox.rs` runs before `main`, which is the only placement that can
# win the race against the one-shot cells (`GLOBAL_CONFIG`, `SHARED_STORE_ROOT`)
# a test would otherwise pin at the developer's real config and session store.
ctor = "0.2"
temp-env = { version = "0.3.6", features = ["async_closure"] }
test-case = "3.3"
tokio = { workspace = true }
serial_test = { workspace = true }
# The workspace's process-wide environment lock, so env-mutating tests here
# exclude every other one rather than only the `#[serial]` ones.
env-lock = { workspace = true }
# A WebSocket client, so `commands::web`'s tests can drive the page's socket the
# way the page does. The version axum's `ws` feature already locks.
tokio-tungstenite = "0.28.0"
# Issue #56 DR-20 / Task 55. `biorouter session declassify <id>` raises the OS
# authentication prompt, so its TESTS would type a real password on every run
# without a stand-in.
#
# ⚠ `[dev-dependencies]` and nowhere else. Under `resolver = "2"` that unifies
# the feature into a test build and NOT into `cargo build`, which is the whole
# reason the seam is reachable here and absent from the shipped CLI. Moving this
# line into `[dependencies]` ships the bypass, and
# `privacy::system_auth::tests::the_test_seam_cannot_be_compiled_into_a_shipped_profile`
# is what turns that into a red build rather than a silent one.
biorouter = { path = "../biorouter", features = ["privacy-test-auth"] }
