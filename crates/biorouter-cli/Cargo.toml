[package]
name = "biorouter-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "biorouter"
path = "src/main.rs"

[dependencies]
biorouter = { path = "../biorouter" }
biorouter-acp = { path = "../biorouter-acp" }
biorouter-bench = { path = "../biorouter-bench" }
biorouter-mcp = { path = "../biorouter-mcp" }
rmcp = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
cliclack = "0.3.5"
console = "0.16.1"
uuid = { version = "1.11", features = ["v4"] }
dotenvy = "0.15.7"
# `serve` derives the interface bundle and the daemon from the real path of the
# running executable, and on Windows `canonicalize` hands back a verbatim
# `\\?\C:\…` path that must not reach a message or a child's environment. The
# stripping itself now lives in `biorouter::system::real_path`, beside the
# installer that has to spell those paths the same way; what is left here is the
# Windows-only test that pins the behaviour at the string level.
dunce = "1"
bat = "0.25.0"
pulldown-cmark = { version = "0.13", default-features = false }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { version = "1.0", features = ["derive"] }  # For serialization
serde_yaml = "0.9"
tempfile = "3"
etcetera = { workspace = true }
rand = "0.8.5"
rustyline = "15.0.0"
tracing = { workspace = true }
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = "0.2"
shlex = "1.3.0"
async-trait = "0.1.89"
base64 = "0.22.1"
regex = "1.11.1"
tar = "0.4"
zip = "0.6"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
# Web server dependencies
axum = { version = "0.8.1", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "auth"] }
http = "1.0"
webbrowser = {workspace = true}
indicatif = "0.18.1"
tokio-util = { version = "0.7.15", features = ["compat", "rt"] }
anstream = "0.6.18"
open = "5.3.2"
urlencoding = "2.1"
clap_complete = "4.5.62"
arboard = "3.6.1"
url = "2.5.4"
zeroize = "1"

# jemalloc only builds on Unix; the mingw windows-gnu cross target can't link it,
# so depend on it only off Windows. Windows uses the system allocator.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["wincred"] }

[features]
default = ["jemalloc"]
# Use tuned jemalloc as the global allocator (returns freed pages to the OS).
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dev-dependencies]
tempfile = "3"
temp-env = { version = "0.3.6", features = ["async_closure"] }
test-case = "3.3"
tokio = { workspace = true }
serial_test = { workspace = true }
# The workspace's process-wide environment lock, so env-mutating tests here
# exclude every other one rather than only the `#[serial]` ones.
env-lock = { workspace = true }
# Issue #56 DR-20 / Task 55. `biorouter session declassify <id>` raises the OS
# authentication prompt, so its TESTS would type a real password on every run
# without a stand-in.
#
# ⚠ `[dev-dependencies]` and nowhere else. Under `resolver = "2"` that unifies
# the feature into a test build and NOT into `cargo build`, which is the whole
# reason the seam is reachable here and absent from the shipped CLI. Moving this
# line into `[dependencies]` ships the bypass, and
# `privacy::system_auth::tests::the_test_seam_cannot_be_compiled_into_a_shipped_profile`
# is what turns that into a red build rather than a silent one.
biorouter = { path = "../biorouter", features = ["privacy-test-auth"] }
