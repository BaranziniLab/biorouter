[package]
name = "biorouter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[build-dependencies]
tokio = { workspace = true }
reqwest = { version = "0.12.9", features = ["json", "rustls-tls-native-roots"], default-features = false }

[dependencies]
lru = "0.16"
rmcp = { workspace = true, features = [
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
anyhow = { workspace = true }
thiserror = "1.0"
futures = { workspace = true }
dirs = "5.0"
# `system::real_path` canonicalises a path before it is shown to a user, written
# into the CLI install breadcrumb, or handed to a child process. On Windows
# `canonicalize` returns a verbatim `\\?\C:\…` path, which is not universally
# accepted; `dunce::simplified` strips the prefix when the plain form means the
# same thing and is the identity everywhere else.
dunce = "1"
reqwest = { version = "0.12.9", features = [
    "rustls-tls-native-roots",
    "json",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "charset",
    "http2",
    "stream",
    "blocking"
], default-features = false }
tokio = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
jsonschema = "0.30.0"
uuid = { version = "1.0", features = ["v4", "v7"] }
regex = { workspace = true }
async-trait = "0.1.89"
async-stream = "0.3"
minijinja = { version = "2.12.0", features = ["loader"] }
include_dir = "0.7.4"
tiktoken-rs = "0.6.0"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
indoc = "2.0.5"
nanoid = "0.4"
sha2 = "0.10"
base64 = "0.21"
url = "2.5"
axum = "0.8.1"
webbrowser = {workspace = true}
lazy_static = "1.5.0"
shlex = "1.3"
tracing = { workspace = true }
tracing-subscriber = "0.3"
keyring ={ version = "3.6.2", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
serde_yaml = "0.9.34"
once_cell = "1.20.2"
etcetera = { workspace = true }
rand = "0.8.5"
utoipa = { version = "4.1", features = ["chrono"] }
tokio-cron-scheduler = "0.14.0"
urlencoding = "2.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "json"] }

# For Bedrock provider (feature-gated: `aws-providers`)
aws-config = { version = "=1.8.12", features = ["behavior-version-latest"], optional = true }
aws-smithy-types = { version = "=1.3.5", optional = true }
aws-sdk-bedrockruntime = { version = "=1.120.0", optional = true }

# For SageMaker TGI provider (feature-gated: `aws-providers`)
aws-sdk-sagemakerruntime = { version = "1.62.0", optional = true }

# For GCP Vertex AI provider auth
jsonwebtoken = "9.3.1"

blake3 = "1.5"
fs2 = "0.4.3"
tokio-stream = "0.1.17"
tempfile = "3.15.0"
# Builds a real PDF for the knowledge source-ingest end-to-end test, so the
# acceptance criterion ("ingest local PDFs") is exercised through the real
# converter rather than approximated with markdown. Same version biorouter-mcp
# uses for the PDF converter's own tests.
pdf-writer = "0.15"
dashmap = "6.1"
ahash = "0.8"
tokio-util = { version = "0.7.15", features = ["compat"] }
unicode-normalization = "0.1"
biorouter-mcp = { path = "../biorouter-mcp" }
zip = "0.6"
sys-info = "0.9"

schemars = { version = "1.0.4", default-features = false, features = ["derive"] }
insta = "1.43.2"
paste = "1.0.0"
shellexpand = "3.1.1"
indexmap = "2.12.0"
ignore = { workspace = true }
which = { workspace = true}
# BR-43 shadow-git checkpoints. Same vendored libgit2 the workspace already
# builds for biorouter-mcp (crates/biorouter-mcp/Cargo.toml).
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
boa_engine = "0.21.0"
unbinder = "0.1.7"

[features]
default = ["aws-providers"]
# Bedrock + SageMaker providers pull the AWS SDK (~23 crates). Default-on so the
# shipped app is unchanged; build with `--no-default-features` (e.g. a headless
# CLI-only package that doesn't need AWS) to drop them for a lighter/faster build.
aws-providers = [
    "dep:aws-config",
    "dep:aws-smithy-types",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-sdk-sagemakerruntime",
]
# DR-20's test seam: compiles a stand-in for the declassification system prompt
# so testing does not mean typing a password on every run.
#
# ⚠ NON-DEFAULT, and it must stay that way. It must never appear in any crate's
# `[dependencies]` features list — only in `[dev-dependencies]`, where
# resolver = "2" unifies it into a test build and not into `cargo build`. The
# real boundary is the `cfg(all(debug_assertions, feature = "privacy-test-auth"))`
# on `privacy/system_auth_seam.rs` plus the `compile_error!` in `src/lib.rs`;
# this line only makes the feature nameable.
privacy-test-auth = []

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["wincred"] }
# DR-24's Windows prompter: Windows Hello via
# `Windows.Security.Credentials.UI.UserConsentVerifier`
# (privacy/system_auth_windows.rs). WinRT async (`IAsyncOperation::get`) comes
# from `windows-future`, a non-optional dependency of this crate.
windows = { version = "0.61", features = ["Security_Credentials_UI"] }

# DR-24's macOS prompter: `LAContext.evaluatePolicy(.deviceOwnerAuthentication)`
# (privacy/system_auth_macos.rs). Raw runtime access rather than
# `objc2-local-authentication`, so the whole framework binding is two crates the
# workspace already resolves transitively; `block2` is the `reply:` callback.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# Peer verification for the auth helper's reply (privacy/system_auth_macos.rs).
# The daemon asks the kernel WHICH process is on the other end of the socket and
# then asks Security.framework whether that process is signed by our Team ID —
# so forging an approval needs a binary we signed, not merely a process running
# as the same user. `core-foundation` supplies the CFDictionary/CFNumber the
# guest-attribute lookup takes; both crates are already in the lock file.
core-foundation = "0.9"
core-foundation-sys = "0.8"

# Managed-policy ownership verification (BR-65) reads the effective uid via
# `geteuid` to trust a root- or current-user-owned policy file.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
agent-client-protocol-schema = "0.10.5"
tempfile = "3.15.0"
serde_yaml = "0.9.34"
criterion = "0.5"
serial_test = { workspace = true }
mockall = "0.13.1"
wiremock = { workspace = true }
# `test-util` is NOT part of tokio's `full`, and it is what gives
# `#[tokio::test(start_paused = true)]` its auto-advancing clock. Without it the
# P-05 timeout test would have to sit through the real 60-second
# `PROMPT_TIMEOUT`, which is the kind of cost that gets a test deleted.
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { version = "0.7.15", features = ["compat"] }
temp-env = "0.3.6"
dotenvy = "0.15.7"
ctor = "0.2.9"
test-case = "3.3"
pdf-writer = "0.15"
env-lock = { workspace = true }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
# Test-only: construct synthetic `SdkError` values (HTTP status + body) to unit-test
# the Bedrock error classifier without a live endpoint. Already a transitive dep of
# aws-sdk-bedrockruntime; pinned to the same resolved version.
aws-smithy-runtime-api = "=1.9.3"
# Test-only: the privacy `floor` caller audit walks `crates/**/*.rs` to assert that
# the single crossing between the capability and classification lattices has exactly
# the caller set it is supposed to have. Already resolved at 2.5.0 transitively, so
# this adds no new package to the lock.
walkdir = "2.5.0"
aws-smithy-http-client = { version = "=1.1.5", default-features = false, features = ["test-util"] }

[[example]]
name = "agent"
path = "examples/agent.rs"

[[example]]
name = "databricks_oauth"
path = "examples/databricks_oauth.rs"

[[bin]]
name = "build_canonical_models"
path = "src/providers/canonical/build_canonical_models.rs"
